PKG_TRANSLATIONS="Übersetzer-Feedback-Schleife"
PKG_TRANSLATIONS_XML_DESCRIPTION="Die Übersetzer-Feedback-Schleife: Übersetzt Ihre Inhalte, bewahrt die von Übersetzern vorgenommenen Korrekturen und leitet daraus Regeln ab, die die nächste Übersetzung unterstützen. Installiert die Komponente sowie die zugehörigen Plugins."
