PKG_TRANSLATIONS="Цикл обратной связи переводчика"
PKG_TRANSLATIONS_XML_DESCRIPTION="Цикл обратной связи переводчика: переводит содержимое вашего сайта, сохраняет правки, внесённые переводчиками, и формирует из них правила, направляющие последующий перевод. Устанавливает компонент и работающие с ним плагины."
