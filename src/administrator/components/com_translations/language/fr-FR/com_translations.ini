COM_TRANSLATIONS_CONFIGURATION="Configuration des traductions"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_DESC="Publier une traduction dès sa création, avant qu'un traducteur ne l'ait relue. Une traduction dont l'original n'est pas publié attend que celui-ci le soit. La retraduction d'un article n'est pas affectée : elle conserve l'état de publication qu'elle a déjà."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_LABEL="Publication automatique des nouvelles traductions"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_DESC="Publier une règle distillée dès sa création, afin qu'elle atteigne la prochaine traduction avant qu'un traducteur ne l'ait révisée. Le raffinement d'une règle existante n'est pas affecté : elle conserve l'état qu'elle a déjà."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_LABEL="Publication automatique des nouvelles règles"
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_DESC="Le nombre de caractères de la source qu'une demande vers le fournisseur de traduction vise à transporter. Un article plus long que cela est traduit en plusieurs parties, découpé entre les balises HTML, sur autant d'exécutions de la tâche de traduction qu'il en faut. Le fournisseur doit retourner l'intégralité de la traduction, c'est donc ce qui détermine la durée d'une demande et si elle tient dans le temps que votre hébergement accorde à une demande web : réduisez-le si les articles longs expirent, augmentez-le pour des demandes moins nombreuses et mieux informées lorsque votre hébergement accorde un temps généreux à une demande web. Exécutez la tâche de traduction sur le web plutôt qu'en ligne de commande : voir le guide d'utilisation sous « La traduction nécessite le web, pas la ligne de commande ». Le minimum est de 1000."
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_LABEL="Caractères par requête"
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_DESC="Où se trouvent les images traduites, une ligne par dossier : <code>source folder = translated folder</code>, à partir de la racine du site. Dans le dossier traduit, <code>{language}</code> représente le tag de langue (nl-NL) et <code>{lang}</code> son code (nl). Une image sous le dossier source dont la traduction a le même chemin sous le dossier traduit est affichée traduite. Le dossier le plus spécifique est prioritaire."
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_LABEL="Dossiers d'images traduites"
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_DESC="Le code <code>{lang}</code> représente, pour une langue dont le code n'est pas la première partie de son tag : une ligne par langue, <code>language tag = code</code>, comme <code>pt-BR = ptbr</code>."
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_LABEL="Codes de langue pour les images"
COM_TRANSLATIONS_CONFIG_LOG_DAYS_DESC="Le nombre de jours pendant lesquels une demande enregistrée dans le journal est conservée. Les plus anciennes sont supprimées au fur et à mesure que de nouvelles sont enregistrées."
COM_TRANSLATIONS_CONFIG_LOG_DAYS_LABEL="Conserver les demandes enregistrées (jours)"
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_DESC="Enregistrer chaque demande envoyée vers un fournisseur de traduction ou de distillation dans la table de base de données #__translations_log : les textes, règles, contexte et termes envoyés, la réponse, et les chiffres permettant d'ajuster les paramètres - caractères, règles de chaque type, les plafonds en vigueur, le temps pris et le résultat. Pour comprendre pourquoi une traduction est sortie telle quelle. Les textes font grossir rapidement la table, donc activez-la pendant que vous examinez un problème."
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_LABEL="Journal (log) des demandes"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_DESC="La langue de contenu dans laquelle les éléments sont rédigés. La file d'attente répertorie les éléments dans cette langue comme les originaux à traduire."
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_LABEL="Langue source"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_WARNING="Modifier la langue source après que des retours et des règles ont été collectés rend tout cet apprentissage inutilisable, car il est lié à la langue source d'origine. (Il est suggéré de définir la langue source une seule fois.)"
COM_TRANSLATIONS_CONFIG_TRANSLATED_IMAGES_DESC="Pour les sites de documentation avec des captures d'écran traduites. Une traduction affiche la version traduite d'une image lorsque celle-ci se trouve sur le site, dans le dossier indiqué ci-dessous pour sa langue, et l'image d'origine lorsqu'elle ne s'y trouve pas. Les images ajoutées ultérieurement sont prises en compte par la tâche Mettre les traductions antérieures en conformité avec leur source, avec Liens vérifié."
COM_TRANSLATIONS_CONFIG_TRANSLATED_IMAGES_LABEL="Images traduites"
