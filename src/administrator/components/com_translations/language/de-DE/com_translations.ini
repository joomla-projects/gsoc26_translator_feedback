COM_TRANSLATIONS_ALLOW_TRANSLATION="Übersetzung erlauben"
COM_TRANSLATIONS_ALLOW_TRANSLATION_DESC="Die Markierung „keine Übersetzung nötig“ entfernen, damit dieser Eintrag erneut übersetzt werden kann."
COM_TRANSLATIONS_ALLOW_TRANSLATION_ERROR="Der Eintrag, für den die Übersetzung erlaubt werden soll, konnte nicht identifiziert werden."
COM_TRANSLATIONS_ALLOW_TRANSLATION_SUCCESS="Dieser Eintrag kann erneut übersetzt werden."
COM_TRANSLATIONS_CONFIGURATION="Übersetzungen-Konfiguration"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_DESC="Eine Übersetzung sofort veröffentlichen, sobald sie erstellt wurde, bevor ein Übersetzer sie geprüft hat. Eine Übersetzung, deren Original nicht veröffentlicht ist, wartet, bis das Original veröffentlicht wird. Eine erneute Übersetzung eines Eintrags ist davon nicht betroffen: Sie behält den Veröffentlichungsstatus, den sie bereits hat."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_LABEL="Neue Übersetzungen automatisch veröffentlichen"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_DESC="Eine ausgearbeitete Regel sofort veröffentlichen, sobald sie erstellt wurde, sodass sie die nächste Übersetzung erreicht, bevor ein Übersetzer sie geprüft hat. Die Überarbeitung einer bestehenden Regel ist davon nicht betroffen: Sie behält den Status, den sie bereits hat."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_LABEL="Neue Regeln automatisch veröffentlichen"
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_DESC="Wie viele Zeichen des Quelltextes eine Anfrage an den Übersetzungsanbieter umfassen soll. Ein Eintrag, der länger ist als dies, wird in Teilen übersetzt, getrennt zwischen HTML-Tags, über so viele Durchläufe der Übersetzungsaufgabe, wie nötig sind. Der Anbieter muss die gesamte Übersetzung zurückschreiben, daher entscheidet dieser Wert darüber, wie lange eine Anfrage dauert und ob sie in die Zeit passt, die Ihr Hosting einer Web-Anfrage gibt: Den Wert verringern, falls lange Einträge in ein Timeout laufen, ihn erhöhen für weniger, aber besser informierte Anfragen, wenn das Hosting einer Web-Anfrage eine großzügige Zeit einräumt. Die Übersetzungsaufgabe über das Web ausführen, nicht über die Kommandozeile: siehe Benutzerhandbuch unter „Übersetzen benötigt das Web, nicht die Kommandozeile“. Der kleinste Wert ist 1000."
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_LABEL="Zeichen pro Anfrage"
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_DESC="Wo sich die übersetzten Bilder befinden, eine Zeile pro Verzeichnis: <code>source folder = translated folder</code>, ausgehend vom Root der Website. Im übersetzten Verzeichnis steht <code>{language}</code> für das Sprach-Tag (nl-NL) und <code>{lang}</code> für dessen Code (nl). Ein Bild unterhalb des Quellverzeichnisses, dessen Übersetzung denselben Pfad unterhalb des übersetzten Verzeichnisses hat, wird übersetzt angezeigt. Das spezifischste Verzeichnis entscheidet."
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_LABEL="Übersetzte Bildverzeichnisse"
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_DESC="Wofür der Code <code>{lang}</code> steht, bei einer Sprache, deren Code nicht der erste Teil ihres Tags ist: eine Zeile pro Sprache, <code>language tag = code</code>, zum Beispiel <code>pt-BR = ptbr</code>."
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_LABEL="Sprachcodes für Bilder"
COM_TRANSLATIONS_CONFIG_LOG_DAYS_DESC="Wie viele Tage eine protokollierte Anfrage aufbewahrt wird. Ältere werden entfernt, sobald neue protokolliert werden."
COM_TRANSLATIONS_CONFIG_LOG_DAYS_LABEL="Protokollierte Anfragen aufbewahren (Tage)"
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_DESC="Jede Anfrage, die an einen Übersetzungs- oder Destillationsanbieter gesendet wird, in der Datenbanktabelle #__translations_log speichern: die gesendeten Texte, Regeln, den Kontext und die Begriffe, die Antwort sowie die Werte zum Abstimmen der Einstellungen – Zeichen, Regeln jeder Art, die geltenden Obergrenzen, die benötigte Zeit und das Ergebnis. Zum Herausfinden, warum eine Übersetzung so ausgefallen ist, wie sie ist. Die Texte lassen die Tabelle schnell anwachsen, daher dies nur einschalten, während man etwas untersucht."
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_LABEL="Anfragen protokollieren"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_DESC="Die Inhaltssprache, in der Einträge verfasst werden. Die Warteschlange listet Einträge in dieser Sprache als die zu übersetzenden Originale auf."
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_LABEL="Quellsprache"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_WARNING="Das Ändern der Quellsprache, nachdem Feedback und Regeln gesammelt wurden, macht all dieses Gelernte unbrauchbar, da es an die ursprüngliche Quellsprache gebunden ist. (Es wird empfohlen, die Quellsprache nur einmal festzulegen.)"
COM_TRANSLATIONS_CONFIG_TRANSLATED_IMAGES_DESC="Für Dokumentations-Websites mit übersetzten Screenshots. Eine Übersetzung zeigt die übersetzte Version eines Bildes dort an, wo diese auf der Website vorhanden ist, im unten für die jeweilige Sprache angegebenen Verzeichnis, und andernfalls das Originalbild. Später hinzugefügte Bilder werden von der Aufgabe „Frühere Übersetzungen mit ihrer Quelle abgleichen“ erfasst, wenn „Mit Links“ aktiviert ist."
COM_TRANSLATIONS_CONFIG_TRANSLATED_IMAGES_LABEL="Übersetzte Bilder"
