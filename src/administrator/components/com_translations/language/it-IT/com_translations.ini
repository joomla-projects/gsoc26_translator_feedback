COM_TRANSLATIONS_ALLOW_TRANSLATION="Consenti traduzione"
COM_TRANSLATIONS_ALLOW_TRANSLATION_DESC="Rimuove il contrassegno 'non necessario' in modo che questo elemento possa essere tradotto di nuovo."
COM_TRANSLATIONS_ALLOW_TRANSLATION_ERROR="Non è stato possibile identificare l'elemento per cui consentire la traduzione."
COM_TRANSLATIONS_ALLOW_TRANSLATION_SUCCESS="Questo elemento può essere tradotto di nuovo."
COM_TRANSLATIONS_CONFIGURATION="Configurazione traduzioni"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_DESC="Pubblica una traduzione non appena viene creata, prima che un traduttore l'abbia revisionata. Una traduzione il cui originale non è pubblicato attende finché l'originale non lo è. Ritradurre un elemento non è influenzato: mantiene lo stato di pubblicazione che ha già."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_LABEL="Pubblicazione automatica nuove traduzioni"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_DESC="Pubblica una regola distillata non appena viene creata, in modo che raggiunga la traduzione successiva prima che un traduttore l'abbia revisionata. Il perfezionamento di una regola esistente non è influenzato: mantiene lo stato che ha già."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_LABEL="Pubblica automaticamente nuove regole"
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_DESC="Quanti caratteri del sorgente una richiesta al fornitore di traduzione punta a trasportare. Un elemento più lungo di questo viene tradotto in parti, tagliato tra i tag HTML, su tanti cicli dell'attività di traduzione quanti ne servono. Il fornitore deve scrivere l'intera traduzione, quindi questo è ciò che determina quanto dura una richiesta e se rientra nel tempo che il tuo hosting concede a una richiesta web: abbassalo se gli elementi lunghi vanno in timeout, alzalo per avere meno richieste e più informate quando il tuo hosting concede un tempo generoso a una richiesta web. Esegui l'attività di traduzione via web piuttosto che da riga di comando: vedi la guida utente alla voce \"Tradurre richiede il web, non la riga di comando\". Il minimo è 1000."
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_LABEL="Caratteri per richiesta"
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_DESC="Dove si trovano le immagini tradotte, una linea per cartella: <code>source folder = translated folder</code>, dalla radice del sito. Nella cartella tradotta, <code>{language}</code> sta per il tag della lingua (nl-NL) e <code>{lang}</code> per il suo codice (nl). Un'immagine sotto la cartella di origine la cui traduzione ha lo stesso percorso sotto la cartella tradotta viene mostrata tradotta. La cartella più specifica decide."
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_LABEL="Cartelle Immagini Tradotte"
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_DESC="Il codice <code>{lang}</code> sta per, per una lingua il cui codice non è la prima parte del suo tag: una linea per lingua, <code>language tag = code</code>, come <code>pt-BR = ptbr</code>."
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_LABEL="Codici Lingua per Immagini"
COM_TRANSLATIONS_CONFIG_LOG_DAYS_DESC="Per quanti giorni viene conservata una richiesta registrata. Le più vecchie vengono rimosse man mano che se ne registrano di nuove."
COM_TRANSLATIONS_CONFIG_LOG_DAYS_LABEL="Conserva le richieste registrate (giorni)"
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_DESC="Memorizza ogni richiesta inviata a un fornitore di traduzione o distillazione nella tabella del database #__translations_log: i testi, le regole, il contesto e i termini inviati, la risposta e i numeri per calibrare le impostazioni - caratteri, regole di ogni tipo, i limiti in vigore, il tempo impiegato e l'esito. Serve per scoprire perché una traduzione è risultata così com'è. I testi fanno crescere rapidamente la tabella, quindi attivala mentre stai approfondendo qualcosa."
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_LABEL="Registra le richieste"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_DESC="La lingua dei contenuti in cui gli elementi sono redatti. La coda elenca gli elementi in questa lingua come originali da tradurre."
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_LABEL="Lingua di origine"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_WARNING="Cambiare la lingua di origine dopo che sono stati raccolti feedback e regole rende inutilizzabile tutto quell'apprendimento, poiché è legato alla lingua di origine originale (si consiglia di impostare la lingua di origine una sola volta)."
COM_TRANSLATIONS_CONFIG_TRANSLATED_IMAGES_DESC="Per siti di documentazione con schermate tradotte. Una traduzione mostra la versione tradotta di un'immagine dove questa è presente sul sito, nella cartella indicata di seguito per la sua lingua, e l'immagine originale dove non lo è. Le immagini aggiunte successivamente vengono rilevate dall'attività Allinea Traduzioni Precedenti alla Loro Origine, con Link verificato."
