COM_TRANSLATIONS_ALLOW_TRANSLATION_SUCCESS="Dit item kan opnieuw vertaald worden."
COM_TRANSLATIONS_CONFIGURATION="Vertalingen Instellingen"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_DESC="Publiceer een vertaling zodra deze is gemaakt, voordat een vertaler deze heeft nagekeken. Een vertaling waarvan het origineel niet is gepubliceerd wacht totdat het origineel dat wel is. Het opnieuw vertalen van een item heeft hier geen invloed op: het behoudt de gepubliceerde status die het al heeft."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_LABEL="Nieuwe Vertalingen Automatisch Publiceren"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_DESC="Publiceer een gedistilleerde regel zodra deze is aangemaakt, zodat deze de volgende vertaling bereikt voordat een vertaler die heeft beoordeeld. Het verfijnen van een bestaande regel wordt hierdoor niet beïnvloed: deze behoudt de status die hij al heeft."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_LABEL="Nieuwe Regels Automatisch Publiceren"
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_DESC="Hoeveel tekens van de bron één verzoek aan de vertaalprovider probeert te bevatten. Een item dat langer is dan dit wordt in delen vertaald, geknipt tussen HTML-tags, over zoveel taakuitvoeringen als nodig is. De provider moet de hele vertaling terugschrijven, dus dit bepaalt hoe lang een verzoek duurt en of het past binnen de tijd die uw hosting aan een webverzoek geeft: verlaag dit als lange items een time-out krijgen, verhoog het voor minder en beter geïnformeerde verzoeken als uw hosting een webverzoek ruim de tijd geeft. Voer de vertaaltaak via het web uit in plaats van via de opdrachtregel: zie de gebruikershandleiding onder \"Vertalen heeft het web nodig, niet de opdrachtregel\". Het minimum is 1000."
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_LABEL="Tekens per Verzoek"
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_DESC="Waar de vertaalde afbeeldingen staan, één regel per map: <code>source folder = translated folder</code>, vanaf de hoofdmap van de website. In de vertaalde map staat <code>{language}</code> voor de taaltag (nl-NL) en <code>{lang}</code> voor de code ervan (nl). Een afbeelding onder de bronmap waarvan de vertaling hetzelfde pad onder de vertaalde map heeft, wordt vertaald getoond. De meest specifieke map beslist."
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_LABEL="Vertaalde afbeeldingsmappen"
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_DESC="De code <code>{lang}</code> staat voor, voor een taal waarvan de code niet het eerste deel van de taaltag is: één regel per taal, <code>language tag = code</code>, zoals <code>pt-BR = ptbr</code>."
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_LABEL="Taalcodes voor afbeeldingen"
COM_TRANSLATIONS_CONFIG_LOG_DAYS_DESC="Hoeveel dagen een gelogd verzoek bewaard blijft. Oudere worden verwijderd zodra nieuwe worden gelogd."
COM_TRANSLATIONS_CONFIG_LOG_DAYS_LABEL="Gelogde verzoeken bewaren (dagen)"
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_DESC="Sla elk verzoek dat naar een vertaal- of distillatieprovider wordt gestuurd op in de databasetabel #__translations_log: de verzonden teksten, regels, context en woorden, het antwoord, en de getallen om de instellingen op af te stemmen - tekens, regels per type, de geldende limieten, de benodigde tijd en het resultaat. Om uit te zoeken waarom een vertaling er zo uitkwam. De teksten laten de tabel snel groeien, dus zet dit aan terwijl u iets onderzoekt."
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_LABEL="Verzoeken loggen"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_DESC="De contenttaal waarin items zijn geschreven. De wachtrij toont items in deze taal als de originelen die vertaald moeten worden."
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_LABEL="Brontaal"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_WARNING="Het wijzigen van de brontaal nadat feedback en regels zijn verzameld, maakt al dat geleerde onbruikbaar, omdat het gekoppeld is aan de oorspronkelijke brontaal. (Het wordt aangeraden om de brontaal maar één keer in te stellen.)"
COM_TRANSLATIONS_CONFIG_TRANSLATED_IMAGES_DESC="Voor documentatiewebsites met vertaalde schermafbeeldingen. Een vertaling toont de vertaalde versie van een afbeelding waar die op de website aanwezig is, in de map die hieronder voor die taal is opgegeven, en anders de originele afbeelding. Afbeeldingen die later worden toegevoegd, worden opgepikt door de taak Eerdere Vertalingen in Lijn Brengen met hun Bron, met links aangevinkt."
