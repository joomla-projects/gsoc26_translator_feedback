COM_TRANSLATIONS_CONFIGURATION="Настройки переводов"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_DESC="Публикация перевода сразу после создания, ещё до того, как его просмотрит переводчик. Перевод, оригинал которого не опубликован, ожидает публикации оригинала. Это не касается повторного перевода элемента: он сохраняет уже имеющееся у него состояние публикации."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_LABEL="Автоматическая публикация новых переводов"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_DESC="Публиковать упрощенное правило сразу после его создания, чтобы оно достигло следующего перевода до того, как его проверит переводчик. Уточнение существующего правила не затрагивается: оно сохраняет уже имеющееся состояние."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_LABEL="Автоматически публиковать новые правила"
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_DESC="Сколько символов исходного текста должен охватывать один запрос к провайдеру перевода. Элемент длиннее этого значения переводится по частям, разбитым между HTML-тегами, за столько проходов задачи перевода, сколько потребуется. Провайдер должен записать весь перевод целиком, поэтому именно это значение определяет, сколько времени займёт запрос и уложится ли он во время, отведённое вашим хостингом на веб-запрос: уменьшите его, если долгие элементы не укладываются по времени, увеличьте для меньшего числа более информативных запросов, если хостинг допускает щедрое время на веб-запрос. Выполняйте задачу перевода через веб, а не из командной строки: см. руководство пользователя в разделе «Перевод требует веб, а не командную строку». Минимальное значение — 1000."
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_LABEL="Символов на запрос"
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_DESC="Где находятся переведённые изображения, по одной строке на каталог: <code>source folder = translated folder</code>, от корня сайта. В переведённом каталоге <code>{language}</code> означает тег языка (nl-NL), а <code>{lang}</code> — его код (nl). Изображение, расположенное в исходном каталоге, чей перевод имеет такой же путь в переведённом каталоге, отображается в переведённом виде. Решающим является наиболее точно совпадающий каталог."
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_LABEL="Каталоги переведённых изображений"
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_DESC="Что означает код <code>{lang}</code> для языка, код которого не совпадает с первой частью его тега: по одной строке на язык, <code>language tag = code</code>, например <code>pt-BR = ptbr</code>."
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_LABEL="Коды языков для изображений"
COM_TRANSLATIONS_CONFIG_LOG_DAYS_DESC="Сколько дней хранится запись о запросе. Более старые записи удаляются по мере добавления новых."
COM_TRANSLATIONS_CONFIG_LOG_DAYS_LABEL="Хранить записи запросов (дней)"
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_DESC="Сохранять в таблице базы данных #__translations_log каждый запрос, отправленный провайдеру перевода или дистилляции: отправленные тексты, правила, тип контента и термины, ответ, а также числа для настройки параметров — количество символов, правила каждого типа, действующие ограничения, затраченное время и результат. Полезно для выяснения причин, по которым перевод получился именно таким. Тексты заставляют таблицу расти быстро, поэтому включайте это, пока разбираетесь с чем-то конкретным."
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_LABEL="Логировать запросы"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_DESC="Язык контента, на котором создаются элементы. В очереди элементы на этом языке отображаются как оригиналы для перевода."
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_LABEL="Исходный язык"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_WARNING="Изменение исходного языка после того, как были собраны отзывы и правила, делает всё это обучение непригодным, так как оно привязано к исходному языку оригинала. (Рекомендуется задать исходный язык только один раз.)"
COM_TRANSLATIONS_CONFIG_TRANSLATED_IMAGES_DESC="Для сайтов документации с переведёнными скриншотами. Перевод отображает переведённую версию изображения там, где она есть на сайте, в указанном ниже каталоге для соответствующего языка, а в остальных случаях — исходное изображение. Изображения, добавленные позже, подхватываются задачей «Привести более ранние переводы в соответствие с их источником» с включённой проверкой ссылок."
