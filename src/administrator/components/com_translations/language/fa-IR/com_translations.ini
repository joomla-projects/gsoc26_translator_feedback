COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_DESC="چند حرف از متن مبدأ، یک درخواست به ارائه دهنده ترجمه هدف قرار می دهد که منتقل کند. مطلبی طولانی تر از این مقدار، به بخش هایی تقسیم و بین تگ های HTML برش می خورد و طی چندین اجرای وظیفه ترجمه که لازم باشد، ترجمه می شود. ارائه دهنده باید کل ترجمه را بازنویسی کند، بنابراین همین مقدار است که تعیین می کند یک درخواست چقدر طول می کشد و آیا در زمانی که هاست شما به یک درخواست وب می دهد جا می شود یا نه: اگر مطالب طولانی زمان تمام می شود آن را کاهش دهید، اگر هاست شما زمان بیشتری به یک درخواست وب می دهد آن را برای درخواست های کمتر و آگاهانه تر افزایش دهید. وظیفه ترجمه را از طریق وب اجرا کنید نه از خط فرمان: به راهنمای کاربر در بخش «ترجمه به وب نیاز دارد، نه خط فرمان» مراجعه کنید. حداقل مقدار 1000 است."
