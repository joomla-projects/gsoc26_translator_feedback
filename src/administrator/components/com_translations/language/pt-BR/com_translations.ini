COM_TRANSLATIONS_CONFIGURATION="Configurações de traduções"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_DESC="Publica uma tradução assim que ela é criada, antes que um tradutor a tenha revisado. Uma tradução cujo original não esteja publicado aguarda até que o original seja publicado. Retraduzir um item não é afetado: ele mantém o estado de publicação que já possui."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_LABEL="Publicar automaticamente novas traduções"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_DESC="Publicar uma regra destilada assim que for criada, para que ela alcance a próxima tradução antes de um tradutor revisá-la. O refinamento de uma regra existente não é afetado: ela mantém o estado que já possui."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_LABEL="Publicar automaticamente novas regras"
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_DESC="Quantos caracteres da fonte uma requisição ao provedor de tradução pretende levar. Um item mais longo que isso é traduzido em partes, cortadas entre marcações HTML, ao longo de quantas execuções da tarefa de tradução forem necessárias. O provedor tem que escrever toda a tradução de volta, então isso é o que decide quanto tempo uma requisição leva e se ela cabe no tempo que sua hospedagem dá a uma requisição web: diminua se itens longos expirarem, aumente para menos requisições e mais bem informadas quando sua hospedagem permitir um tempo generoso para uma requisição web. Execute a tarefa de tradução pela web em vez da linha de comando: veja o guia do usuário em \"Traduzir precisa da web, não da linha de comando\". O mínimo é 1000."
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_LABEL="Caracteres por requisição"
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_DESC="Onde ficam as imagens traduzidas, uma linha por pasta: <code>source folder = translated folder</code>, a partir da raiz do site. Na pasta traduzida, <code>{language}</code> representa o código do idioma (nl-NL) e <code>{lang}</code> representa seu código (nl). Uma imagem abaixo da pasta de origem cuja tradução tenha o mesmo caminho abaixo da pasta traduzida é exibida traduzida. A pasta mais específica decide."
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_LABEL="Pastas de imagens traduzidas"
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_DESC="O código <code>{lang}</code> representa, para um idioma cujo código não seja a primeira parte de seu marcador: uma linha por idioma, <code>language tag = code</code>, como <code>pt-BR = ptbr</code>."
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_LABEL="Códigos de idioma para imagens"
COM_TRANSLATIONS_CONFIG_LOG_DAYS_DESC="Por quantos dias uma requisição registrada é mantida. As mais antigas são removidas à medida que novas são registradas."
COM_TRANSLATIONS_CONFIG_LOG_DAYS_LABEL="Manter requisições registradas (dias)"
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_DESC="Armazena cada requisição enviada a um provedor de tradução ou destilação na tabela do banco de dados #__translations_log: os textos, regras, contexto e termos enviados, a resposta, e os números para ajustar as configurações - caracteres, regras de cada tipo, os limites em vigor, o tempo levado e o resultado. Para descobrir por que uma tradução saiu da forma que saiu. Os textos fazem a tabela crescer rapidamente, então ative enquanto você investiga algo."
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_LABEL="Registrar requisições"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_DESC="O idioma do conteúdo em que os itens são criados. A fila lista os itens nesse idioma como os originais a serem traduzidos."
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_LABEL="Idioma de origem"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_WARNING="Alterar o idioma de origem depois que feedbacks e regras foram coletados torna todo esse aprendizado inutilizável, pois está vinculado ao idioma de origem original. (Sugere-se definir o idioma de origem apenas uma vez.)"
COM_TRANSLATIONS_CONFIG_TRANSLATED_IMAGES_DESC="Para sites de documentação com capturas de tela traduzidas. Uma tradução exibe a versão traduzida de uma imagem onde ela estiver presente no site, na pasta indicada abaixo para seu idioma, e a imagem original onde não estiver. Imagens adicionadas posteriormente são identificadas pela tarefa Atualizar Traduções Anteriores de Acordo com a Fonte, com Links verificado."
