COM_TRANSLATIONS_CONFIGURATION="Configuração de traduções"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_DESC="Publicar uma tradução assim que for criada, antes de um tradutor a ter revisto. Uma tradução cujo original não está publicado aguarda até que o original o seja. A retradução de um item não é afetada: mantém a situação de publicação que já tem."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_LABEL="Publicar automaticamente novas traduções"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_DESC="Publicar uma regra destilada assim que é criada, para que chegue à próxima tradução antes de um tradutor a ter revisto. Refinar uma regra existente não é afetado: mantém a situação que já tem."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_LABEL="Publicar automaticamente novas regras"
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_DESC="Quantos caracteres do texto de origem um pedido ao fornecedor de tradução pretende transportar. Um item mais longo do que isto é traduzido em partes, cortadas entre etiquetas HTML, ao longo de tantas execuções da tarefa de tradução quantas forem necessárias. O fornecedor tem de escrever a tradução completa de volta, por isso é isto que decide quanto tempo demora um pedido e se cabe no tempo que o seu alojamento dá a um pedido web: diminua-o se itens longos demorarem demasiado, aumente-o para menos pedidos mais bem informados quando o seu alojamento permitir um tempo generoso para um pedido web. Execute a tarefa de tradução pela web em vez da linha de comandos: consulte o guia do utilizador em \"A tradução precisa da web, não da linha de comandos\". O mínimo é 1000."
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_LABEL="Caracteres por pedido"
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_DESC="Onde estão as imagens traduzidas, uma linha por pasta: <code>source folder = translated folder</code>, a partir da raiz do sítio. Na pasta traduzida, <code>{language}</code> representa o código de idioma (nl-NL) e <code>{lang}</code> o seu código (nl). Uma imagem abaixo da pasta de origem cuja tradução tenha o mesmo caminho abaixo da pasta traduzida é exibida traduzida. A pasta mais específica decide."
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_LABEL="Pastas de imagens traduzidas"
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_DESC="O código <code>{lang}</code> representa, para um idioma cujo código não é a primeira parte do seu código de idioma: uma linha por idioma, <code>language tag = code</code>, como <code>pt-BR = ptbr</code>."
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_LABEL="Códigos de idioma para imagens"
COM_TRANSLATIONS_CONFIG_LOG_DAYS_DESC="Durante quantos dias um pedido registado é mantido. Os mais antigos são removidos à medida que novos são registados."
COM_TRANSLATIONS_CONFIG_LOG_DAYS_LABEL="Manter pedidos registados (dias)"
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_DESC="Guardar cada pedido enviado a um fornecedor de tradução ou destilação na tabela de base de dados #__translations_log: os textos, regras, contexto e termos enviados, a resposta, e os números para ajustar as configurações — caracteres, regras de cada tipo, os limites em vigor, o tempo demorado e o resultado. Para descobrir porque é que uma tradução saiu como saiu. Os textos fazem a tabela crescer rapidamente, por isso ative isto enquanto investiga algo."
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_LABEL="Registar pedidos"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_DESC="O idioma de conteúdo em que os itens são redigidos. A fila lista os itens neste idioma como os originais a traduzir."
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_LABEL="Idioma de origem"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_WARNING="Alterar o idioma de origem depois de terem sido recolhidos comentários e regras torna toda essa aprendizagem inutilizável, pois está associada ao idioma de origem original. (Sugere-se definir o idioma de origem apenas uma vez.)"
COM_TRANSLATIONS_CONFIG_TRANSLATED_IMAGES_DESC="Para sítios de documentação com capturas de ecrã traduzidas. Uma tradução exibe a versão traduzida de uma imagem onde esta se encontra no sítio, na pasta indicada abaixo para o seu idioma, e a imagem original onde não existe. As imagens adicionadas posteriormente são detetadas pela tarefa Atualizar traduções anteriores de acordo com a sua origem, com a opção Hiperligações ativada."
