COM_TRANSLATIONS_ALLOW_TRANSLATION_DESC="Elimine la marca de no necesario para que este elemento pueda traducirse de nuevo."
COM_TRANSLATIONS_ALLOW_TRANSLATION_ERROR="No se ha podido identificar el elemento al que permitir la traducción."
COM_TRANSLATIONS_ALLOW_TRANSLATION_SUCCESS="Este elemento puede traducirse de nuevo."
COM_TRANSLATIONS_CONFIGURATION="Configuración de traducciones"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_DESC="Publicar una traducción tan pronto como se crea, antes de que un traductor la haya revisado. Una traducción cuyo original no está publicado espera hasta que el original lo esté. No afecta a volver a traducir un elemento: conserva el estado de publicación que ya tiene."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_LABEL="Publicar automáticamente las nuevas traducciones"
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_DESC="Publicar una regla destilada tan pronto como se crea, de modo que llegue a la siguiente traducción antes de que un traductor la haya revisado. Refinar una regla existente no se ve afectado: conserva el estado que ya tiene."
COM_TRANSLATIONS_CONFIG_AUTO_PUBLISH_RULES_LABEL="Publicar automáticamente las reglas nuevas"
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_DESC="Cuántos caracteres del origen pretende abarcar una solicitud al proveedor de traducción. Un elemento más largo que esto se traduce por partes, cortado entre etiquetas HTML, a lo largo de tantas ejecuciones de la tarea de traducción como haga falta. El proveedor tiene que devolver toda la traducción, así que esto es lo que decide cuánto tarda una solicitud y si cabe en el tiempo que su hospedaje da a una solicitud web: redúzcalo si los elementos largos agotan el tiempo, auméntelo para solicitudes menos numerosas y mejor informadas cuando su hospedaje permita un tiempo generoso a una solicitud web. Ejecute la tarea de traducción a través de la web en vez de desde la línea de comandos: vea la guía de usuario bajo «Traducir necesita la web, no la línea de comandos». El mínimo es 1000."
COM_TRANSLATIONS_CONFIG_CHUNK_CHARS_LABEL="Caracteres por solicitud"
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_DESC="Dónde están las imágenes traducidas, una línea por directorio: <code>source folder = translated folder</code>, desde el principal del sitio web. En el directorio traducido, <code>{language}</code> representa la etiqueta del idioma (nl-NL) y <code>{lang}</code> su código (nl). Una imagen debajo del directorio de origen cuya traducción tiene la misma ruta debajo del directorio traducido se muestra traducida. El directorio más específico decide."
COM_TRANSLATIONS_CONFIG_IMAGE_FOLDERS_LABEL="Directorios de imágenes traducidas"
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_DESC="El código <code>{lang}</code> representa, para un idioma cuyo código no es la primera parte de su etiqueta: una línea por idioma, <code>language tag = code</code>, como <code>pt-BR = ptbr</code>."
COM_TRANSLATIONS_CONFIG_IMAGE_LANGUAGE_CODES_LABEL="Códigos de idioma para imágenes"
COM_TRANSLATIONS_CONFIG_LOG_DAYS_DESC="Cuántos días se conserva una solicitud registrada. Las más antiguas se eliminan a medida que se registran otras nuevas."
COM_TRANSLATIONS_CONFIG_LOG_DAYS_LABEL="Mantener las solicitudes registradas (días)"
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_DESC="Almacenar cada solicitud enviada a un proveedor de traducción o destilación en la tabla de la base de datos #__translations_log: los textos, reglas, contexto y términos enviados, la respuesta y los números con los que ajustar los datos: caracteres, reglas de cada tipo, los límites vigentes, el tiempo empleado y el resultado. Para averiguar por qué una traducción resultó como resultó. Los textos hacen que la tabla crezca rápidamente, así que actívelo mientras investiga algo."
COM_TRANSLATIONS_CONFIG_LOG_REQUESTS_LABEL="Registrar solicitudes"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_DESC="El idioma de contenido en el que se redactan los elementos. La cola enumera los elementos en este idioma como los originales a traducir."
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_LABEL="Idioma de origen"
COM_TRANSLATIONS_CONFIG_SOURCE_LANGUAGE_WARNING="Cambiar el idioma de origen después de haber recopilado comentarios y reglas hace que todo ese aprendizaje quede inutilizable, ya que está vinculado al idioma de origen original. (Se sugiere establecer el idioma de origen solo una vez.)"
COM_TRANSLATIONS_CONFIG_TRANSLATED_IMAGES_DESC="Para sitios web de documentación con capturas de pantalla traducidas. Una traducción muestra la versión traducida de una imagen cuando esta se encuentra en el sitio web, en el directorio indicado abajo para su idioma, y la imagen original cuando no es así. Las imágenes que se agregan más tarde se recogen con la tarea Poner las traducciones anteriores en línea con su origen, con Enlaces comprobado."
