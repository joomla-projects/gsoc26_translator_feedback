PLG_RAG_CLAUDE="RAG - Claude"
PLG_RAG_CLAUDE_XML_DESCRIPTION="Distilla regole di traduzione dai feedback dei traduttori per il componente Traduzioni usando l'API Anthropic Claude."
PLG_RAG_CLAUDE_FIELD_API_KEY_LABEL="Chiave API"
PLG_RAG_CLAUDE_FIELD_API_KEY_DESC="La tua chiave API Anthropic, necessaria per distillare le regole. Creane una su console.anthropic.com."
PLG_RAG_CLAUDE_FIELD_MODEL_LABEL="Modello"
PLG_RAG_CLAUDE_FIELD_MODEL_DESC="Il modello Claude utilizzato per distillare le regole. Può differire dal modello usato dal plugin di traduzione."
PLG_RAG_CLAUDE_FIELD_EFFORT_LABEL="Impegno"
PLG_RAG_CLAUDE_FIELD_EFFORT_DESC="Quanto il modello può ragionare prima di rispondere. Basso è il più economico e veloce e mantiene le regole supportate da più correzioni; un impegno maggiore aggiunge più regole basate su una singola correzione, a un costo diverse volte superiore. Haiku non ha un livello di impegno, quindi questa opzione viene ignorata per esso."
PLG_RAG_CLAUDE_FIELD_EFFORT_LOW="Basso"
PLG_RAG_CLAUDE_FIELD_EFFORT_MEDIUM="Medio"
PLG_RAG_CLAUDE_FIELD_EFFORT_HIGH="Alto"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_LABEL="Timeout (secondi)"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_DESC="Quanto attendere una risposta prima che una richiesta venga considerata non riuscita. Un'esecuzione avviata via web può comunque essere interrotta prima dal web server."
