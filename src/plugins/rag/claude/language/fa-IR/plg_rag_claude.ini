PLG_RAG_CLAUDE_FIELD_EFFORT_DESC="مدل چقدر می تواند قبل از پاسخ دادن فکر کند. کم ارزان ترین و سریع ترین است و قوانینی که چندین اصلاح از آن ها پشتیبانی می کند را حفظ می کند؛ تلاش بیشتر قوانین بیشتری را اضافه می کند که بر اساس یک اصلاح واحد هستند، با هزینه چندین برابر. Haiku سطح تلاش ندارد، بنابراین این مورد برای آن نادیده گرفته می شود."
