PLG_RAG_CLAUDE_FIELD_TIMEOUT_DESC="مدت زمان انتظار برای پاسخ قبل از اینکه درخواست ناموفق شمرده شود. اجرایی که از طریق وب آغاز شده است ممکن است زودتر توسط سرور وب قطع شود."
