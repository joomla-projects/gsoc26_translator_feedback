PLG_RAG_CLAUDE="RAG – Claude"
PLG_RAG_CLAUDE_XML_DESCRIPTION="Destilliert Übersetzungsregeln aus dem Feedback von Übersetzern für die Komponente Übersetzungen mithilfe der Anthropic-Claude-API."
PLG_RAG_CLAUDE_FIELD_API_KEY_LABEL="API-Schlüssel"
PLG_RAG_CLAUDE_FIELD_API_KEY_DESC="Der Anthropic-API-Schlüssel, erforderlich zum Destillieren von Regeln. Einen erstellen unter console.anthropic.com."
PLG_RAG_CLAUDE_FIELD_MODEL_LABEL="Modell"
PLG_RAG_CLAUDE_FIELD_MODEL_DESC="Das Claude-Modell, das zum Destillieren von Regeln verwendet wird. Es kann sich vom Modell unterscheiden, das das Übersetzungs-Plugin verwendet."
PLG_RAG_CLAUDE_FIELD_EFFORT_LABEL="Aufwand"
PLG_RAG_CLAUDE_FIELD_EFFORT_DESC="Wie viel Nachdenken sich das Modell vor der Antwort erlauben darf. Niedrig ist am günstigsten und schnellsten und behält die Regeln bei, die von mehreren Korrekturen gestützt werden; ein höherer Aufwand fügt weitere Regeln hinzu, die nur auf einer einzigen Korrektur beruhen, zu einem Vielfachen der Kosten. Haiku kennt keine Aufwandsstufe, daher wird dies für Haiku ignoriert."
PLG_RAG_CLAUDE_FIELD_EFFORT_LOW="Niedrig"
PLG_RAG_CLAUDE_FIELD_EFFORT_MEDIUM="Mittel"
PLG_RAG_CLAUDE_FIELD_EFFORT_HIGH="Hoch"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_LABEL="Zeitlimit (Sekunden)"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_DESC="Wie lange auf eine Antwort gewartet wird, bevor eine Anfrage als fehlgeschlagen gilt. Ein über das Web gestarteter Durchlauf kann vom Webserver auch früher abgebrochen werden."
