PLG_RAG_CLAUDE="RAG - Claude"
PLG_RAG_CLAUDE_XML_DESCRIPTION="Destila reglas de traducción a partir de los comentarios de los traductores para el componente Traducciones usando la API de Anthropic Claude."
PLG_RAG_CLAUDE_FIELD_API_KEY_LABEL="Clave de API"
PLG_RAG_CLAUDE_FIELD_API_KEY_DESC="Su clave de API de Anthropic, necesaria para destilar reglas. Cree una en console.anthropic.com."
PLG_RAG_CLAUDE_FIELD_MODEL_LABEL="Modelo"
PLG_RAG_CLAUDE_FIELD_MODEL_DESC="El modelo Claude utilizado para destilar reglas. Puede diferir del modelo que utiliza el plugin de traducción."
PLG_RAG_CLAUDE_FIELD_EFFORT_LABEL="Esfuerzo"
PLG_RAG_CLAUDE_FIELD_EFFORT_DESC="Cuánto puede pensar el modelo antes de responder. Bajo es lo más barato y rápido y mantiene las reglas que varias correcciones respaldan; un esfuerzo mayor agrega más reglas que se basan en una sola corrección, a un coste varias veces superior. Haiku no admite nivel de esfuerzo, por lo que esto se ignora para él."
PLG_RAG_CLAUDE_FIELD_EFFORT_LOW="Bajo"
PLG_RAG_CLAUDE_FIELD_EFFORT_MEDIUM="Medio"
PLG_RAG_CLAUDE_FIELD_EFFORT_HIGH="Alto"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_LABEL="Tiempo de espera (segundos)"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_DESC="Cuánto tiempo esperar una respuesta antes de que una solicitud se considere fallida. Una ejecución iniciada desde la web aún puede ser interrumpida antes por el servidor web."
