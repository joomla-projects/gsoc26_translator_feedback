PLG_RAG_CLAUDE="RAG - Claude"
PLG_RAG_CLAUDE_XML_DESCRIPTION="Distilleert vertaalregels uit feedback van vertalers voor de Vertalingen-component met behulp van de Anthropic Claude API."
PLG_RAG_CLAUDE_FIELD_API_KEY_LABEL="API-sleutel"
PLG_RAG_CLAUDE_FIELD_API_KEY_DESC="Uw Anthropic API-sleutel, nodig om regels te distilleren. Maak er een aan op console.anthropic.com."
PLG_RAG_CLAUDE_FIELD_MODEL_LABEL="Model"
PLG_RAG_CLAUDE_FIELD_MODEL_DESC="Het Claude-model dat gebruikt wordt om regels te distilleren. Het kan verschillen van het model dat de vertaal-plugin gebruikt."
PLG_RAG_CLAUDE_FIELD_EFFORT_LABEL="Inspanning"
PLG_RAG_CLAUDE_FIELD_EFFORT_DESC="Hoeveel de model mag nadenken voordat deze antwoordt. Laag is het goedkoopst en snelst en behoudt de regels die door meerdere correcties ondersteund worden; hogere inspanning voegt meer regels toe die op een enkele correctie berusten, tegen een veelvoud van de kosten. Haiku kent geen inspanningsniveau, dus dit wordt hiervoor genegeerd."
PLG_RAG_CLAUDE_FIELD_EFFORT_LOW="Laag"
PLG_RAG_CLAUDE_FIELD_EFFORT_MEDIUM="Gemiddeld"
PLG_RAG_CLAUDE_FIELD_EFFORT_HIGH="Hoog"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_LABEL="Time-out (seconden)"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_DESC="Hoe lang gewacht wordt op een antwoord voordat een verzoek als mislukt telt. Een via het web gestarte uitvoering kan nog eerder worden afgebroken door de webserver."
