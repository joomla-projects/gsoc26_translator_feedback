PLG_RAG_CLAUDE="RAG - Claude"
PLG_RAG_CLAUDE_XML_DESCRIPTION="Extrait des règles de traduction à partir des retours des traducteurs pour le composant Traductions en utilisant l'API Anthropic Claude."
PLG_RAG_CLAUDE_FIELD_API_KEY_LABEL="Clé API"
PLG_RAG_CLAUDE_FIELD_API_KEY_DESC="Votre clé API Anthropic, requise pour extraire les règles. Créez-en une sur console.anthropic.com."
PLG_RAG_CLAUDE_FIELD_MODEL_LABEL="Modèle"
PLG_RAG_CLAUDE_FIELD_MODEL_DESC="Le modèle Claude utilisé pour extraire les règles. Il peut être différent du modèle utilisé par le plugin de traduction."
PLG_RAG_CLAUDE_FIELD_EFFORT_LABEL="Effort"
PLG_RAG_CLAUDE_FIELD_EFFORT_DESC="Le niveau de réflexion du modèle avant de répondre. Faible est le moins coûteux et le plus rapide et conserve les règles que plusieurs corrections confirment ; un effort plus élevé ajoute davantage de règles reposant sur une seule correction, pour un coût plusieurs fois supérieur. Haiku n'a pas de niveau d'effort, ce paramètre est donc ignoré pour ce modèle."
PLG_RAG_CLAUDE_FIELD_EFFORT_LOW="Faible"
PLG_RAG_CLAUDE_FIELD_EFFORT_MEDIUM="Moyen"
PLG_RAG_CLAUDE_FIELD_EFFORT_HIGH="Élevé"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_LABEL="Délai d'expiration (secondes)"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_DESC="Durée d'attente d'une réponse avant qu'une requête soit considérée comme échouée. Une exécution lancée via le web peut tout de même être interrompue plus tôt par le serveur web."
