PLG_RAG_CLAUDE="RAG - Claude"
PLG_RAG_CLAUDE_XML_DESCRIPTION="Extrai regras de tradução a partir do feedback dos tradutores para o componente Traduções usando a API Anthropic Claude."
PLG_RAG_CLAUDE_FIELD_API_KEY_LABEL="Chave de API"
PLG_RAG_CLAUDE_FIELD_API_KEY_DESC="Sua chave de API da Anthropic, necessária para extrair regras. Crie uma em console.anthropic.com."
PLG_RAG_CLAUDE_FIELD_MODEL_LABEL="Modelo"
PLG_RAG_CLAUDE_FIELD_MODEL_DESC="O modelo Claude usado para extrair regras. Pode ser diferente do modelo usado pelo plugin de tradução."
PLG_RAG_CLAUDE_FIELD_EFFORT_LABEL="Esforço"
PLG_RAG_CLAUDE_FIELD_EFFORT_DESC="O quanto o modelo pode pensar antes de responder. Baixo é o mais barato e rápido e mantém as regras que várias correções sustentam; esforço mais alto adiciona mais regras que se baseiam em uma única correção, a um custo várias vezes maior. Haiku não aceita nível de esforço, então isso é ignorado para ele."
PLG_RAG_CLAUDE_FIELD_EFFORT_LOW="Baixo"
PLG_RAG_CLAUDE_FIELD_EFFORT_MEDIUM="Médio"
PLG_RAG_CLAUDE_FIELD_EFFORT_HIGH="Alto"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_LABEL="Tempo limite (segundos)"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_DESC="Quanto tempo aguardar por uma resposta antes que uma requisição seja considerada como falha. Uma execução iniciada pela web ainda pode ser interrompida antes pelo servidor web."
