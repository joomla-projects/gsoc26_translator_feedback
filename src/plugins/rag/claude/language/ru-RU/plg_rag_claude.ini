PLG_RAG_CLAUDE="RAG - Claude"
PLG_RAG_CLAUDE_XML_DESCRIPTION="Плагин для извлечения правил перевода из отзывов переводчиков для компонента «Переводы» с использованием Anthropic Claude API."
PLG_RAG_CLAUDE_FIELD_API_KEY_LABEL="Ключ API"
PLG_RAG_CLAUDE_FIELD_API_KEY_DESC="Ваш ключ API Anthropic, необходимый для извлечения правил. Создайте его на console.anthropic.com."
PLG_RAG_CLAUDE_FIELD_MODEL_LABEL="Модель"
PLG_RAG_CLAUDE_FIELD_MODEL_DESC="Модель Claude, используемая для извлечения правил. Она может отличаться от модели, используемой плагином перевода."
PLG_RAG_CLAUDE_FIELD_EFFORT_LABEL="Усилие"
PLG_RAG_CLAUDE_FIELD_EFFORT_DESC="Насколько сильно модель может размышлять перед тем, как дать ответ. Низкое значение — самое дешёвое и быстрое, оно сохраняет правила, подтверждённые несколькими исправлениями; более высокое усилие добавляет больше правил, опирающихся на одно исправление, но стоит в несколько раз дороже. Для Haiku уровень усилия не применяется, поэтому для неё этот параметр игнорируется."
PLG_RAG_CLAUDE_FIELD_EFFORT_LOW="Низкое"
PLG_RAG_CLAUDE_FIELD_EFFORT_MEDIUM="Среднее"
PLG_RAG_CLAUDE_FIELD_EFFORT_HIGH="Высокое"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_LABEL="Тайм-аут (секунды)"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_DESC="Сколько ждать ответа, прежде чем запрос будет считаться неудавшимся. Запуск, начатый через веб, всё равно может быть прерван раньше веб-сервером."
