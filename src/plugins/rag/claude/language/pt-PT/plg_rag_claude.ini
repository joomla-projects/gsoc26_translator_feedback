PLG_RAG_CLAUDE="RAG - Claude"
PLG_RAG_CLAUDE_XML_DESCRIPTION="Extrai regras de tradução a partir do feedback dos tradutores para o componente Traduções, utilizando a API Anthropic Claude."
PLG_RAG_CLAUDE_FIELD_API_KEY_LABEL="Chave da API"
PLG_RAG_CLAUDE_FIELD_API_KEY_DESC="A sua chave da API Anthropic, necessária para extrair regras. Crie uma em console.anthropic.com."
PLG_RAG_CLAUDE_FIELD_MODEL_LABEL="Modelo"
PLG_RAG_CLAUDE_FIELD_MODEL_DESC="O modelo Claude utilizado para extrair regras. Pode ser diferente do modelo utilizado pelo plugin de tradução."
PLG_RAG_CLAUDE_FIELD_EFFORT_LABEL="Esforço"
PLG_RAG_CLAUDE_FIELD_EFFORT_DESC="Quanto o modelo pode pensar antes de responder. Baixo é o mais barato e rápido e mantém as regras que várias correções apoiam; esforço mais elevado acrescenta mais regras que assentam numa única correção, a um custo várias vezes superior. O Haiku não tem nível de esforço, pelo que isto é ignorado para ele."
PLG_RAG_CLAUDE_FIELD_EFFORT_LOW="Baixo"
PLG_RAG_CLAUDE_FIELD_EFFORT_MEDIUM="Médio"
PLG_RAG_CLAUDE_FIELD_EFFORT_HIGH="Alto"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_LABEL="Tempo limite (segundos)"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_DESC="Quanto tempo esperar por uma resposta antes de um pedido ser considerado falhado. Uma execução iniciada através da web ainda pode ser interrompida mais cedo pelo servidor web."
