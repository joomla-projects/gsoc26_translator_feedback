PLG_TRANSLATION_CLAUDE_FIELD_TIMEOUT_DESC="Сколько ждать ответа, прежде чем запрос будет считаться неудавшимся. Запуск, начатый через веб, всё равно может быть прерван раньше веб-сервером."
