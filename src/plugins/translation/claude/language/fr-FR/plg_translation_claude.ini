PLG_TRANSLATION_CLAUDE_FIELD_EFFORT_DESC="Dans quelle mesure le modèle peut réfléchir avant de répondre. Faible est le moins cher et le plus rapide, et a été mesuré comme traduisant aussi bien les textes courts que le niveau élevé. Haiku ne prend pas de niveau d'effort, celui-ci est donc ignoré pour lui."
PLG_TRANSLATION_CLAUDE_FIELD_EFFORT_LOW="Faible"
PLG_TRANSLATION_CLAUDE_FIELD_EFFORT_MEDIUM="Moyen"
