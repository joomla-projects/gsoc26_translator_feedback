PLG_TRANSLATION_CLAUDE_FIELD_TIMEOUT_LABEL="Délai d'expiration (secondes)"
PLG_TRANSLATION_CLAUDE_FIELD_TIMEOUT_DESC="Durée d'attente d'une réponse avant qu'une requête soit considérée comme échouée. Une exécution lancée via le web peut tout de même être interrompue plus tôt par le serveur web."
