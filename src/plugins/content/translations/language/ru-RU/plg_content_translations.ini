PLG_CONTENT_TRANSLATIONS_FIELD_CHILDREN_ORDER_DESC="Порядок переводов дочерних элементов этого элемента. <em>Как здесь</em> сохраняет порядок, в котором дочерние элементы расположены здесь. <em>По переведённому заголовку</em> сортирует их по алфавиту на каждом языке — для списка, который здесь упорядочен по алфавиту: переведённый заголовок занимает другое место в алфавите."
PLG_CONTENT_TRANSLATIONS_FIELD_CHILDREN_ORDER_LABEL="Порядок переведённых дочерних элементов"
