PLG_CONTENT_TRANSLATIONS_FIELD_NO_NEED_DESC="Исключить этот элемент из очереди компонента «Переводы». По умолчанию он скрыт в очереди; фильтр позволяет его отобразить, и вы можете снова разрешить перевод из очереди или отключив эту опцию."
