PLG_TASK_TRANSLATIONSSEED="وظیفه - بذر ترجمه ها"
PLG_TASK_TRANSLATIONSSEED_XML_DESCRIPTION="قوانین ترجمه را از یک بسته زبانی نصب شده بذرپاشی می کند تا یک سایت با اصطلاح شناسی که تیم زبانی آن قبلاً روی آن توافق کرده است شروع شود."
PLG_TASK_TRANSLATIONSSEED_TITLE="بذرپاشی قوانین ترجمه از یک بسته زبانی"
PLG_TASK_TRANSLATIONSSEED_DESC="رشته های یک بسته زبانی نصب شده را بدون استفاده از هیچ قانونی ترجمه می کند، هر کدام را در برابر ترجمه ای که بسته از قبل دارد جفت می کند و تفاوت ها را به عنوان بازخورد مترجم برای تقطیرگر ثبت می کند. هر اجرا تا پایان زمانش درخواست ارسال می کند؛ اجرای بعدی ادامه می دهد."
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_LABEL="زبان"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_DESC="زبان نصب شده ای که باید از آن آموخت. بسته آن ترجمه های تأیید شده را فراهم می کند."
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_LABEL="تعداد رشته ها در هر درخواست"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_DESC="بیشترین تعداد متن های متمایزی که در یک درخواست به ارائه دهنده ارسال می شود. متنی که در چند فایل زبان رخ می دهد یک بار ارسال می شود. درخواستی که شکست می خورد با نصف این اندازه دوباره امتحان می شود."
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_LABEL="زمان هر اجرا (ثانیه)"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_DESC="مدت زمانی که یک اجرا می تواند درخواست ارسال کند؛ اجرا پیش از درخواستی که احتمالاً به موقع تمام نمی شود متوقف می شود و اجرای بعدی آن را ادامه می دهد. 0 به معنای 25 ثانیه در وب و 240 ثانیه از خط فرمان است. با فراخوانی Web Cron هر دقیقه، 110 مقدار مناسبی است وقتی میزبانی شما اجازه می دهد یک درخواست وب حدود دو دقیقه اجرا شود. مهلت زمانی وظیفه را در گزینه های وظایف زمان بندی شده بسیار بالاتر از آن نگه دارید، مثلاً 600."
PLG_TASK_TRANSLATIONSSEED_FILES_LABEL="فایل های زبان"
PLG_TASK_TRANSLATIONSSEED_FILES_DESC="فهرستی جدا شده با کاما از نام فایل های زبانی که باید خوانده شوند، مانند com_content.ini. برای خواندن کل بسته خالی بگذارید."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_COMPONENT="کامپوننت Translations نصب یا فعال نیست، بنابراین جایی برای ثبت آنچه بذرپاشی می شود وجود ندارد."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_LANGUAGE="هیچ زبانی انتخاب نشده است، بنابراین بسته ای برای یادگیری از آن وجود ندارد."
PLG_TASK_TRANSLATIONSSEED_LOG_BUSY="اجرای دیگری از seed برای بسته %s هنوز مشغول است، بنابراین این اجرا کاری انجام نداد؛ رشته های در انتظار به آن اجرا واگذار می شوند."
PLG_TASK_TRANSLATIONSSEED_LOG_NONE="چیزی برای seed کردن از بسته %s باقی نمانده است."
PLG_TASK_TRANSLATIONSSEED_LOG_SEEDED="%1$d رشته از بسته %2$s seed شد؛ %3$d مورد هنوز در انتظار است."
PLG_TASK_TRANSLATIONSSEED_LOG_FAILED="%1$d رشته نتوانست seed شود؛ %2$d مورد از آنها برای سومین بار شکست خورد و کنار گذاشته شد. آخرین خطا: %3$s"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_TITLE="تلاش مجدد برای رشته های ناموفق بسته زبان"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_DESC="رشته های بسته زبان را که وظیفه seed پس از سه بار تلاش ناموفق کنار گذاشته است، مجموعه ای جدید از تلاش ها می دهد. پس از رفع علت شکست ها، مانند یک مدل نامعتبر یا موجودی اعتبار خالی، آن را اجرا کنید."
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_LOG="%d رشته ناموفق دوباره seed خواهند شد."
PLG_TASK_TRANSLATIONSSEED_FORGET_TITLE="فراموش کردن یک زبان seed شده"
PLG_TASK_TRANSLATIONSSEED_FORGET_DESC="کاری را که وظیفه seed برای یک زبان انجام داده فراموش می کند، تا بسته آن بتواند دوباره از ابتدا seed شود: سابقه رشته هایی که seed شده اند و بازخوردی که وظیفه seed نوشته است حذف می شوند، و قوانین منتشرنشده ای که فقط از بسته یاد گرفته شده اند به سطل زباله منتقل می شوند. قوانین منتشرشده نگه داشته می شوند مگر اینکه شما طور دیگری انتخاب کنید؛ بازخورد و قوانین مترجمان همیشه نگه داشته می شوند. حذف ها قابل بازگشت نیستند."
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_LABEL="زبان"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_DESC="زبانی که seed شدن آن فراموش می شود."
PLG_TASK_TRANSLATIONSSEED_FORGET_LOG="seed شدن %1$s فراموش شد: %2$d رشته دوباره seed خواهند شد، %3$d ردیف بازخورد حذف شد و %4$d قانون به سطل زباله منتقل شد."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_LABEL="همچنین قوانین منتشرشده را به سطل زباله منتقل کن"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_DESC="همچنین قوانین منتشرشده یادگرفته شده از این بسته زبان را به سطل زباله منتقل می کند. این را خاموش بگذارید مگر اینکه مطمئن باشید: قوانین منتشرشده توسط کسی بررسی شده اند و برای هر ترجمه به این زبان استفاده می شوند."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_WARNING="<strong>با این گزینه بسیار مراقب باشید.</strong> قوانین منتشرشده بررسی شده اند و هر ترجمه جدید به این زبان را هدایت می کنند. با روشن بودن این گزینه، تمام قوانین منتشرشده یادگرفته شده از بسته زبان به سطل زباله منتقل می شوند و بلافاصله استفاده از آنها متوقف می شود. قوانینی که از مترجمان آمده اند تحت تأثیر قرار نمی گیرند. تا زمانی که سطل زباله خالی نشده باشد، می توانید قوانین حذف شده را از سطل زباله در نمای قوانین بازیابی کنید."
