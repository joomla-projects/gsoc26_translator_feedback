PLG_TASK_TRANSLATIONSSEED="Tarea - Semilla de traducciones"
PLG_TASK_TRANSLATIONSSEED_XML_DESCRIPTION="Siembra reglas de traducción a partir de un paquete de idioma instalado, de modo que un sitio comience con la terminología que su equipo de idioma ya ha acordado."
PLG_TASK_TRANSLATIONSSEED_TITLE="Sembrar reglas de traducción a partir de un paquete de idioma"
PLG_TASK_TRANSLATIONSSEED_DESC="Traduce las cadenas de un paquete de idioma instalado sin utilizar ninguna regla, empareja cada una con la traducción que el paquete ya trae, y registra las diferencias como comentarios de traductor para el destilador. Cada ejecución envía solicitudes hasta que se agota su tiempo; la siguiente ejecución continúa."
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_LABEL="Idioma"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_DESC="El idioma instalado del que aprender. Su paquete proporciona las traducciones aprobadas."
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_LABEL="Cadenas por solicitud"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_DESC="El mayor número de textos distintos enviados al proveedor en una solicitud. Un texto que aparece en varios archivos de idioma se envía una sola vez. Una solicitud que falla se reintenta a la mitad de este tamaño."
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_LABEL="Tiempo por ejecución (segundos)"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_DESC="Cuánto tiempo puede una ejecución seguir enviando solicitudes; la ejecución se detiene antes de una solicitud que probablemente no terminaría a tiempo, y la siguiente ejecución continúa. 0 significa 25 segundos a través de la web y 240 segundos desde la línea de comandos. Con Webcron llamado cada minuto, 110 es un buen valor cuando su alojamiento permite que una solicitud web se ejecute durante unos dos minutos. Mantenga el tiempo de espera de la tarea en las opciones de tareas programadas bastante por encima de ese valor, por ejemplo 600."
PLG_TASK_TRANSLATIONSSEED_FILES_LABEL="Archivos de idioma"
PLG_TASK_TRANSLATIONSSEED_FILES_DESC="Una lista separada por comas de nombres de archivos de idioma a leer, como com_content.ini. Déjelo vacío para leer el paquete completo."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_COMPONENT="El componente Translations no está instalado o no está habilitado, por lo que no hay dónde registrar lo que se siembra."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_LANGUAGE="No se ha seleccionado ningún idioma, así que no hay paquete del que aprender."
PLG_TASK_TRANSLATIONSSEED_LOG_BUSY="Otra ejecución de siembra para el paquete de %s todavía está ocupada, así que esta ejecución no hizo nada; las cadenas pendientes se dejan a esa ejecución."
PLG_TASK_TRANSLATIONSSEED_LOG_NONE="No queda nada por sembrar del paquete de %s."
PLG_TASK_TRANSLATIONSSEED_LOG_SEEDED="Se sembraron %1$d cadenas del paquete de %2$s; %3$d siguen pendientes."
PLG_TASK_TRANSLATIONSSEED_LOG_FAILED="%1$d cadenas no se han podido sembrar; %2$d de ellas fallaron por tercera vez y se han apartado. Último error: %3$s"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_TITLE="Reintentar las cadenas fallidas del paquete de idioma"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_DESC="Da a las cadenas del paquete de idioma que la tarea de siembra apartó tras tres intentos fallidos un nuevo conjunto de intentos. Ejecútela una vez se haya solucionado la causa de los fallos, como un modelo inválido o un saldo de créditos vacío."
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_LOG="%d cadenas fallidas se volverán a sembrar."
PLG_TASK_TRANSLATIONSSEED_FORGET_TITLE="Olvidar un idioma sembrado"
PLG_TASK_TRANSLATIONSSEED_FORGET_DESC="Olvida lo que la tarea de siembra hizo para un idioma, de forma que su paquete se pueda sembrar de nuevo desde cero: se elimina el registro de qué cadenas fueron sembradas y la retroalimentación que escribió la tarea de siembra, y las reglas despublicadas aprendidas únicamente del paquete se mueven a la papelera. Las reglas publicadas se conservan a menos que elija lo contrario; la retroalimentación y las reglas de los traductores siempre se conservan. Las eliminaciones no se pueden deshacer."
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_LABEL="Idioma"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_DESC="El idioma cuya siembra se olvida."
PLG_TASK_TRANSLATIONSSEED_FORGET_LOG="Se olvidó la siembra de %1$s: %2$d cadenas se volverán a sembrar, %3$d filas de retroalimentación fueron eliminadas y %4$d reglas se movieron a la papelera."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_LABEL="También enviar a la papelera las reglas publicadas"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_DESC="También mueve a la papelera las reglas publicadas aprendidas de este paquete de idioma. Deje esto desactivado a menos que esté seguro: las reglas publicadas fueron revisadas por alguien y se usan para cada traducción a este idioma."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_WARNING="<strong>Tenga mucho cuidado con esta opción.</strong> Las reglas publicadas han sido revisadas y guían cada nueva traducción a este idioma. Con esta opción activada, todas las reglas publicadas aprendidas del paquete de idioma se mueven a la papelera y dejan de usarse de inmediato. Las reglas que provienen de traductores no se ven afectadas. Puede restaurar las reglas enviadas a la papelera desde la papelera en la vista de reglas, siempre que la papelera no se haya vaciado."
