PLG_TASK_TRANSLATIONSSEED="Tâche - Amorçage des traductions"
PLG_TASK_TRANSLATIONSSEED_XML_DESCRIPTION="Amorce les règles de traduction à partir d'un pack de langue installé, afin qu'un site démarre avec la terminologie déjà validée par son équipe de traduction."
PLG_TASK_TRANSLATIONSSEED_TITLE="Amorcer les règles de traduction depuis un pack de langue"
PLG_TASK_TRANSLATIONSSEED_DESC="Traduit les chaînes d'un pack de langue installé sans utiliser aucune règle, apparie chacune avec la traduction déjà présente dans le pack, et enregistre les différences comme retour de traducteur pour le distillateur. Chaque exécution envoie des requêtes jusqu'à ce que son temps soit épuisé ; l'exécution suivante prend le relais."
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_LABEL="Langue"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_DESC="La langue installée dont il faut apprendre. Son pack fournit les traductions approuvées."
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_LABEL="Chaînes par requête"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_DESC="Le plus grand nombre de textes distincts envoyés au fournisseur en une seule requête. Un texte qui apparaît dans plusieurs fichiers de langue est envoyé une seule fois. Une requête qui échoue est retentée avec la moitié de cette taille."
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_LABEL="Temps par exécution (secondes)"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_DESC="Durée pendant laquelle une exécution peut continuer à envoyer des requêtes ; l'exécution s'arrête avant une requête qui ne finirait probablement pas à temps, et l'exécution suivante prend le relais. 0 signifie 25 secondes sur le web et 240 secondes en ligne de commande. Avec le Web Cron appelé chaque minute, 110 est une bonne valeur quand votre hébergement permet à une requête web de s'exécuter environ deux minutes. Gardez le délai d'expiration de la tâche dans les paramètres des tâches planifiées bien au-dessus, par exemple 600."
PLG_TASK_TRANSLATIONSSEED_FILES_LABEL="Fichiers de langue"
PLG_TASK_TRANSLATIONSSEED_FILES_DESC="Une liste de noms de fichiers de langue séparés par des virgules à lire, comme com_content.ini. Laisser vide pour lire tout le pack."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_COMPONENT="Le composant Translations n'est pas installé ou n'est pas activé, il n'y a donc aucun endroit pour enregistrer ce qui est amorcé."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_LANGUAGE="Aucune langue n'est sélectionnée, il n'y a donc aucun pack à partir duquel apprendre."
PLG_TASK_TRANSLATIONSSEED_LOG_BUSY="Une autre exécution de semis pour le pack %s est encore en cours, cette exécution n'a donc rien fait ; les chaînes en attente sont laissées à cette exécution."
PLG_TASK_TRANSLATIONSSEED_LOG_NONE="Plus rien à semer à partir du pack %s."
PLG_TASK_TRANSLATIONSSEED_LOG_SEEDED="%1$d chaînes semées à partir du pack %2$s ; %3$d encore en attente."
PLG_TASK_TRANSLATIONSSEED_LOG_FAILED="%1$d chaînes n'ont pas pu être semées ; %2$d d'entre elles ont échoué pour la troisième fois et sont mises de côté. Dernière erreur : %3$s"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_TITLE="Réessayer les chaînes de pack de langue échouées"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_DESC="Donne aux chaînes du pack de langue que la tâche de semis a mises de côté après trois tentatives échouées un nouvel ensemble de tentatives. Exécuter cette tâche une fois la cause des échecs corrigée, par exemple un modèle invalide ou un solde de crédit vide."
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_LOG="%d chaînes échouées seront à nouveau semées."
PLG_TASK_TRANSLATIONSSEED_FORGET_TITLE="Oublier une langue semée"
PLG_TASK_TRANSLATIONSSEED_FORGET_DESC="Oublie ce que la tâche de semis a fait pour une langue, afin que son pack puisse être à nouveau semé depuis le début : l'enregistrement des chaînes semées et les retours écrits par la tâche de semis sont supprimés, et les règles non publiées apprises uniquement à partir du pack sont déplacées vers la corbeille. Les règles publiées sont conservées sauf indication contraire ; les retours et règles provenant des traducteurs sont toujours conservés. Les suppressions sont irréversibles."
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_LABEL="Langue"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_DESC="La langue dont le semis est oublié."
PLG_TASK_TRANSLATIONSSEED_FORGET_LOG="Semis de %1$s oublié : %2$d chaînes seront à nouveau semées, %3$d lignes de retour ont été supprimées et %4$d règles ont été déplacées vers la corbeille."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_LABEL="Également mettre à la corbeille les règles publiées"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_DESC="Déplace également vers la corbeille les règles publiées apprises de ce pack de langue. Laisser cette option désactivée sauf certitude : les règles publiées ont été relues par quelqu'un et sont utilisées pour chaque traduction dans cette langue."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_WARNING="<strong>Soyez très prudent avec ce paramètre.</strong> Les règles publiées ont été relues et orientent chaque nouvelle traduction dans cette langue. Avec ce paramètre activé, toutes les règles publiées apprises du pack de langue sont déplacées vers la corbeille et cessent immédiatement d'être utilisées. Les règles provenant des traducteurs ne sont pas affectées. Vous pouvez restaurer les règles mises à la corbeille depuis la corbeille dans la vue Règles, tant que la corbeille n'a pas été vidée."
