PLG_TASK_TRANSLATIONSSEED="Aufgabe – Übersetzungen Seed"
PLG_TASK_TRANSLATIONSSEED_XML_DESCRIPTION="Sät Übersetzungsregeln aus einem installierten Sprachpaket, damit eine Site mit der Terminologie startet, auf die sich das Sprachteam bereits geeinigt hat."
PLG_TASK_TRANSLATIONSSEED_TITLE="Übersetzungsregeln aus einem Sprachpaket säen"
PLG_TASK_TRANSLATIONSSEED_DESC="Übersetzt die Zeichenketten eines installierten Sprachpakets ohne Verwendung von Regeln, gleicht jede mit der im Paket bereits vorhandenen Übersetzung ab und zeichnet die Unterschiede als Übersetzer-Feedback für den Destillierer auf. Jeder Durchlauf sendet Anfragen, bis seine Zeit aufgebraucht ist; der nächste Durchlauf macht weiter."
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_LABEL="Sprache"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_DESC="Die installierte Sprache, von der gelernt werden soll. Ihr Paket liefert die genehmigten Übersetzungen."
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_LABEL="Zeichenketten pro Anfrage"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_DESC="Die meisten unterschiedlichen Texte, die in einer Anfrage an den Anbieter gesendet werden. Ein Text, der in mehreren Sprachdateien vorkommt, wird einmal gesendet. Eine fehlgeschlagene Anfrage wird mit halber Größe erneut versucht."
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_LABEL="Zeit pro Durchlauf (Sekunden)"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_DESC="Wie lange ein Durchlauf weiter Anfragen senden darf; der Durchlauf stoppt vor einer Anfrage, die vermutlich nicht rechtzeitig fertig würde, und der nächste Durchlauf macht weiter. 0 bedeutet 25 Sekunden im Web und 240 Sekunden über die Befehlszeile. Bei Web-Cron, der jede Minute aufgerufen wird, ist 110 ein guter Wert, wenn das Hosting eine Webanfrage etwa zwei Minuten laufen lässt. Das Aufgaben-Timeout in den Optionen der geplanten Aufgaben sollte deutlich darüber liegen, zum Beispiel 600."
PLG_TASK_TRANSLATIONSSEED_FILES_LABEL="Sprachdateien"
PLG_TASK_TRANSLATIONSSEED_FILES_DESC="Eine durch Kommas getrennte Liste von Sprachdateinamen, die gelesen werden sollen, etwa com_content.ini. Leer lassen, um das gesamte Paket zu lesen."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_COMPONENT="Die Translations-Komponente ist nicht installiert oder nicht aktiviert, daher gibt es keinen Ort, um das Gesäte aufzuzeichnen."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_LANGUAGE="Es ist keine Sprache ausgewählt, daher gibt es kein Paket, aus dem gelernt werden kann."
PLG_TASK_TRANSLATIONSSEED_LOG_BUSY="Ein anderer Seed-Lauf für das Paket %s ist noch aktiv, daher hat dieser Lauf nichts getan; die ausstehenden Zeichenketten werden diesem Lauf überlassen."
PLG_TASK_TRANSLATIONSSEED_LOG_NONE="Aus dem Paket %s ist nichts mehr zu seeden."
PLG_TASK_TRANSLATIONSSEED_LOG_SEEDED="%1$d Zeichenketten aus dem Paket %2$s wurden geseedet; %3$d sind noch ausstehend."
PLG_TASK_TRANSLATIONSSEED_LOG_FAILED="%1$d Zeichenketten konnten nicht geseedet werden; %2$d davon sind zum dritten Mal fehlgeschlagen und wurden zurückgestellt. Letzter Fehler: %3$s"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_TITLE="Fehlgeschlagene Sprachpaket-Zeichenketten erneut versuchen"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_DESC="Gibt den Sprachpaket-Zeichenketten, die die Seed-Aufgabe nach drei fehlgeschlagenen Versuchen zurückgestellt hat, einen neuen Satz an Versuchen. Ausführen, sobald die Ursache der Fehlschläge behoben ist, etwa ein ungültiges Modell oder ein leeres Guthaben."
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_LOG="%d fehlgeschlagene Zeichenketten werden erneut geseedet."
PLG_TASK_TRANSLATIONSSEED_FORGET_TITLE="Eine geseedete Sprache vergessen"
PLG_TASK_TRANSLATIONSSEED_FORGET_DESC="Vergisst, was die Seed-Aufgabe für eine Sprache getan hat, sodass deren Paket von Grund auf neu geseedet werden kann: Der Datensatz darüber, welche Zeichenketten geseedet wurden, sowie das von der Seed-Aufgabe geschriebene Feedback werden gelöscht, und die unveröffentlichten Regeln, die nur aus dem Paket gelernt wurden, werden in den Papierkorb verschoben. Veröffentlichte Regeln werden beibehalten, sofern nicht anders gewählt; Feedback und Regeln von Übersetzern werden immer beibehalten. Die Löschungen können nicht rückgängig gemacht werden."
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_LABEL="Sprache"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_DESC="Die Sprache, deren Seeding vergessen wird."
PLG_TASK_TRANSLATIONSSEED_FORGET_LOG="Das Seeding von %1$s wurde vergessen: %2$d Zeichenketten werden erneut geseedet, %3$d Feedback-Zeilen wurden gelöscht und %4$d Regeln wurden in den Papierkorb verschoben."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_LABEL="Auch veröffentlichte Regeln in den Papierkorb verschieben"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_DESC="Verschiebt auch die aus diesem Sprachpaket gelernten veröffentlichten Regeln in den Papierkorb. Nur aktivieren, wenn sicher: Veröffentlichte Regeln wurden von jemandem überprüft und werden für jede Übersetzung in diese Sprache verwendet."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_WARNING="<strong>Bei dieser Option besonders vorsichtig sein.</strong> Veröffentlichte Regeln wurden überprüft und steuern jede neue Übersetzung in diese Sprache. Ist diese Option aktiviert, werden alle veröffentlichten Regeln, die aus dem Sprachpaket gelernt wurden, in den Papierkorb verschoben und sofort nicht mehr verwendet. Regeln, die von Übersetzern stammen, sind davon nicht betroffen. In den Papierkorb verschobene Regeln können in der Regeln-Ansicht aus dem Papierkorb wiederhergestellt werden, solange dieser nicht geleert wurde."
