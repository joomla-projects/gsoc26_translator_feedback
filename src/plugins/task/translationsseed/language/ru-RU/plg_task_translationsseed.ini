PLG_TASK_TRANSLATIONSSEED="Задача - Загрузка переводов"
PLG_TASK_TRANSLATIONSSEED_XML_DESCRIPTION="Плагин для загрузки правил перевода из установленного языкового пакета, чтобы сайт начинал с терминологии, уже согласованной языковой командой."
PLG_TASK_TRANSLATIONSSEED_TITLE="Загрузить правила перевода из языкового пакета"
PLG_TASK_TRANSLATIONSSEED_DESC="Переводит строки установленного языкового пакета без использования каких-либо правил, сопоставляет каждую с переводом, уже имеющимся в пакете, и записывает различия как обратную связь переводчика для дистиллятора. Каждый запуск отправляет запросы, пока не закончится отведённое время; следующий запуск продолжает работу."
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_LABEL="Язык"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_DESC="Установленный язык, на основе которого происходит обучение. Его пакет предоставляет утверждённые переводы."
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_LABEL="Строк на запрос"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_DESC="Наибольшее количество уникальных текстов, отправляемых провайдеру за один запрос. Текст, встречающийся в нескольких языковых файлах, отправляется один раз. Неудачный запрос повторяется с половиной этого размера."
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_LABEL="Время на один запуск (в секундах)"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_DESC="Сколько времени один запуск может отправлять запросы; запуск останавливается перед запросом, который, вероятно, не успеет завершиться вовремя, а следующий запуск продолжит работу. 0 означает 25 секунд через веб и 240 секунд из командной строки. При вызове Web Cron каждую минуту хорошим значением будет 110, если хостинг позволяет веб-запросу выполняться около двух минут. Держите значение тайм-аута задачи в настройках планировщика задач значительно выше этого, например 600."
PLG_TASK_TRANSLATIONSSEED_FILES_LABEL="Языковые файлы"
PLG_TASK_TRANSLATIONSSEED_FILES_DESC="Список имён языковых файлов для чтения, разделённых запятыми, например com_content.ini. Оставьте пустым, чтобы прочитать весь пакет."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_COMPONENT="Компонент «Переводы» не установлен или не включён, поэтому записывать результаты загрузки некуда."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_LANGUAGE="Язык не выбран, поэтому изучать пакет не из чего."
PLG_TASK_TRANSLATIONSSEED_LOG_BUSY="Другой процесс заполнения для пакета %s всё ещё выполняется, поэтому этот запуск ничего не сделал; ожидающие строки оставлены тому процессу."
PLG_TASK_TRANSLATIONSSEED_LOG_NONE="В пакете %s больше нечего заполнять."
PLG_TASK_TRANSLATIONSSEED_LOG_SEEDED="Заполнено %1$d строк из пакета %2$s; %3$d ещё ожидают."
PLG_TASK_TRANSLATIONSSEED_LOG_FAILED="%1$d строк не удалось заполнить; %2$d из них завершились неудачей в третий раз и отложены в сторону. Последняя ошибка: %3$s"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_TITLE="Повторить неудачные строки языкового пакета"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_DESC="Даёт строкам языкового пакета, отложенным задачей заполнения после трёх неудачных попыток, новый набор попыток. Запускайте её после устранения причины сбоев, например, некорректной модели или нулевого баланса кредитов."
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_LOG="%d неудачных строк будут заполнены снова."
PLG_TASK_TRANSLATIONSSEED_FORGET_TITLE="Забыть заполненный язык"
PLG_TASK_TRANSLATIONSSEED_FORGET_DESC="Забывает то, что задача заполнения сделала для одного языка, чтобы его пакет можно было заполнить заново с нуля: запись о том, какие строки были заполнены, и обратная связь, записанная задачей заполнения, удаляются, а неопубликованные правила, изученные только из пакета, перемещаются в корзину. Опубликованные правила сохраняются, если не указано иное; обратная связь и правила от переводчиков сохраняются всегда. Удаления нельзя отменить."
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_LABEL="Язык"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_DESC="Язык, заполнение которого забывается."
PLG_TASK_TRANSLATIONSSEED_FORGET_LOG="Забыто заполнение %1$s: %2$d строк будут заполнены снова, %3$d строк обратной связи удалены и %4$d правил перемещены в корзину."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_LABEL="Также переместить опубликованные правила в корзину"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_DESC="Также переместить в корзину опубликованные правила, изученные из этого языкового пакета. Оставьте этот параметр выключенным, если не уверены: опубликованные правила были проверены кем-то и используются для каждого перевода на этот язык."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_WARNING="<strong>Будьте очень осторожны с этим параметром.</strong> Опубликованные правила были проверены и направляют каждый новый перевод на этот язык. При включении этого параметра все опубликованные правила, изученные из языкового пакета, немедленно перемещаются в корзину и перестают использоваться. Правила, полученные от переводчиков, не затрагиваются. Вы можете восстановить удалённые правила из корзины в разделе «Правила», пока корзина не очищена."
