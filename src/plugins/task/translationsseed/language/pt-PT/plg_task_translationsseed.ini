PLG_TASK_TRANSLATIONSSEED="Tarefa — Semente de traduções"
PLG_TASK_TRANSLATIONSSEED_XML_DESCRIPTION="Semeia regras de tradução a partir de um pacote de idioma instalado, para que um sítio comece com a terminologia que a sua equipa de idioma já acordou."
PLG_TASK_TRANSLATIONSSEED_TITLE="Semear regras de tradução a partir de um pacote de idioma"
PLG_TASK_TRANSLATIONSSEED_DESC="Traduz as cadeias de um pacote de idioma instalado sem usar quaisquer regras, emparelha cada uma com a tradução que o pacote já contém, e regista as diferenças como feedback de tradutor para o destilador. Cada execução envia pedidos até o seu tempo se esgotar; a execução seguinte continua."
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_LABEL="Idioma"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_DESC="O idioma instalado a partir do qual aprender. O seu pacote fornece as traduções aprovadas."
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_LABEL="Cadeias por pedido"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_DESC="O número máximo de textos distintos enviados ao fornecedor num pedido. Um texto que ocorre em vários ficheiros de idioma é enviado uma vez. Um pedido que falhe é repetido a metade deste tamanho."
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_LABEL="Tempo por execução (segundos)"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_DESC="Durante quanto tempo uma execução pode continuar a enviar pedidos; a execução pára antes de um pedido que provavelmente não terminaria a tempo, e a execução seguinte continua. 0 significa 25 segundos na web e 240 segundos na linha de comandos. Com o Web Cron a ser chamado todos os minutos, 110 é um bom valor quando o seu alojamento permite que um pedido web execute cerca de dois minutos. Mantenha o Tempo limite da tarefa nas opções de Tarefas agendadas bem acima disso, por exemplo 600."
PLG_TASK_TRANSLATIONSSEED_FILES_LABEL="Ficheiros de idioma"
PLG_TASK_TRANSLATIONSSEED_FILES_DESC="Uma lista separada por vírgulas de nomes de ficheiros de idioma a ler, como com_content.ini. Deixe vazio para ler o pacote inteiro."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_COMPONENT="O componente Translations não está instalado ou não está autorizado, por isso não há onde registar o que é semeado."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_LANGUAGE="Não foi selecionado nenhum idioma, pelo que não há nenhum pacote a partir do qual aprender."
PLG_TASK_TRANSLATIONSSEED_LOG_BUSY="Outra execução de propagação para o pacote %s ainda está ocupada, pelo que esta execução não fez nada; as cadeias pendentes ficam para essa execução."
PLG_TASK_TRANSLATIONSSEED_LOG_NONE="Nada resta para propagar a partir do pacote %s."
PLG_TASK_TRANSLATIONSSEED_LOG_SEEDED="Foram propagadas %1$d cadeias a partir do pacote %2$s; %3$d ainda pendentes."
PLG_TASK_TRANSLATIONSSEED_LOG_FAILED="Não foi possível propagar %1$d cadeias; %2$d delas falharam pela terceira vez e foram postas de parte. Último erro: %3$s"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_TITLE="Tentar novamente cadeias falhadas do pacote de idiomas"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_DESC="Dá uma nova série de tentativas às cadeias do pacote de idiomas que a tarefa de propagação pôs de parte após três tentativas falhadas. Execute esta tarefa assim que a causa das falhas for corrigida, como um modelo inválido ou um saldo de créditos esgotado."
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_LOG="%d cadeias falhadas serão propagadas novamente."
PLG_TASK_TRANSLATIONSSEED_FORGET_TITLE="Esquecer um idioma propagado"
PLG_TASK_TRANSLATIONSSEED_FORGET_DESC="Esquece o que a tarefa de propagação fez por um idioma, para que o respetivo pacote possa ser propagado novamente do zero: o registo das cadeias que foram propagadas e os comentários que a tarefa de propagação escreveu são eliminados, e as regras não publicadas aprendidas apenas a partir do pacote são movidas para a reciclagem. As regras publicadas são mantidas, a menos que escolha o contrário; os comentários e as regras de tradutores são sempre mantidos. As eliminações não podem ser anuladas."
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_LABEL="Idioma"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_DESC="O idioma cuja propagação é esquecida."
PLG_TASK_TRANSLATIONSSEED_FORGET_LOG="Esquecida a propagação de %1$s: %2$d cadeias serão propagadas novamente, %3$d linhas de comentários foram eliminadas e %4$d regras foram movidas para a reciclagem."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_LABEL="Também enviar regras publicadas para a reciclagem"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_DESC="Também move para a reciclagem as regras publicadas aprendidas a partir deste pacote de idiomas. Deixe esta opção desativada, a menos que tenha a certeza: as regras publicadas foram revistas por alguém e estão em uso para todas as traduções para este idioma."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_WARNING="<strong>Tenha muito cuidado com esta opção.</strong> As regras publicadas foram revistas e orientam todas as novas traduções para este idioma. Com esta opção ativada, todas as regras publicadas aprendidas a partir do pacote de idiomas são movidas para a reciclagem e deixam de ser utilizadas de imediato. As regras que vieram de tradutores não são afetadas. Pode restaurar regras da reciclagem na vista Regras, desde que a reciclagem não tenha sido esvaziada."
