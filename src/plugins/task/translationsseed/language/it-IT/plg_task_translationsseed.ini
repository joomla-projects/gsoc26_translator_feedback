PLG_TASK_TRANSLATIONSSEED="Attività - Seme traduzioni"
PLG_TASK_TRANSLATIONSSEED_XML_DESCRIPTION="Genera regole di traduzione a partire da un pacchetto linguistico installato, così un sito parte con la terminologia già concordata dal proprio team linguistico"
PLG_TASK_TRANSLATIONSSEED_TITLE="Genera regole di traduzione da un pacchetto linguistico"
PLG_TASK_TRANSLATIONSSEED_DESC="Traduce le stringhe di un pacchetto linguistico installato senza usare alcuna regola, le confronta ciascuna con la traduzione già presente nel pacchetto, e registra le differenze come feedback del traduttore per il distillatore. Ogni esecuzione invia richieste finché il tempo a disposizione non è esaurito; l'esecuzione successiva prosegue"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_LABEL="Lingua"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_DESC="La lingua installata da cui imparare. Il suo pacchetto fornisce le traduzioni approvate"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_LABEL="Stringhe per richiesta"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_DESC="Il numero massimo di testi distinti inviati al provider in una richiesta. Un testo che ricorre in più file di lingua viene inviato una sola volta. Una richiesta fallita viene ritentata a metà di questa dimensione"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_LABEL="Tempo per esecuzione (secondi)"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_DESC="Per quanto tempo un'esecuzione può continuare a inviare richieste; l'esecuzione si interrompe prima di una richiesta che probabilmente non terminerebbe in tempo, e l'esecuzione successiva prosegue. 0 significa 25 secondi via web e 240 secondi da riga di comando. Con Web Cron richiamato ogni minuto, 110 è un buon valore quando il tuo hosting consente a una richiesta web di durare circa due minuti. Mantieni il timeout attività nelle opzioni delle attività pianificate ben al di sopra, ad esempio 600"
PLG_TASK_TRANSLATIONSSEED_FILES_LABEL="File di lingua"
PLG_TASK_TRANSLATIONSSEED_FILES_DESC="Una lista separata da virgole di nomi di file di lingua da leggere, come com_content.ini. Lascia vuoto per leggere l'intero pacchetto"
PLG_TASK_TRANSLATIONSSEED_LOG_NO_COMPONENT="Il componente Traduzioni non è installato o non è abilitato, quindi non c'è dove registrare ciò che viene generato"
PLG_TASK_TRANSLATIONSSEED_LOG_NO_LANGUAGE="Nessuna lingua selezionata, quindi non c'è alcun pacchetto da cui apprendere"
PLG_TASK_TRANSLATIONSSEED_LOG_BUSY="Un'altra esecuzione di seeding per il pacchetto %s è ancora in corso, quindi questa esecuzione non ha fatto nulla; le stringhe in attesa sono lasciate a quell'esecuzione"
PLG_TASK_TRANSLATIONSSEED_LOG_NONE="Nulla rimasto da seminare dal pacchetto %s"
PLG_TASK_TRANSLATIONSSEED_LOG_SEEDED="Seminate %1$d stringhe dal pacchetto %2$s; %3$d ancora in attesa"
PLG_TASK_TRANSLATIONSSEED_LOG_FAILED="%1$d stringhe non è stato possibile seminarle; %2$d di esse hanno fallito per la terza volta e sono state accantonate. Ultimo errore: %3$s"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_TITLE="Riprova stringhe del pacchetto lingua fallite"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_DESC="Dà alle stringhe del pacchetto lingua che l'attività di seeding ha accantonato dopo tre tentativi falliti un nuovo set di tentativi. Eseguilo una volta risolta la causa dei fallimenti, come un modello non valido o un saldo di credito esaurito"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_LOG="%d stringhe fallite saranno seminate di nuovo"
PLG_TASK_TRANSLATIONSSEED_FORGET_TITLE="Dimentica una lingua seminata"
PLG_TASK_TRANSLATIONSSEED_FORGET_DESC="Dimentica cosa ha fatto l'attività di seeding per una lingua, così il suo pacchetto può essere seminato di nuovo da zero: il registro delle stringhe seminate e il feedback scritto dall'attività di seeding vengono eliminati, e le regole sospese apprese solo dal pacchetto vengono spostate nel cestino. Le regole pubblicate vengono mantenute a meno che non si scelga diversamente; il feedback e le regole dei traduttori vengono sempre mantenuti. Le eliminazioni non possono essere annullate"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_LABEL="Lingua"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_DESC="La lingua di cui viene dimenticato il seeding"
PLG_TASK_TRANSLATIONSSEED_FORGET_LOG="Dimenticato il seeding di %1$s: %2$d stringhe saranno seminate di nuovo, %3$d righe di feedback sono state eliminate e %4$d regole spostate nel cestino"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_LABEL="Cestina anche le regole pubblicate"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_DESC="Sposta nel cestino anche le regole pubblicate apprese da questo pacchetto lingua. Lascia questa opzione disattivata a meno che tu non sia sicuro: le regole pubblicate sono state revisionate da qualcuno e sono in uso per ogni traduzione in questa lingua"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_WARNING="<strong>Fai molta attenzione con questa opzione.</strong> Le regole pubblicate sono state revisionate e guidano ogni nuova traduzione in questa lingua. Con questa opzione attiva, tutte le regole pubblicate apprese dal pacchetto lingua vengono spostate nel cestino e smettono subito di essere utilizzate. Le regole provenienti dai traduttori non sono interessate. Puoi ripristinare le regole cestinate dal cestino nella vista Regole, finché il cestino non è stato svuotato"
