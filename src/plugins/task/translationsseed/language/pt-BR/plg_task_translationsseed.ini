PLG_TASK_TRANSLATIONSSEED="Tarefa - Semente de Traduções"
PLG_TASK_TRANSLATIONSSEED_XML_DESCRIPTION="Semeia regras de tradução a partir de um pacote de idioma instalado, para que um site comece com a terminologia que sua equipe de idioma já concordou."
PLG_TASK_TRANSLATIONSSEED_TITLE="Semear Regras de Tradução a Partir de um Pacote de Idioma"
PLG_TASK_TRANSLATIONSSEED_DESC="Traduz as strings de um pacote de idioma instalado sem usar nenhuma regra, compara cada uma com a tradução que o pacote já contém, e registra as diferenças como feedback de tradutor para o destilador. Cada execução envia requisições até que seu tempo se esgote; a próxima execução continua."
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_LABEL="Idioma"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_DESC="O idioma instalado a partir do qual aprender. Seu pacote fornece as traduções aprovadas."
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_LABEL="Strings por Requisição"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_DESC="A quantidade máxima de textos distintos enviados ao provedor em uma requisição. Um texto que ocorre em vários arquivos de idioma é enviado uma vez. Uma requisição que falha é repetida com metade deste tamanho."
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_LABEL="Tempo por Execução (segundos)"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_DESC="Por quanto tempo uma execução pode continuar enviando requisições; a execução para antes de uma requisição que provavelmente não terminaria a tempo, e a próxima execução continua. 0 significa 25 segundos pela web e 240 segundos pela linha de comando. Com o Web Cron chamado a cada minuto, 110 é um bom valor quando sua hospedagem permite que uma requisição web seja executada por cerca de dois minutos. Mantenha o Tempo Limite da Tarefa nas opções de tarefas agendadas bem acima disso, por exemplo 600."
PLG_TASK_TRANSLATIONSSEED_FILES_LABEL="Arquivos de Idioma"
PLG_TASK_TRANSLATIONSSEED_FILES_DESC="Uma lista separada por vírgulas dos nomes de arquivos de idioma a serem lidos, como com_content.ini. Deixe em branco para ler o pacote inteiro."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_COMPONENT="O componente Translations não está instalado ou não está ativado, então não há onde registrar o que é semeado."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_LANGUAGE="Nenhum idioma foi selecionado, portanto não há pacote do qual aprender."
PLG_TASK_TRANSLATIONSSEED_LOG_BUSY="Outra execução do seed para o pacote %s ainda está ocupada, então esta execução não fez nada; as strings pendentes ficam para aquela execução."
PLG_TASK_TRANSLATIONSSEED_LOG_NONE="Nada restando para semear a partir do pacote %s."
PLG_TASK_TRANSLATIONSSEED_LOG_SEEDED="%1$d strings semeadas a partir do pacote %2$s; %3$d ainda pendentes."
PLG_TASK_TRANSLATIONSSEED_LOG_FAILED="%1$d strings não puderam ser semeadas; %2$d delas falharam pela terceira vez e foram colocadas de lado. Último erro: %3$s"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_TITLE="Tentar novamente as strings com falha do pacote de idioma"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_DESC="Dá às strings do pacote de idioma que a tarefa de seed colocou de lado após três tentativas falhas um novo conjunto de tentativas. Execute assim que a causa das falhas for corrigida, como um modelo inválido ou um saldo de créditos vazio."
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_LOG="%d strings com falha serão semeadas novamente."
PLG_TASK_TRANSLATIONSSEED_FORGET_TITLE="Esquecer um idioma semeado"
PLG_TASK_TRANSLATIONSSEED_FORGET_DESC="Esquece o que a tarefa de seed fez para um idioma, para que seu pacote possa ser semeado novamente do zero: o registro de quais strings foram semeadas e o feedback que a tarefa de seed escreveu são excluídos, e as regras não publicadas aprendidas apenas com o pacote são movidas para a lixeira. As regras publicadas são mantidas, a menos que você escolha o contrário; o feedback e as regras de tradutores são sempre mantidos. As exclusões não podem ser desfeitas."
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_LABEL="Idioma"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_DESC="O idioma cuja semeadura é esquecida."
PLG_TASK_TRANSLATIONSSEED_FORGET_LOG="Esqueceu a semeadura de %1$s: %2$d strings serão semeadas novamente, %3$d linhas de feedback foram excluídas e %4$d regras movidas para a lixeira."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_LABEL="Também mover regras publicadas para a lixeira"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_DESC="Também move as regras publicadas aprendidas a partir deste pacote de idioma para a lixeira. Deixe isso desativado a menos que tenha certeza: regras publicadas foram revisadas por alguém e estão em uso para toda tradução para este idioma."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_WARNING="<strong>Tenha muito cuidado com esta opção.</strong> As regras publicadas foram revisadas e orientam toda nova tradução para este idioma. Com esta opção ativada, todas as regras publicadas aprendidas a partir do pacote de idioma são movidas para a lixeira e deixam de ser usadas imediatamente. As regras provenientes de tradutores não são afetadas. Você pode restaurar regras na lixeira pela visão de Regras, desde que a lixeira não tenha sido esvaziada."
