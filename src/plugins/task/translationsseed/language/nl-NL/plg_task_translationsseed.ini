PLG_TASK_TRANSLATIONSSEED="Taak - Vertalingen Seed"
PLG_TASK_TRANSLATIONSSEED_XML_DESCRIPTION="Zaait vertaalregels vanuit een geïnstalleerd taalpakket, zodat een website begint met de terminologie waar het taalteam het al over eens was."
PLG_TASK_TRANSLATIONSSEED_TITLE="Vertaalregels Zaaien Vanuit een Taalpakket"
PLG_TASK_TRANSLATIONSSEED_DESC="Vertaalt de strings van een geïnstalleerd taalpakket zonder regels te gebruiken, vergelijkt elke string met de vertaling die het pakket al bevat, en registreert de verschillen als vertalersfeedback voor de distiller. Elke keer uitvoeren verstuurt verzoeken totdat de tijd op is; de volgende keer gaat verder."
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_LABEL="Taal"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_DESC="De geïnstalleerde taal om van te leren. Het taalpakket levert de goedgekeurde vertalingen."
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_LABEL="Strings per Verzoek"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_DESC="Het hoogste aantal verschillende teksten dat in één verzoek naar de aanbieder wordt gestuurd. Een tekst die in meerdere taalbestanden voorkomt, wordt eenmaal verstuurd. Een verzoek dat mislukt, wordt opnieuw geprobeerd met de helft van deze grootte."
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_LABEL="Tijd per Keer (seconden)"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_DESC="Hoe lang één keer uitvoeren verzoeken mag blijven versturen; de uitvoering stopt voordat een verzoek start dat waarschijnlijk niet op tijd klaar zou zijn, en de volgende keer gaat verder. 0 betekent 25 seconden via het web en 240 seconden vanaf de opdrachtregel. Bij Web Cron die elke minuut wordt aangeroepen, is 110 een goede waarde als uw hosting een webverzoek ongeveer twee minuten laat lopen. Houd de Taak Timeout in de opties van Geplande Taken ruim daarboven, bijvoorbeeld 600."
PLG_TASK_TRANSLATIONSSEED_FILES_LABEL="Taalbestanden"
PLG_TASK_TRANSLATIONSSEED_FILES_DESC="Een door komma's gescheiden lijst van taalbestandsnamen om te lezen, zoals com_content.ini. Laat leeg om het hele pakket te lezen."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_COMPONENT="De Translations-component is niet geïnstalleerd of niet ingeschakeld, dus er is nergens om vast te leggen wat er gezaaid is."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_LANGUAGE="Er is geen taal geselecteerd, dus er is geen pakket om van te leren."
PLG_TASK_TRANSLATIONSSEED_LOG_BUSY="Een andere seed-run voor het %s pakket is nog bezig, dus deze run heeft niets gedaan; de wachtende tekenreeksen worden aan die run overgelaten."
PLG_TASK_TRANSLATIONSSEED_LOG_NONE="Niets meer om te seeden vanuit het %s pakket."
PLG_TASK_TRANSLATIONSSEED_LOG_SEEDED="%1$d tekenreeksen geseed vanuit het %2$s pakket; %3$d staan nog in wachtrij."
PLG_TASK_TRANSLATIONSSEED_LOG_FAILED="%1$d tekenreeksen konden niet geseed worden; %2$d daarvan zijn voor de derde keer mislukt en apart gezet. Laatste fout: %3$s"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_TITLE="Mislukte Taalpakket Tekenreeksen Opnieuw Proberen"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_DESC="Geeft de taalpakket tekenreeksen die de seed-taak na drie mislukte pogingen apart heeft gezet, een nieuwe reeks pogingen. Voer dit uit zodra de oorzaak van de mislukkingen is opgelost, zoals een ongeldig model of een leeg tegoed."
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_LOG="%d mislukte tekenreeksen worden opnieuw geseed."
PLG_TASK_TRANSLATIONSSEED_FORGET_TITLE="Een Geseede Taal Vergeten"
PLG_TASK_TRANSLATIONSSEED_FORGET_DESC="Vergeet wat de seed-taak voor één taal heeft gedaan, zodat het pakket ervan opnieuw helemaal opnieuw geseed kan worden: de registratie van welke tekenreeksen geseed zijn en de feedback die de seed-taak geschreven heeft, worden verwijderd, en de gedepubliceerde regels die alleen uit het pakket zijn geleerd, worden naar de prullenbak verplaatst. Gepubliceerde regels blijven behouden, tenzij u anders kiest; feedback en regels van vertalers blijven altijd behouden. De verwijderingen kunnen niet ongedaan gemaakt worden."
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_LABEL="Taal"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_DESC="De taal waarvan de seeding vergeten wordt."
PLG_TASK_TRANSLATIONSSEED_FORGET_LOG="De seeding van %1$s is vergeten: %2$d tekenreeksen worden opnieuw geseed, %3$d feedback-rijen zijn verwijderd en %4$d regels zijn naar de prullenbak verplaatst."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_LABEL="Ook Gepubliceerde Regels naar Prullenbak"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_DESC="Verplaats ook de gepubliceerde regels die van dit taalpakket zijn geleerd naar de prullenbak. Laat dit uit tenzij u het zeker weet: gepubliceerde regels zijn door iemand herzien en worden gebruikt voor elke vertaling naar deze taal."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_WARNING="<strong>Wees zeer voorzichtig met deze optie.</strong> Gepubliceerde regels zijn herzien en sturen elke nieuwe vertaling naar deze taal. Met deze optie aan worden alle gepubliceerde regels die uit het taalpakket zijn geleerd, naar de prullenbak verplaatst en stoppen ze meteen met gebruikt worden. Regels die van vertalers afkomstig zijn, worden niet beïnvloed. U kunt regels die naar de prullenbak zijn verplaatst, herstellen vanuit de prullenbak in het overzicht Regels, zolang de prullenbak niet geleegd is."
