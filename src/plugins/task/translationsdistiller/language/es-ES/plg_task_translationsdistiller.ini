PLG_TASK_TRANSLATIONSDISTILLER="Tarea - Destilador de traducciones"
PLG_TASK_TRANSLATIONSDISTILLER_XML_DESCRIPTION="Ejecuta el destilador de reglas de Traducciones sobre los comentarios pendientes de los traductores según una programación."
PLG_TASK_TRANSLATIONSDISTILLER_TITLE="Destilar reglas de traducción"
PLG_TASK_TRANSLATIONSDISTILLER_DESC="Destila los comentarios pendientes de los traductores en reglas de traducción provisionales. Cada ejecución envía solicitudes hasta que se agota su tiempo; la siguiente ejecución continúa donde quedó. Una fila que falla tres veces se aparta y no se vuelve a enviar."
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_LABEL="Correcciones por solicitud"
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_DESC="El máximo de filas de comentarios enviadas al proveedor en una solicitud. Las filas largas, como artículos completos, se incluyen en menor cantidad por solicitud para que esta mantenga un tamaño manejable. Una solicitud que falle se reintenta a la mitad de este tamaño."
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_LABEL="Tiempo por ejecución (segundos)"
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_DESC="Cuánto tiempo puede una ejecución seguir enviando solicitudes; la ejecución se detiene antes de una solicitud que probablemente no terminaría a tiempo, y la siguiente ejecución continúa. 0 significa 25 segundos a través de la web y 240 segundos desde la línea de comandos. Con Webcron llamado cada minuto, 110 es un buen valor cuando su alojamiento permite que una solicitud web se ejecute durante unos dos minutos. Mantenga el tiempo de espera de la tarea en las opciones de tareas programadas bastante por encima de ese valor, por ejemplo 600."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_BUSY="Otra ejecución de destilado sigue ocupada, por lo que esta ejecución no hizo nada; los comentarios pendientes se dejan a esa ejecución."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_NONE="No hay comentarios pendientes para destilar."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_PROCESSED="Reglas borrador destiladas a partir de %1$d filas de comentarios; %2$d aún pendientes."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_FAILED="No se han podido destilar %1$d filas de comentarios; %2$d de ellas fallaron por tercera vez y se han dejado aparte. Último error: %3$s"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_TITLE="Reintentar comentarios de traductor fallidos"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_DESC="Da a las filas de comentarios que el destilador dejó aparte tras tres intentos fallidos un nuevo conjunto de intentos. Ejecútelo una vez que se haya solucionado la causa de los fallos, como un modelo inválido o un saldo de crédito vacío."
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_LOG="%d filas de comentarios fallidos están pendientes de nuevo."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_TITLE="Fusionar reglas de traducción duplicadas"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_DESC="Fusiona reglas de terminología y preservación que tengan el mismo término y traducción. Se conserva la regla más antigua de cada conjunto, que toma el relevo de la evidencia y la confianza más alta de las demás, y las demás se envían a la papelera."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_LABEL="Idioma"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_DESC="El idioma de destino cuyas reglas se fusionan."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_ALL_LANGUAGES="Todos los idiomas"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LOG="Se fusionaron %d reglas duplicadas; están en la papelera."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TITLE="Importar correcciones de traducción"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_DESC="Aplica un archivo de correcciones a las traducciones, como una reparación de todo el sitio, y registra cada corrección distinta una vez como comentario del traductor para el extractor. Un campo que se haya editado desde que se creó el archivo se deja intacto, y ejecutar el archivo de nuevo no cambia nada. Los estados de revisión de las traducciones permanecen como están."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_LABEL="Archivo de correcciones"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_DESC="El archivo JSON con las correcciones, relativo a la raíz del sitio, por ejemplo tmp/translations-corrections.json. Tiene que estar dentro del sitio. Elimínelo una vez finalizada la importación."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TIME_BUDGET_DESC="Cuánto tiempo puede una ejecución seguir guardando traducciones; la siguiente ejecución continúa. 0 significa 25 segundos a través de la web y 240 segundos desde la línea de comandos. Con Webcron llamado cada minuto, 50 es un buen valor."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_BUSY="Otra importación sigue ocupada; esta tarea continúa después de ella."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_APPLIED="Se han corregido %1$d traducciones; %2$d ya tenían sus correcciones; %3$d quedan por hacer."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_CHANGED="%1$d traducciones se editaron desde que se creó el archivo y se han dejado intactas: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_MISSING="No se encuentran %1$d traducciones: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_LOCKED="%1$d traducciones están bloqueadas por otro usuario y se han dejado intactas: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FAILED="No se han podido guardar %1$d traducciones. Último error: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK="Se han registrado %d correcciones como comentarios del traductor."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK_NEXT="Todas las traducciones están gestionadas; la siguiente ejecución registra las correcciones como comentarios del traductor."
