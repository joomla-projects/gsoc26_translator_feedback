PLG_TASK_TRANSLATIONSDISTILLER="Задача - Translations Distiller"
PLG_TASK_TRANSLATIONSDISTILLER_XML_DESCRIPTION="Запускает по расписанию обработчик правил переводов на основе ожидающих отзывов переводчиков."
PLG_TASK_TRANSLATIONSDISTILLER_TITLE="Обработка правил перевода"
PLG_TASK_TRANSLATIONSDISTILLER_DESC="Обрабатывает ожидающие отзывы переводчиков в черновые правила перевода. Каждый запуск отправляет запросы до тех пор, пока не закончится отведённое время; следующий запуск продолжает работу. Строка, которая трижды завершилась неудачей, откладывается и больше не отправляется."
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_LABEL="Исправлений на запрос"
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_DESC="Максимальное количество строк отзывов, отправляемых поставщику за один запрос. Длинные строки, например, целые материалы, включаются в запрос в меньшем количестве, чтобы размер запроса оставался приемлемым. Запрос, завершившийся неудачей, повторяется с половинным размером."
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_LABEL="Время на один запуск (в секундах)"
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_DESC="Сколько времени один запуск может отправлять запросы; запуск останавливается перед запросом, который, вероятно, не успеет завершиться вовремя, а следующий запуск продолжит работу. 0 означает 25 секунд через веб и 240 секунд из командной строки. При вызове Web Cron каждую минуту хорошим значением будет 110, если хостинг позволяет веб-запросу выполняться около двух минут. Держите значение тайм-аута задачи в настройках планировщика задач значительно выше этого, например 600."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_BUSY="Другой процесс дистилляции ещё выполняется, поэтому этот запуск ничего не сделал; ожидающая обратная связь оставлена тому процессу."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_NONE="Нет ожидающей обратной связи для дистилляции."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_PROCESSED="Выделены черновые правила из %1$d строк обратной связи; %2$d всё ещё ожидают обработки."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_FAILED="%1$d строк обратной связи не удалось обработать; %2$d из них завершились неудачей в третий раз и отложены. Последняя ошибка: %3$s"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_TITLE="Повторить неудачную обратную связь переводчика"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_DESC="Даёт строкам обратной связи, которые дистиллятор отложил после трёх неудачных попыток, новый набор попыток. Запускайте после устранения причины сбоев, например некорректной модели или пустого баланса кредитов."
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_LOG="%d неудачных строк обратной связи снова ожидают обработки."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_TITLE="Объединить дублирующиеся правила перевода"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_DESC="Объединяет правила терминологии и сохранения, имеющие одинаковый термин и перевод. Самое старое правило из каждого набора сохраняется, принимает доказательства и наивысшую уверенность остальных, а остальные перемещаются в корзину."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_LABEL="Язык"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_DESC="Целевой язык, правила которого объединяются."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_ALL_LANGUAGES="Все языки"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LOG="Объединено и удалено %d дублирующихся правил; они находятся в корзине."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TITLE="Импорт исправлений перевода"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_DESC="Применяет файл исправлений к переводам, например, при восстановлении всего сайта, и записывает каждое отдельное исправление один раз в качестве отзыва переводчика для дистиллятора. Поле, которое было изменено после создания файла, остаётся без изменений, а повторный запуск файла ничего не меняет. Состояния проверки переводов остаются прежними."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_LABEL="Файл исправлений"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_DESC="JSON-файл с исправлениями, путь указывается относительно корня сайта, например tmp/translations-corrections.json. Он должен находиться внутри сайта. Удалите его после завершения импорта."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TIME_BUDGET_DESC="Как долго один запуск может продолжать сохранять переводы; следующий запуск продолжает с того места. 0 означает 25 секунд через веб и 240 секунд из командной строки. При вызове Web Cron каждую минуту хорошее значение — 50."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_BUSY="Другой импорт всё ещё выполняется; эта задача продолжит работу после его завершения."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_APPLIED="Исправлено переводов: %1$d; уже содержали эти исправления: %2$d; осталось обработать: %3$d."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_CHANGED="%1$d переводов были изменены после создания файла и оставлены без изменений: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_MISSING="%1$d переводов не найдено: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_LOCKED="%1$d переводов заблокированы другим пользователем и оставлены без изменений: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FAILED="Не удалось сохранить %1$d переводов. Последняя ошибка: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK="Записано %d исправлений в качестве отзыва переводчика."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK_NEXT="Все переводы обработаны; следующий запуск зафиксирует исправления как отзыв переводчика."
