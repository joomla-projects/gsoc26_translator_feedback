PLG_TASK_TRANSLATIONSDISTILLER="Tarefa - Translations Distiller"
PLG_TASK_TRANSLATIONSDISTILLER_XML_DESCRIPTION="Executa o destilador de regras de Translations sobre o feedback pendente dos tradutores de acordo com um agendamento."
PLG_TASK_TRANSLATIONSDISTILLER_TITLE="Destilar regras de tradução"
PLG_TASK_TRANSLATIONSDISTILLER_DESC="Destila o feedback pendente dos tradutores em regras de tradução provisórias. Cada execução envia requisições até que seu tempo se esgote; a próxima execução continua de onde parou. Uma linha que falhar três vezes é colocada de lado e não é enviada novamente."
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_LABEL="Correções por requisição"
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_DESC="A quantidade máxima de linhas de feedback enviadas ao provedor em uma requisição. Linhas longas, como artigos inteiros, são enviadas em menor quantidade por requisição para que esta permaneça em um tamanho administrável. Uma requisição que falhar será reenviada com metade desse tamanho."
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_LABEL="Tempo por Execução (segundos)"
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_DESC="Por quanto tempo uma execução pode continuar enviando requisições; a execução para antes de uma requisição que provavelmente não terminaria a tempo, e a próxima execução continua. 0 significa 25 segundos pela web e 240 segundos pela linha de comando. Com o Web Cron chamado a cada minuto, 110 é um bom valor quando sua hospedagem permite que uma requisição web seja executada por cerca de dois minutos. Mantenha o Tempo Limite da Tarefa nas opções de tarefas agendadas bem acima disso, por exemplo 600."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_BUSY="Outra execução de destilação ainda está ocupada, então esta execução não fez nada; o feedback pendente é deixado para aquela execução."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_NONE="Nenhum feedback pendente para destilar."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_PROCESSED="Regras rascunho destiladas a partir de %1$d linhas de feedback; %2$d ainda pendentes."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_FAILED="%1$d linhas de feedback não puderam ser destiladas; %2$d delas falharam pela terceira vez e foram reservadas. Último erro: %3$s"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_TITLE="Repetir Feedback de Tradutor com Falha"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_DESC="Dá às linhas de feedback que o destilador reservou após três tentativas falhas um novo conjunto de tentativas. Execute assim que a causa das falhas for corrigida, como um modelo inválido ou um saldo de créditos vazio."
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_LOG="%d linhas de feedback com falha estão pendentes novamente."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_TITLE="Mesclar Regras de Tradução Duplicadas"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_DESC="Mescla regras de terminologia e preservação que têm o mesmo termo e tradução. A regra mais antiga de cada conjunto é mantida, assume as evidências e a maior confiança das outras, e as outras são movidas para a lixeira."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_LABEL="Idioma"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_DESC="O idioma de destino cujas regras são mescladas."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_ALL_LANGUAGES="Todos os idiomas"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LOG="%d regras duplicadas foram mescladas e removidas; estão na lixeira."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TITLE="Importar correções de tradução"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_DESC="Aplica um arquivo de correções às traduções, como um reparo de todo o site, e registra cada correção distinta uma vez como feedback do tradutor para o distiller. Um campo que foi editado desde que o arquivo foi criado é deixado intacto, e executar o arquivo novamente não altera nada. Os estados de revisão das traduções permanecem como estão."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_LABEL="Arquivo de correções"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_DESC="O arquivo JSON com as correções, relativo à raiz do site, por exemplo tmp/translations-corrections.json. Ele precisa estar dentro do site. Remova-o assim que a importação for concluída."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TIME_BUDGET_DESC="Por quanto tempo uma execução pode continuar salvando traduções; a próxima execução continua de onde parou. 0 significa 25 segundos pela web e 240 segundos pela linha de comando. Com o Web Cron chamado a cada minuto, 50 é um bom valor."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_BUSY="Outra importação ainda está ocupada; esta tarefa continua depois dela."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_APPLIED="Corrigidas %1$d traduções; %2$d já mantinham suas correções; %3$d ainda a fazer."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_CHANGED="%1$d traduções foram editadas desde que o arquivo foi criado e são deixadas intactas: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_MISSING="%1$d traduções não foram encontradas: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_LOCKED="%1$d traduções estão retiradas/travadas por outro usuário e são deixadas intactas: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FAILED="%1$d traduções não puderam ser salvas. Último erro: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK="Registradas %d correções como feedback do tradutor com sucesso."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK_NEXT="Todas as traduções foram tratadas; a próxima execução registra as correções como feedback do tradutor."
