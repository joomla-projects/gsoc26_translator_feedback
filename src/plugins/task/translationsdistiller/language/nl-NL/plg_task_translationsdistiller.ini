PLG_TASK_TRANSLATIONSDISTILLER="Taak - Vertalingen Distilleren"
PLG_TASK_TRANSLATIONSDISTILLER_XML_DESCRIPTION="Voert de distilleerregels voor vertalingen uit over openstaande vertalersfeedback volgens een schema."
PLG_TASK_TRANSLATIONSDISTILLER_TITLE="Vertaalregels Distilleren"
PLG_TASK_TRANSLATIONSDISTILLER_DESC="Distilleert de openstaande vertalersfeedback tot conceptvertaalregels. Elke uitvoering verstuurt verzoeken totdat de tijd op is; de volgende uitvoering gaat verder. Een rij die drie keer mislukt, wordt terzijde gelegd en niet opnieuw verzonden."
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_LABEL="Correcties per Verzoek"
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_DESC="Het maximale aantal feedbackrijen dat in één verzoek naar de provider wordt verzonden. Lange rijen, zoals hele artikelen, worden met minder per verzoek verzonden zodat een verzoek een beheersbare grootte houdt. Een verzoek dat mislukt, wordt opnieuw geprobeerd met de helft van deze grootte."
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_LABEL="Tijd per Keer (seconden)"
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_DESC="Hoe lang één keer uitvoeren verzoeken mag blijven versturen; de uitvoering stopt voordat een verzoek start dat waarschijnlijk niet op tijd klaar zou zijn, en de volgende keer gaat verder. 0 betekent 25 seconden via het web en 240 seconden vanaf de opdrachtregel. Bij Web Cron die elke minuut wordt aangeroepen, is 110 een goede waarde als uw hosting een webverzoek ongeveer twee minuten laat lopen. Houd de Taak Timeout in de opties van Geplande Taken ruim daarboven, bijvoorbeeld 600."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_BUSY="Een andere distilleer-uitvoering is nog bezig, dus deze uitvoering heeft niets gedaan; de wachtende feedback wordt overgelaten aan die uitvoering."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_NONE="Geen wachtende feedback om te distilleren."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_PROCESSED="Conceptregels gedistilleerd uit %1$d feedbackrijen; %2$d staan nog in wachtrij."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_FAILED="%1$d feedbackrijen konden niet gedistilleerd worden; %2$d daarvan zijn voor de derde keer mislukt en zijn terzijde gelegd. Laatste fout: %3$s"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_TITLE="Mislukte Vertalersfeedback Opnieuw Proberen"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_DESC="Geeft de feedbackrijen die de distiller na drie mislukte pogingen terzijde heeft gelegd een nieuwe set pogingen. Voer dit uit zodra de oorzaak van de mislukkingen is opgelost, zoals een ongeldig model of een leeg tegoed."
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_LOG="%d mislukte feedbackrijen staan weer in wachtrij."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_TITLE="Dubbele Vertaalregels Samenvoegen"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_DESC="Voegt terminologie- en behoudregels samen die dezelfde term en vertaling hebben. De oudste regel van elke set wordt bewaard, neemt het bewijs en het hoogste vertrouwen van de andere over, en de andere gaan naar de prullenbak."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_LABEL="Taal"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_DESC="De doeltaal waarvan de regels worden samengevoegd."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_ALL_LANGUAGES="Alle talen"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LOG="%d dubbele regels samengevoegd; ze staan in de prullenbak."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TITLE="Correcties voor vertalingen importeren"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_DESC="Past een bestand met correcties toe op vertalingen, zoals een reparatie van de hele website, en registreert elke afzonderlijke correctie eenmaal als vertalersfeedback voor de distiller. Een veld dat is bewerkt sinds het bestand is gemaakt, wordt met rust gelaten, en het opnieuw uitvoeren van het bestand verandert niets. De herzieningsstatus van de vertalingen blijft zoals deze is."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_LABEL="Correctiebestand"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_DESC="Het JSON-bestand met de correcties, relatief ten opzichte van de hoofdmap van de website, bijvoorbeeld tmp/translations-corrections.json. Het moet zich binnen de website bevinden. Verwijder het zodra de import is voltooid."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TIME_BUDGET_DESC="Hoelang één uitvoering vertalingen mag blijven opslaan; de volgende uitvoering gaat verder. 0 betekent 25 seconden via het web en 240 seconden vanaf de opdrachtregel. Met Web Cron die elke minuut wordt aangeroepen, is 50 een goede waarde."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_BUSY="Een andere import is nog bezig; deze taak gaat daarna verder."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_APPLIED="%1$d vertalingen gecorrigeerd; %2$d hadden hun correcties al; %3$d nog te doen."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_CHANGED="%1$d vertalingen zijn bewerkt sinds het bestand is gemaakt en worden met rust gelaten: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_MISSING="%1$d vertalingen zijn niet gevonden: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_LOCKED="%1$d vertalingen zijn uitgecheckt door een andere gebruiker en worden met rust gelaten: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FAILED="%1$d vertalingen konden niet worden opgeslagen. Laatste fout: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK="%d correcties geregistreerd als vertalersfeedback."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK_NEXT="Alle vertalingen zijn verwerkt; de volgende uitvoering registreert de correcties als vertalersfeedback."
