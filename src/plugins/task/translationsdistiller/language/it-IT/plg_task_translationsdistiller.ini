PLG_TASK_TRANSLATIONSDISTILLER="Task - Translations Distiller"
PLG_TASK_TRANSLATIONSDISTILLER_XML_DESCRIPTION="Esegue il distillatore delle regole di traduzione sui feedback dei traduttori in sospeso secondo una pianificazione"
PLG_TASK_TRANSLATIONSDISTILLER_TITLE="Distilla regole di traduzione"
PLG_TASK_TRANSLATIONSDISTILLER_DESC="Distilla il feedback dei traduttori in sospeso in bozze di regole di traduzione. Ogni esecuzione invia richieste finché il tempo a disposizione non è esaurito; l'esecuzione successiva prosegue. Una riga che fallisce tre volte viene accantonata e non viene più inviata."
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_LABEL="Correzioni per richiesta"
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_DESC="Il numero massimo di righe di feedback inviate al provider in una singola richiesta. Le righe lunghe, come interi articoli, vengono inviate in numero minore per richiesta in modo da mantenere una dimensione gestibile della richiesta. Una richiesta fallita viene ritentata con la metà di questa dimensione."
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_LABEL="Tempo per esecuzione (secondi)"
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_DESC="Per quanto tempo un'esecuzione può continuare a inviare richieste; l'esecuzione si interrompe prima di una richiesta che probabilmente non terminerebbe in tempo, e l'esecuzione successiva prosegue. 0 significa 25 secondi via web e 240 secondi da riga di comando. Con Web Cron richiamato ogni minuto, 110 è un buon valore quando il tuo hosting consente a una richiesta web di durare circa due minuti. Mantieni il timeout attività nelle opzioni delle attività pianificate ben al di sopra, ad esempio 600"
PLG_TASK_TRANSLATIONSDISTILLER_LOG_BUSY="Un'altra esecuzione di distillazione è ancora occupata, quindi questa esecuzione non ha fatto nulla; il feedback in sospeso è lasciato a quell'esecuzione"
PLG_TASK_TRANSLATIONSDISTILLER_LOG_NONE="Nessun feedback in sospeso da distillare"
PLG_TASK_TRANSLATIONSDISTILLER_LOG_PROCESSED="Distillate regole bozza da %1$d righe di feedback; %2$d ancora in sospeso"
PLG_TASK_TRANSLATIONSDISTILLER_LOG_FAILED="%1$d righe di feedback non sono state distillate; %2$d di esse hanno fallito per la terza volta e sono state accantonate. Ultimo errore: %3$s"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_TITLE="Riprova feedback traduttore fallito"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_DESC="Dà alle righe di feedback che il distillatore ha accantonato dopo tre tentativi falliti un nuovo set di tentativi. Eseguilo una volta risolta la causa dei fallimenti, come un modello non valido o un saldo di credito esaurito"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_LOG="%d righe di feedback fallite sono di nuovo in sospeso"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_TITLE="Unisci regole di traduzione duplicate"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_DESC="Unisce le regole di terminologia e conservazione che hanno lo stesso termine e la stessa traduzione. La regola più vecchia di ogni gruppo viene mantenuta, eredita le prove e la fiducia più alta delle altre, e le altre vengono cestinate"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_LABEL="Lingua"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_DESC="La lingua di destinazione le cui regole vengono unite"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_ALL_LANGUAGES="Tutte le lingue"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LOG="Unite ed eliminate %d regole duplicate; si trovano nel cestino"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TITLE="Importa correzioni traduzioni"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_DESC="Applica un file di correzioni alle traduzioni, come una riparazione dell'intero sito, e registra ogni correzione distinta una sola volta come feedback del traduttore per il distiller. Un campo modificato dopo la creazione del file viene lasciato invariato, e rieseguire il file non cambia nulla. Gli stati di revisione delle traduzioni restano come sono."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_LABEL="File delle correzioni"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_DESC="Il file JSON con le correzioni, relativo alla radice del sito, ad esempio tmp/translations-corrections.json. Deve trovarsi all'interno del sito. Eliminalo una volta completata l'importazione."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TIME_BUDGET_DESC="Per quanto tempo un'esecuzione può continuare a salvare traduzioni; l'esecuzione successiva prosegue. 0 significa 25 secondi via web e 240 secondi da riga di comando. Con Web Cron richiamato ogni minuto, 50 è un buon valore."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_BUSY="Un'altra importazione è ancora occupata; questa attività prosegue dopo di essa."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_APPLIED="Corrette %1$d traduzioni; %2$d avevano già le correzioni applicate; %3$d ancora da fare"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_CHANGED="%1$d traduzioni sono state modificate dopo la creazione del file e vengono lasciate invariate: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_MISSING="%1$d traduzioni non sono state trovate: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_LOCKED="%1$d traduzioni sono bloccate da un altro utente e vengono lasciate invariate: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FAILED="Non è possibile salvare %1$d traduzioni. Ultimo errore: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK="Registrate %d correzioni come feedback del traduttore"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK_NEXT="Tutte le traduzioni sono state gestite; l'esecuzione successiva registra le correzioni come feedback del traduttore."
