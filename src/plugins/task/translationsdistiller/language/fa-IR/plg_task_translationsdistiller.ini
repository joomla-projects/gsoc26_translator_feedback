PLG_TASK_TRANSLATIONSDISTILLER="وظیفه - تقطیرگر ترجمه ها"
PLG_TASK_TRANSLATIONSDISTILLER_XML_DESCRIPTION="بر اساس یک زمان بندی، تقطیرگر قوانین ترجمه را بر روی بازخوردهای در انتظار مترجم اجرا می کند."
PLG_TASK_TRANSLATIONSDISTILLER_TITLE="تقطیر قوانین ترجمه"
PLG_TASK_TRANSLATIONSDISTILLER_DESC="بازخوردهای در انتظار مترجم را به پیش نویس قوانین ترجمه تقطیر می کند. هر اجرا درخواست ها را تا پایان زمان خود ارسال می کند؛ اجرای بعدی ادامه می دهد. ردیفی که سه بار با شکست مواجه شود کنار گذاشته شده و دوباره ارسال نمی شود."
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_LABEL="تصحیحات در هر درخواست"
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_DESC="بیشترین تعداد ردیف های بازخورد ارسال شده به ارائه دهنده در یک درخواست. ردیف های طولانی، مانند کل مطالب، تعداد کمتری در هر درخواست قرار می گیرند تا اندازه درخواست قابل مدیریت باقی بماند. درخواستی که با شکست مواجه شود با نصف این اندازه دوباره امتحان می شود."
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_LABEL="زمان هر اجرا (ثانیه)"
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_DESC="مدت زمانی که یک اجرا می تواند درخواست ارسال کند؛ اجرا پیش از درخواستی که احتمالاً به موقع تمام نمی شود متوقف می شود و اجرای بعدی آن را ادامه می دهد. 0 به معنای 25 ثانیه در وب و 240 ثانیه از خط فرمان است. با فراخوانی Web Cron هر دقیقه، 110 مقدار مناسبی است وقتی میزبانی شما اجازه می دهد یک درخواست وب حدود دو دقیقه اجرا شود. مهلت زمانی وظیفه را در گزینه های وظایف زمان بندی شده بسیار بالاتر از آن نگه دارید، مثلاً 600."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_BUSY="یک اجرای تقطیر دیگر هنوز در حال انجام است، بنابراین این اجرا کاری انجام نداد؛ بازخورد در انتظار به آن اجرا واگذار شد."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_NONE="هیچ بازخورد در انتظاری برای تقطیر وجود ندارد."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_PROCESSED="قوانین پیش نویس از %1$d ردیف بازخورد تقطیر شد؛ %2$d مورد همچنان در انتظار است."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_FAILED="%1$d ردیف بازخورد قابل تقطیر نبود؛ %2$d مورد از آنها برای سومین بار شکست خورد و کنار گذاشته شد. آخرین خطا: %3$s"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_TITLE="تلاش مجدد برای بازخورد ناموفق مترجم"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_DESC="ردیف های بازخوردی را که تقطیرگر پس از سه تلاش ناموفق کنار گذاشته است، مجموعه ای جدید از تلاش ها می دهد. آن را زمانی اجرا کنید که علت خرابی ها برطرف شده باشد، مانند یک مدل نامعتبر یا موجودی اعتبار خالی."
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_LOG="%d ردیف بازخورد ناموفق دوباره در انتظار هستند."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_TITLE="ادغام قوانین ترجمه تکراری"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_DESC="قوانین اصطلاح شناسی و حفاظت را که دارای عبارت و ترجمه یکسان هستند ادغام می کند. قدیمی ترین قانون از هر مجموعه نگه داشته می شود، شواهد و بالاترین اطمینان دیگران را به دست می گیرد و بقیه حذف می شوند."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_LABEL="زبان"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_DESC="زبان هدفی که قوانین آن ادغام می شود."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_ALL_LANGUAGES="همه زبان ها"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LOG="%d قانون تکراری ادغام شدند؛ آنها در سطل زباله قرار دارند."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TITLE="وارد کردن اصلاحات ترجمه"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_DESC="فایلی از اصلاحات را روی ترجمه ها اعمال می کند، مانند تعمیر کل سایت، و هر اصلاح متمایز را یک بار به عنوان بازخورد مترجم برای پالایشگر ثبت می کند. فیلدی که از زمان ساخت فایل ویرایش شده دست نخورده باقی می ماند و اجرای دوباره فایل چیزی را تغییر نمی دهد. وضعیت های بازبینی ترجمه ها همان گونه که هستند باقی می مانند."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_LABEL="فایل اصلاحات"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_DESC="فایل JSON حاوی اصلاحات، نسبت به ریشه سایت، برای مثال tmp/translations-corrections.json. باید درون سایت قرار گیرد. پس از پایان وارد کردن آن را حذف کنید."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TIME_BUDGET_DESC="یک اجرا چه مدت می تواند به ذخیره ترجمه ها ادامه دهد؛ اجرای بعدی ادامه می دهد. 0 به معنای 25 ثانیه در وب و 240 ثانیه از خط فرمان است. با Web Cron که هر دقیقه فراخوانی می شود، 50 مقدار خوبی است."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_BUSY="واردات دیگری هنوز مشغول است؛ این وظیفه پس از آن ادامه می یابد."
