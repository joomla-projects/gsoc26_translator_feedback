PLG_TASK_TRANSLATIONSDISTILLER="Tâche - Distillateur de traductions"
PLG_TASK_TRANSLATIONSDISTILLER_XML_DESCRIPTION="Exécute le distillateur de règles de traduction sur les retours de traducteurs en attente, selon une planification."
PLG_TASK_TRANSLATIONSDISTILLER_TITLE="Distiller les règles de traduction"
PLG_TASK_TRANSLATIONSDISTILLER_DESC="Distille les retours de traducteurs en attente en règles de traduction provisoires. Chaque exécution envoie des requêtes jusqu'à épuisement du temps imparti ; l'exécution suivante prend le relais. Une ligne ayant échoué trois fois est mise de côté et n'est plus renvoyée."
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_LABEL="Corrections par requête"
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_DESC="Le nombre maximal de lignes de retour envoyées au fournisseur en une seule requête. Les lignes longues, comme des articles entiers, sont envoyées en plus petit nombre par requête afin de garder une taille de requête gérable. Une requête ayant échoué est retentée à la moitié de cette taille."
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_LABEL="Temps par exécution (secondes)"
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_DESC="Durée pendant laquelle une exécution peut continuer à envoyer des requêtes ; l'exécution s'arrête avant une requête qui ne finirait probablement pas à temps, et l'exécution suivante prend le relais. 0 signifie 25 secondes sur le web et 240 secondes en ligne de commande. Avec le Web Cron appelé chaque minute, 110 est une bonne valeur quand votre hébergement permet à une requête web de s'exécuter environ deux minutes. Gardez le délai d'expiration de la tâche dans les paramètres des tâches planifiées bien au-dessus, par exemple 600."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_BUSY="Une autre exécution de distillation est encore en cours, donc cette exécution n'a rien fait ; le retour en attente est laissé à cette exécution."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_NONE="Aucun retour en attente à distiller."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_PROCESSED="Règles provisoires distillées à partir de %1$d lignes de retour ; %2$d encore en attente."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_FAILED="%1$d lignes de retour n'ont pas pu être distillées ; %2$d d'entre elles ont échoué pour la troisième fois et sont mises de côté. Dernière erreur : %3$s"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_TITLE="Réessayer le retour du traducteur en échec"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_DESC="Donne un nouveau jeu de tentatives aux lignes de retour que le distillateur a mises de côté après trois tentatives échouées. Exécutez-la une fois la cause des échecs corrigée, comme un modèle invalide ou un solde de crédit vide."
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_LOG="%d lignes de retour en échec sont de nouveau en attente."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_TITLE="Fusionner les règles de traduction en double"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_DESC="Fusionne les règles de terminologie et de préservation qui ont le même terme et la même traduction. La règle la plus ancienne de chaque ensemble est conservée, reprend les preuves et la confiance la plus élevée des autres, et les autres sont mises à la corbeille."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_LABEL="Langue"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_DESC="La langue cible dont les règles sont fusionnées."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_ALL_LANGUAGES="Toutes les langues"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LOG="%d règles en double ont été fusionnées ; elles sont dans la corbeille."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TITLE="Importer les corrections de traduction"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_DESC="Applique un fichier de corrections aux traductions, par exemple une réparation de tout le site, et enregistre chaque correction distincte une fois en tant que retour de traducteur pour le distillateur. Un champ qui a été modifié depuis la création du fichier est laissé tel quel, et exécuter à nouveau le fichier ne change rien. Les états de relecture des traductions restent inchangés."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_LABEL="Fichier de corrections"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_DESC="Le fichier JSON contenant les corrections, relatif à la racine du site, par exemple tmp/translations-corrections.json. Il doit se trouver à l'intérieur du site. Supprimer-le une fois l'import terminé."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TIME_BUDGET_DESC="La durée pendant laquelle une exécution peut continuer à enregistrer des traductions ; l'exécution suivante prend le relais. 0 signifie 25 secondes sur le web et 240 secondes en ligne de commande. Avec Web Cron appelé chaque minute, 50 est une bonne valeur."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_BUSY="Un autre import est encore en cours ; cette tâche prend le relais après celui-ci."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_APPLIED="%1$d traductions corrigées ; %2$d avaient déjà leurs corrections ; %3$d restent à faire."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_CHANGED="%1$d traductions ont été modifiées depuis la création du fichier et sont laissées telles quelles : %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_MISSING="%1$d traductions sont non trouvées : %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_LOCKED="%1$d traductions sont déverrouillées par un autre utilisateur et sont laissées telles quelles : %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FAILED="%1$d traductions n'ont pas pu être enregistrées. Dernière erreur : %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK="%d corrections enregistrées en tant que retour de traducteur."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK_NEXT="Toutes les traductions sont traitées ; la prochaine exécution enregistre les corrections en tant que retour de traducteur."
