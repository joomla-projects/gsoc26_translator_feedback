PLG_TASK_TRANSLATIONSDISTILLER="Tarefa - Destilador de traduções"
PLG_TASK_TRANSLATIONSDISTILLER_XML_DESCRIPTION="Executa o destilador de regras de Traduções sobre os comentários pendentes dos tradutores de forma agendada."
PLG_TASK_TRANSLATIONSDISTILLER_TITLE="Destilar regras de tradução"
PLG_TASK_TRANSLATIONSDISTILLER_DESC="Destila os comentários pendentes dos tradutores em regras de tradução provisórias. Cada execução envia pedidos até o seu tempo se esgotar; a execução seguinte continua a partir daí. Uma linha que falhe três vezes é posta de parte e não é enviada novamente."
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_LABEL="Correções por pedido"
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_DESC="O número máximo de linhas de comentários enviadas ao fornecedor num único pedido. Linhas longas, como artigos completos, são enviadas em menor número por pedido para que o pedido se mantenha num tamanho gerível. Um pedido que falhe é repetido com metade deste tamanho."
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_LABEL="Tempo por execução (segundos)"
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_DESC="Durante quanto tempo uma execução pode continuar a enviar pedidos; a execução pára antes de um pedido que provavelmente não terminaria a tempo, e a execução seguinte continua. 0 significa 25 segundos na web e 240 segundos na linha de comandos. Com o Web Cron a ser chamado todos os minutos, 110 é um bom valor quando o seu alojamento permite que um pedido web execute cerca de dois minutos. Mantenha o Tempo limite da tarefa nas opções de Tarefas agendadas bem acima disso, por exemplo 600."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_BUSY="Outra execução de destilação ainda está ocupada, por isso esta execução não fez nada; o feedback pendente é deixado para essa execução."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_NONE="Não há feedback pendente para destilar."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_PROCESSED="Destiladas regras provisórias a partir de %1$d linhas de feedback; %2$d ainda pendentes."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_FAILED="%1$d linhas de feedback não puderam ser destiladas; %2$d delas falharam pela terceira vez e foram postas de parte. Último erro: %3$s"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_TITLE="Repetir feedback de tradutor falhado"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_DESC="Dá às linhas de feedback que o destilador pôs de parte após três tentativas falhadas um novo conjunto de tentativas. Execute depois de corrigida a causa das falhas, como um modelo inválido ou um saldo de crédito vazio."
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_LOG="%d linhas de feedback falhadas estão novamente pendentes."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_TITLE="Fundir regras de tradução duplicadas"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_DESC="Funde regras de terminologia e preservação que tenham o mesmo termo e tradução. A regra mais antiga de cada conjunto é mantida, assume a evidência e a confiança mais alta das outras, e as outras são enviadas para a reciclagem."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_LABEL="Idioma"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_DESC="O idioma alvo cujas regras são fundidas."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_ALL_LANGUAGES="Todos os idiomas"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LOG="Fundidas e removidas %d regras duplicadas; estão na reciclagem."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TITLE="Importar correções de traduções"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_DESC="Aplica um ficheiro de correções a traduções, como uma reparação de todo o sítio, e regista cada correção distinta uma vez como feedback do tradutor para o distiller. Um campo que tenha sido editado após a criação do ficheiro é deixado intacto, e executar o ficheiro novamente não altera nada. Os estados de revisão das traduções mantêm-se como estão."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_LABEL="Ficheiro de correções"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_DESC="O ficheiro JSON com as correções, relativo à raiz do sítio, por exemplo tmp/translations-corrections.json. Tem de estar dentro do sítio. Remova-o assim que a importação estiver concluída."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TIME_BUDGET_DESC="Durante quanto tempo uma execução pode continuar a guardar traduções; a execução seguinte continua. 0 significa 25 segundos pela web e 240 segundos pela linha de comandos. Com o Web Cron chamado a cada minuto, 50 é um bom valor."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_BUSY="Outra importação ainda está ocupada; esta tarefa continua após essa."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_APPLIED="Corrigidas %1$d traduções; %2$d já mantinham as correções; %3$d ainda por fazer."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_CHANGED="%1$d traduções foram editadas após a criação do ficheiro e são deixadas intactas: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_MISSING="%1$d traduções não foram encontradas: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_LOCKED="%1$d traduções estão trancadas por outro utilizador e são deixadas intactas: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FAILED="%1$d traduções não puderam ser guardadas. Último erro: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK="Registadas %d correções como feedback do tradutor."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK_NEXT="Todas as traduções estão tratadas; a próxima execução regista as correções como feedback do tradutor."
