PLG_TASK_TRANSLATIONSDISTILLER="Aufgabe – Translations Distiller"
PLG_TASK_TRANSLATIONSDISTILLER_XML_DESCRIPTION="Führt den Translations-Regel-Distiller nach Zeitplan über ausstehende Übersetzer-Rückmeldungen aus."
PLG_TASK_TRANSLATIONSDISTILLER_TITLE="Übersetzungsregeln destillieren"
PLG_TASK_TRANSLATIONSDISTILLER_DESC="Destilliert die ausstehenden Übersetzer-Rückmeldungen zu Entwurfs-Übersetzungsregeln. Jeder Durchlauf sendet Anfragen, bis seine Zeit aufgebraucht ist; der nächste Durchlauf setzt dort fort. Eine Zeile, die dreimal fehlschlägt, wird zurückgestellt und nicht erneut gesendet."
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_LABEL="Korrekturen pro Anfrage"
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_DESC="Die maximale Anzahl an Rückmeldungszeilen, die in einer Anfrage an den Anbieter gesendet werden. Lange Zeilen, wie ganze Beiträge, werden in geringerer Anzahl pro Anfrage gesendet, damit eine Anfrage eine überschaubare Größe behält. Eine fehlgeschlagene Anfrage wird mit der halben Größe erneut versucht."
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_LABEL="Zeit pro Durchlauf (Sekunden)"
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_DESC="Wie lange ein Durchlauf weiter Anfragen senden darf; der Durchlauf stoppt vor einer Anfrage, die vermutlich nicht rechtzeitig fertig würde, und der nächste Durchlauf macht weiter. 0 bedeutet 25 Sekunden im Web und 240 Sekunden über die Befehlszeile. Bei Web-Cron, der jede Minute aufgerufen wird, ist 110 ein guter Wert, wenn das Hosting eine Webanfrage etwa zwei Minuten laufen lässt. Das Aufgaben-Timeout in den Optionen der geplanten Aufgaben sollte deutlich darüber liegen, zum Beispiel 600."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_BUSY="Ein anderer Destillierdurchlauf läuft noch, daher hat dieser Durchlauf nichts getan; das ausstehende Feedback bleibt diesem Durchlauf überlassen."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_NONE="Kein ausstehendes Feedback zum Destillieren."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_PROCESSED="Entwurfsregeln aus %1$d Feedback-Zeilen destilliert; %2$d stehen noch aus."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_FAILED="%1$d Feedback-Zeilen konnten nicht destilliert werden; %2$d davon sind zum dritten Mal fehlgeschlagen und wurden zurückgestellt. Letzter Fehler: %3$s"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_TITLE="Fehlgeschlagenes Übersetzer-Feedback erneut versuchen"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_DESC="Gibt den Feedback-Zeilen, die der Destillierer nach drei fehlgeschlagenen Versuchen zurückgestellt hat, einen neuen Satz an Versuchen. Ausführen, sobald die Ursache der Fehlschläge behoben ist, etwa ein ungültiges Modell oder ein leeres Guthaben."
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_LOG="%d fehlgeschlagene Feedback-Zeilen sind wieder ausstehend."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_TITLE="Doppelte Übersetzungsregeln zusammenführen"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_DESC="Führt Terminologie- und Erhaltungsregeln zusammen, die denselben Begriff und dieselbe Übersetzung haben. Die älteste Regel jeder Gruppe wird behalten, übernimmt die Belege und die höchste Zuversicht der anderen, und die anderen werden in den Papierkorb verschoben."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_LABEL="Sprache"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_DESC="Die Zielsprache, deren Regeln zusammengeführt werden."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_ALL_LANGUAGES="Alle Sprachen"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LOG="%d doppelte Regeln zusammengeführt; sie liegen im Papierkorb."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TITLE="Übersetzungskorrekturen importieren"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_DESC="Wendet eine Datei mit Korrekturen auf Übersetzungen an, etwa zur Reparatur der gesamten Website, und erfasst jede einzelne Korrektur einmal als Übersetzer-Feedback für den Distiller. Ein Feld, das seit der Erstellung der Datei bearbeitet wurde, bleibt unangetastet, und ein erneutes Ausführen der Datei ändert nichts mehr. Die Prüfstatus der Übersetzungen bleiben unverändert."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_LABEL="Korrekturdatei"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_DESC="Die JSON-Datei mit den Korrekturen, relativ zum Stammverzeichnis der Website, zum Beispiel tmp/translations-corrections.json. Sie muss sich innerhalb der Website befinden. Nach Abschluss des Imports entfernen."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TIME_BUDGET_DESC="Wie lange ein Durchlauf weiter Übersetzungen speichern darf; der nächste Durchlauf setzt fort. 0 bedeutet 25 Sekunden über das Web und 240 Sekunden von der Kommandozeile aus. Mit Web Cron, der jede Minute aufgerufen wird, ist 50 ein guter Wert."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_BUSY="Ein anderer Import läuft noch; diese Aufgabe setzt danach fort."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_APPLIED="%1$d Übersetzungen korrigiert; %2$d hatten die Korrekturen bereits; %3$d stehen noch aus."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_CHANGED="%1$d Übersetzungen wurden seit der Erstellung der Datei bearbeitet und bleiben unangetastet: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_MISSING="%1$d Übersetzungen wurden nicht gefunden: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_LOCKED="%1$d Übersetzungen sind von einem anderen Benutzer gesperrt und bleiben unangetastet: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FAILED="%1$d Übersetzungen konnten nicht gespeichert werden. Letzter Fehler: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK="%d Korrekturen wurden als Übersetzer-Feedback erfasst."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK_NEXT="Alle Übersetzungen sind bearbeitet; der nächste Durchlauf erfasst die Korrekturen als Übersetzer-Feedback."
