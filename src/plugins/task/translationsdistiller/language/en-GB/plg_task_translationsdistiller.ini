PLG_TASK_TRANSLATIONSDISTILLER="Task - Translations Distiller"
PLG_TASK_TRANSLATIONSDISTILLER_XML_DESCRIPTION="Runs the Translations rules distiller over pending translator feedback on a schedule."
PLG_TASK_TRANSLATIONSDISTILLER_TITLE="Distil Translation Rules"
PLG_TASK_TRANSLATIONSDISTILLER_DESC="Distils the pending translator feedback into draft translation rules. Each run sends requests until its time is used up; the next run carries on. A row that fails three times is set aside and not sent again."
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_LABEL="Corrections per Request"
PLG_TASK_TRANSLATIONSDISTILLER_REQUEST_SIZE_DESC="The most feedback rows sent to the provider in one request. Long rows, such as whole articles, go in fewer per request so a request stays a manageable size. A request that fails is retried at half this size."
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_LABEL="Time per Run (seconds)"
PLG_TASK_TRANSLATIONSDISTILLER_TIME_BUDGET_DESC="How long one run may keep sending requests; the run stops before a request that would probably not finish in time, and the next run carries on. 0 means 25 seconds over the web and 240 seconds from the command line. With Web Cron called every minute, 110 is a good value when your hosting lets a web request run about two minutes. Keep the Task Timeout in the Scheduled Tasks options well above it, for example 600."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_BUSY="Another distil run is still busy, so this run did nothing; the pending feedback is left to that run."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_NONE="No pending feedback to distil."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_PROCESSED="Distilled draft rules from %1$d feedback rows; %2$d still pending."
PLG_TASK_TRANSLATIONSDISTILLER_LOG_FAILED="%1$d feedback rows could not be distilled; %2$d of them failed for the third time and are set aside. Last error: %3$s"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_TITLE="Retry Failed Translator Feedback"
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_DESC="Gives the feedback rows that the distiller set aside after three failed attempts a new set of attempts. Run it once the cause of the failures is fixed, such as an invalid model or an empty credit balance."
PLG_TASK_TRANSLATIONSDISTILLER_RESETFAILED_LOG="%d failed feedback rows are pending again."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_TITLE="Merge Duplicate Translation Rules"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_DESC="Merges terminology and preservation rules that have the same term and translation. The oldest rule of each set is kept, takes over the evidence and the highest confidence of the others, and the others are trashed."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_LABEL="Language"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LANGUAGE_DESC="The target language whose rules are merged."
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_ALL_LANGUAGES="All languages"
PLG_TASK_TRANSLATIONSDISTILLER_MERGERULES_LOG="Merged away %d duplicate rules; they are in the trash."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TITLE="Import Translation Corrections"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_DESC="Applies a file of corrections to translations, such as a repair of the whole site, and records each distinct correction once as translator feedback for the distiller. A field that was edited since the file was made is left alone, and running the file again changes nothing. The review states of the translations stay as they are."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_LABEL="Corrections File"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_FILE_DESC="The JSON file with the corrections, relative to the site root, for example tmp/translations-corrections.json. It has to lie inside the site. Remove it once the import is done."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_TIME_BUDGET_DESC="How long one run may keep saving translations; the next run carries on. 0 means 25 seconds over the web and 240 seconds from the command line."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_BUSY="Another import is still busy, so this run did nothing."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_APPLIED="Corrected %1$d translations; %2$d held their corrections already; %3$d still to do."
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_CHANGED="%1$d translations were edited since the file was made and are left alone: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_MISSING="%1$d translations are not found: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_LOCKED="%1$d translations are checked out by another user and are left alone: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FAILED="%1$d translations could not be saved. Last error: %2$s"
PLG_TASK_TRANSLATIONSDISTILLER_IMPORTCORRECTIONS_LOG_FEEDBACK="Recorded %d corrections as translator feedback."
