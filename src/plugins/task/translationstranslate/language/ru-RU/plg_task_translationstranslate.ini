PLG_TASK_TRANSLATIONSTRANSLATE="Задача - Перевод переводов"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="Плагин для перевода элементов, ожидающих в очереди переводов, по расписанию."
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="Перевести элементы из очереди"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="Создаёт черновик перевода для каждого ожидающего элемента, готовый для проверки переводчиком. Каждый запуск переводит элементы до исчерпания пакета или времени; следующий запуск продолжает работу. Элемент, слишком длинный для перевода за один запрос, переводится по частям за столько запусков, сколько потребуется, при этом выполненные части сохраняются между запусками. Элемент, не переведённый после трёх неудачных попыток, откладывается в сторону и больше не отправляется."
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="Размер пакета"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="Максимальное количество элементов, переводимых за один запуск. Каждый элемент — это как минимум один запрос к поставщику перевода, а длинный элемент — несколько, поэтому большой пакет приводит к долгому выполнению."
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="Время на один запуск (в секундах)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="Сколько времени один запуск может отправлять запросы; запуск останавливается перед запросом, который, вероятно, не успеет завершиться вовремя, а следующий запуск продолжит работу. 0 означает 25 секунд через веб и 240 секунд из командной строки. При вызове Web Cron каждую минуту хорошим значением будет 110, если хостинг позволяет веб-запросу выполняться около двух минут. Держите значение тайм-аута задачи в настройках планировщика задач значительно выше этого, например 600."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="Другой процесс перевода всё ещё выполняется, поэтому этот запуск ничего не сделал; ожидающие элементы оставлены тому процессу."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="Нет элементов, ожидающих перевода."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="Переведено %d частей элементов, слишком длинных для перевода за один запрос; следующие запуски продолжат работу над остальным."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="Создано %1$d черновиков перевода; %2$d элементов всё ещё ожидают."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="Не удалось перевести %1$d элементов; %2$d из них не удались в третий раз и отложены. Последняя ошибка: %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="Повторить неудавшиеся переводы"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="Переводы, которые задача перевода отложила после трёх неудачных попыток, получают новый набор попыток. Запустите это, когда причина сбоев устранена, например исправлена некорректная модель или пополнен баланс."
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d неудавшихся переводов снова ожидают выполнения."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_TITLE="Привести более ранние переводы в соответствие с их источником"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_DESC="Для сайта, на котором переводы уже существовали до использования отзыва переводчика, сделанные вручную или с помощью другого инструмента. Перевод, сделанный с помощью отзыва переводчика, получает своё место в меню, главную страницу для своего языка, ссылки на страницы своего языка и модули меню при создании; это делает то же самое один раз для уже существующих переводов. Переводом считается любой элемент, связанный с элементом на исходном языке. Ничего не переводится заново, кроме заголовков скопированных модулей меню. Запустите один раз, после резервного копирования; повторный запуск изменит только то, что больше не соответствует источнику."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_LABEL="Порядок меню"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_DESC="Располагает переведённые пункты меню в порядке их источников среди соседних элементов или сортирует их по переведённому заголовку, если это требуется родителем источника. Перемещаются только элементы, находящиеся под переводом родителя их источника; порядок, заданный вручную в переведённом меню, будет потерян."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_LABEL="Главные страницы"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_DESC="Делает перевод главной страницы исходного языка главной страницей каждого языка, у которого она отсутствует, чтобы этот язык отображался в переключателе языков."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_LABEL="Параметры пункта меню"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_DESC="Указывает пункты меню, которые переведённые пункты меню называют в своих параметрах — цель алиаса, перенаправление при входе или выходе, избранные категории — на их переводы."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_LABEL="Перенаправления"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_DESC="Направляет переведённые пункты меню на перевод материала, категории или тега, которые они открывают, а внутренние ссылки в переведённых текстах — на страницы их собственного языка, если таковые существуют. При включённой настройке «Переведённые изображения» — также изображения в переведённых текстах на их переводы."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_LABEL="Модули меню"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_DESC="Даёт каждому переведённому меню копию каждого модуля меню его исходного меню на переводах страниц исходного модуля. Модуль меню, уже созданный для переведённого меню, на той же позиции и начинающийся с того же уровня, сохраняется и принимается за копию; в него добавляются недостающие страницы."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_ORDER="Порядок меню: %d переведённых меню расположено в порядке их источников."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_HOMES="Главные страницы: %d языков получили главную страницу."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_PARAMS="Параметры пункта меню: %d переведённых пунктов меню изменено."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_LINKS="Перенаправления: %d переведённых пунктов меню и текстов изменено."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_MODULES="Модули меню: %d скопировано."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_TITLE="Восстановить утерянные переводы"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DESC="Находит переводы, сделанные с помощью «Отзыва переводчика», которые больше не связаны со своим источником, и связывает их заново. Joomla записывает связи элемента из списка в его форме редактирования, поэтому сохранение формы, открытой до того, как был сделан перевод, исключает этот перевод из списка связей; в результате он остаётся самостоятельным и будет переведён повторно. Перевод находится по заголовку, с которым он был переведён, среди элементов своего языка, не имеющих связи; если несколько элементов имеют такой заголовок — по категории. Ровно одно совпадение связывается автоматически; об отсутствии совпадений или о нескольких совпадениях сообщается с указанием идентификаторов для выбора."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_LABEL="Пробный запуск"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_DESC="Только сообщать в логе задачи о том, что было бы связано. Отключите, чтобы выполнить связывание."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_ASSOCIATED="%1$s %2$d \"%3$s\" (%4$s): связано с %6$s, под названием \"%5$s\"."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DONE="%1$d переводов снова связано со своим источником, %2$d необходимо связать вручную."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DRY_RUN="[Пробный запуск]"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NEXT="Далее выполните задачу «Привести более ранние переводы в соответствие с их источником», чтобы пункты меню и ссылки указывали на заново связанные переводы."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NONE="%1$s %2$d \"%3$s\" (%4$s): ни один элемент без связи не имеет названия \"%5$s\"; свяжите его вручную."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_SEVERAL="%1$s %2$d \"%3$s\" (%4$s): несколько элементов без связи имеют название \"%5$s\" (идентификаторы %6$s); свяжите нужный вручную."
