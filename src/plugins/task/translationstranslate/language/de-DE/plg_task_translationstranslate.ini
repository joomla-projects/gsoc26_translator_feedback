PLG_TASK_TRANSLATIONSTRANSLATE="Aufgabe – Übersetzungen übersetzen"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="Übersetzt die in der Übersetzungswarteschlange wartenden Einträge nach einem Zeitplan."
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="Eingereihte Einträge übersetzen"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="Erstellt für jeden Eintrag, der darauf wartet, einen Übersetzungsentwurf, bereit zur Überprüfung durch einen Übersetzer. Jeder Lauf übersetzt Einträge, bis dessen Stapel oder Zeit aufgebraucht ist; der nächste Lauf setzt fort. Ein Eintrag, der zu lang ist, um in einer Anfrage übersetzt zu werden, wird in Teilen über so viele Läufe wie nötig übersetzt, und die bereits erledigten Teile werden dazwischen beibehalten. Ein Eintrag, der dreimal fehlschlägt, wird zurückgestellt und nicht erneut gesendet."
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="Stapelgröße"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="Die höchste Anzahl an Einträgen, die in einem Lauf übersetzt werden. Jeder davon ist mindestens eine Anfrage an den Übersetzungsanbieter, und ein langer Eintrag sind mehrere, daher führt ein großer Stapel zu einem langen Lauf."
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="Zeit pro Durchlauf (Sekunden)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="Wie lange ein Durchlauf weiter Anfragen senden darf; der Durchlauf stoppt vor einer Anfrage, die vermutlich nicht rechtzeitig fertig würde, und der nächste Durchlauf macht weiter. 0 bedeutet 25 Sekunden im Web und 240 Sekunden über die Befehlszeile. Bei Web-Cron, der jede Minute aufgerufen wird, ist 110 ein guter Wert, wenn das Hosting eine Webanfrage etwa zwei Minuten laufen lässt. Das Aufgaben-Timeout in den Optionen der geplanten Aufgaben sollte deutlich darüber liegen, zum Beispiel 600."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="Ein anderer Übersetzungslauf ist noch aktiv, daher hat dieser Lauf nichts getan; die wartenden Einträge werden diesem Lauf überlassen."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="Nichts wartet auf eine Übersetzung."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="%d Teile von Einträgen wurden übersetzt, die zu lang waren, um in einer Anfrage übersetzt zu werden; die nächsten Läufe setzen mit dem Rest fort."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="%1$d Übersetzungsentwürfe wurden erstellt; %2$d Einträge warten noch."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="%1$d Einträge konnten nicht übersetzt werden; %2$d davon sind zum dritten Mal fehlgeschlagen und wurden zurückgestellt. Letzter Fehler: %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="Fehlgeschlagene Übersetzungen erneut versuchen"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="Gibt Übersetzungen, die die Übersetzungsaufgabe nach drei fehlgeschlagenen Versuchen zurückgestellt hat, eine neue Reihe von Versuchen. Ausführen, sobald die Ursache der Fehlschläge behoben ist, etwa ein ungültiges Modell oder ein leeres Guthaben."
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d fehlgeschlagene Übersetzungen stehen wieder aus."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_TITLE="Frühere Übersetzungen mit ihrer Quelle in Einklang bringen"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_DESC="Für eine Website, die bereits Übersetzungen hatte, bevor Übersetzer-Feedback verwendet wurde, erstellt von Hand oder mit einem anderen Werkzeug. Eine von Übersetzer-Feedback erstellte Übersetzung erhält bei ihrer Erstellung ihren Platz im Menü, eine Startseite für ihre Sprache sowie Links zu den Seiten ihrer eigenen Sprache und Menümodulen; dies erledigt dasselbe einmalig für die Übersetzungen, die bereits vorhanden sind. Eine Übersetzung ist jeder Eintrag, der einem Eintrag in der Quellsprache zugeordnet ist. Nichts wird erneut übersetzt, außer den Titeln kopierter Menümodule. Einmal nach einer Sicherung ausführen; ein erneutes Ausführen ändert nur das, was nicht mehr in Einklang ist."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_LABEL="Menüreihenfolge"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_DESC="Bringt übersetzte Menüeinträge in die Reihenfolge ihres Quellelements unter ihren Geschwisterelementen oder sortiert sie nach übersetztem Titel, wenn das übergeordnete Element der Quelle dies verlangt. Es werden nur Einträge unter der Übersetzung des übergeordneten Elements ihrer Quelle verschoben; eine von Hand vorgenommene Reihenfolge in einem übersetzten Menü geht verloren."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_LABEL="Startseiten"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_DESC="Macht die Übersetzung der Startseite der Ausgangssprache zur Startseite jeder Sprache, die noch keine hat, sodass die Sprache im Sprachumschalter erscheint."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_LABEL="Menüeinträge – Einstellungen"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_DESC="Richtet die Menüeinträge, die übersetzte Menüeinträge in ihren Einstellungen benennen – das Ziel eines Alias, eine Weiterleitung beim Anmelden oder Abmelden, Hauptkategorien – auf deren Übersetzungen aus."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_LABEL="Links"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_DESC="Richtet übersetzte Menüeinträge auf die Übersetzung des Beitrags, der Kategorie oder des Schlagworts aus, die sie öffnen, sowie interne Links in übersetzten Texten auf die Seiten ihrer eigenen Sprache, sofern diese vorhanden sind. Bei aktivierter Option „Übersetzte Bilder“ auch die Bilder in übersetzten Texten auf ihre Übersetzungen."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_LABEL="Menümodule"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_DESC="Gibt jedem übersetzten Menü eine Kopie jedes Menümoduls seines Quellmenüs, auf den Übersetzungen der Seiten des Quellmoduls. Ein für das übersetzte Menü bereits erstelltes Menümodul an derselben Position und mit demselben Startniveau wird beibehalten und als die Kopie übernommen; es erhält die ihm fehlenden Seiten."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_ORDER="Menüreihenfolge: %d übersetzte Menüs wurden in die Reihenfolge ihrer Quelle gebracht."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_HOMES="Startseiten: %d Sprachen haben eine Startseite erhalten."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_PARAMS="Menüeinträge – Einstellungen: %d übersetzte Menüeinträge wurden geändert."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_LINKS="Links: %d übersetzte Menüeinträge und Texte wurden geändert."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_MODULES="Menümodule: %d wurden kopiert."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_TITLE="Verlorene Übersetzungen wiederherstellen"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DESC="Findet die mit Translator Feedback erstellten Übersetzungen, die nicht mehr mit ihrer Quelle verknüpft sind, und verknüpft sie erneut. Joomla schreibt die Verknüpfungen eines Eintrags aus der Liste in dessen Bearbeitungsformular; wird also ein Formular gespeichert, das geöffnet wurde, bevor eine Übersetzung erstellt wurde, bleibt diese Übersetzung unberücksichtigt; sie steht dann für sich allein und würde ein zweites Mal übersetzt werden. Eine Übersetzung wird anhand des Titels gefunden, mit dem sie übersetzt wurde, unter den Einträgen ihrer Sprache, die keine Verknüpfung haben; haben mehrere diesen Titel, anhand ihrer Kategorie. Genau eine Übereinstimmung wird verknüpft; keine oder mehrere werden gemeldet, mit den IDs zur Auswahl."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_LABEL="Testlauf"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_DESC="Nur im Aufgabenprotokoll melden, was verknüpft würde. Zum Verknüpfen ausschalten."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_ASSOCIATED="%1$s %2$d \"%3$s\" (%4$s): verknüpft mit %6$s, mit Titel \"%5$s\"."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DONE="%1$d Übersetzungen wieder mit ihrer Quelle verknüpft, %2$d manuell zu verknüpfen."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DRY_RUN="[Testlauf]"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NEXT="Als Nächstes \"Frühere Übersetzungen mit ihrer Quelle abgleichen\" ausführen, damit Menüeinträge und Links auf die erneut verknüpften Übersetzungen zeigen."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NONE="%1$s %2$d \"%3$s\" (%4$s): kein Eintrag ohne Verknüpfung trägt den Titel \"%5$s\"; manuell verknüpfen."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_SEVERAL="%1$s %2$d \"%3$s\" (%4$s): mehrere Einträge ohne Verknüpfung tragen den Titel \"%5$s\" (IDs %6$s); den richtigen manuell verknüpfen."
