PLG_TASK_TRANSLATIONSTRANSLATE="وظیفه - ترجمه ترجمه ها"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="آیتم های در انتظار در صف ترجمه ها را طبق برنامه زمانی ترجمه می کند."
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="ترجمه آیتم های صف شده"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="برای هر آیتمی که منتظر آن است یک پیش نویس ترجمه ایجاد می کند، آماده برای بررسی توسط یک مترجم. هر اجرا آیتم ها را تا زمانی که دسته یا زمانش تمام شود ترجمه می کند؛ اجرای بعدی ادامه می دهد. آیتمی که برای ترجمه در یک درخواست خیلی طولانی باشد در بخش هایی طی هر چند اجرا که لازم باشد ترجمه می شود، و بخش های انجام شده در این بین نگه داشته می شوند. آیتمی که سه بار شکست بخورد کنار گذاشته می شود و دیگر ارسال نمی شود."
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="اندازه دسته"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="بیشترین تعداد آیتم های ترجمه شده در یک اجرا. هر کدام حداقل یک درخواست به ارائه دهنده ترجمه است، و یک آیتم طولانی چندین درخواست است، بنابراین یک دسته بزرگ باعث یک اجرای طولانی می شود."
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="زمان هر اجرا (ثانیه)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="مدت زمانی که یک اجرا می تواند درخواست ارسال کند؛ اجرا پیش از درخواستی که احتمالاً به موقع تمام نمی شود متوقف می شود و اجرای بعدی آن را ادامه می دهد. 0 به معنای 25 ثانیه در وب و 240 ثانیه از خط فرمان است. با فراخوانی Web Cron هر دقیقه، 110 مقدار مناسبی است وقتی میزبانی شما اجازه می دهد یک درخواست وب حدود دو دقیقه اجرا شود. مهلت زمانی وظیفه را در گزینه های وظایف زمان بندی شده بسیار بالاتر از آن نگه دارید، مثلاً 600."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="اجرای دیگری از ترجمه هنوز مشغول است، بنابراین این اجرا کاری انجام نداد؛ آیتم های در انتظار به آن اجرا واگذار می شوند."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="چیزی منتظر ترجمه نیست."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="%d بخش از آیتم هایی که برای ترجمه در یک درخواست خیلی طولانی بودند ترجمه شد؛ اجراهای بعدی با بقیه ادامه می دهند."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="%1$d پیش نویس ترجمه ایجاد شد؛ %2$d آیتم هنوز در انتظار است."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="%1$d آیتم قابل ترجمه نبود; %2$d مورد از آنها برای بار سوم با شکست مواجه شد و کنار گذاشته شدند. آخرین خطا: %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="تلاش مجدد برای ترجمه های ناموفق"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="ترجمه هایی که وظیفه ترجمه پس از سه تلاش ناموفق کنار گذاشته است را مجموعه تلاش های جدیدی می دهد. آن را زمانی اجرا کنید که علت شکست ها، مانند یک مدل نامعتبر یا موجودی اعتبار خالی، برطرف شده باشد."
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d ترجمه ناموفق دوباره در انتظار هستند."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_TITLE="هماهنگ کردن ترجمه های قبلی با منبع آن ها"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_DESC="برای سایتی که پیش از استفاده از بازخورد مترجم، ترجمه هایی داشته است، چه به صورت دستی و چه با ابزاری دیگر. ترجمه ای که با بازخورد مترجم ساخته می شود، جای خود را در منو، یک صفحه خانه برای زبان خود، پیوندهایی به صفحات زبان خودش و ماژول های منو هنگام ساخته شدن دریافت می کند؛ این کار همین کار را یک بار برای ترجمه هایی که از قبل وجود دارند انجام می دهد. یک ترجمه هر آیتمی است که با آیتمی در زبان مبدأ مرتبط باشد. چیزی دوباره ترجمه نمی شود، به جز عناوین ماژول های منوی کپی شده. آن را یک بار، پس از پشتیبان گیری اجرا کنید؛ اجرای دوباره آن فقط چیزهایی را تغییر می دهد که دیگر هماهنگ نیستند."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_LABEL="ترتیب منو"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_DESC="آیتم های منوی ترجمه شده را به ترتیب منبع آن ها در میان همتایانشان قرار می دهد، یا در صورتی که مادر منبع آن را درخواست کرده باشد، بر اساس عنوان ترجمه شده مرتب می کند. فقط آیتم های زیر مجموعه ترجمه مادر منبعشان جابجا می شوند؛ ترتیبی که به صورت دستی در یک منوی ترجمه شده ایجاد شده باشد از بین می رود."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_LABEL="صفحات خانه"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_DESC="ترجمه صفحه خانه زبان منبع را صفحه خانه هر زبانی که صفحه خانه ندارد می سازد، تا آن زبان در تعویض کننده زبان نمایش داده شود."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_LABEL="تنظیمات آیتم منو"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_DESC="آیتم های منویی که آیتم های منوی ترجمه شده را در تنظیمات خود نام می برند - مقصد یک نام مستعار، تغییر مسیر ورود یا خروج، مجموعه های ویژه - را به سمت ترجمه های آن ها هدایت می کند."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_LABEL="پیوندها"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_DESC="آیتم های منوی ترجمه شده را به ترجمه مطلب، مجموعه یا برچسبی که باز می کنند هدایت می کند، و پیوندهای داخلی در متون ترجمه شده را به صفحات زبان خودشان، در جایی که وجود دارند. با فعال بودن گزینه تصاویر ترجمه شده، همچنین تصاویر در متون ترجمه شده را به ترجمه هایشان هدایت می کند."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_LABEL="ماژول های منو"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_DESC="به هر منوی ترجمه شده یک کپی از هر ماژول منوی منوی منبع خود می دهد، روی ترجمه های صفحات ماژول منبع. ماژول منویی که از قبل برای منوی ترجمه شده ساخته شده، در همان موقعیت و شروع از همان سطح، نگه داشته می شود و به عنوان کپی در نظر گرفته می شود؛ صفحاتی که کم دارد به آن اضافه می شود."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_ORDER="ترتیب منو: %d منوی ترجمه شده به ترتیب منبع خود قرار گرفتند."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_HOMES="صفحات خانه: %d زبان صفحه خانه دریافت کردند."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_PARAMS="تنظیمات آیتم منو: %d آیتم منوی ترجمه شده تغییر کردند."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_LINKS="پیوندها: %d آیتم منو و متن ترجمه شده تغییر کردند."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_MODULES="ماژول های منو: %d کپی شدند."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_TITLE="بازیابی ترجمه های از دست رفته"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DESC="ترجمه های انجام شده توسط بازخورد مترجم را که دیگر با منبع خود پیوسته نیستند پیدا می کند و دوباره آنها را پیوست می دهد. جوملا پیوستگی های یک آیتم را از لیست موجود در فرم ویرایش آن می نویسد، بنابراین ذخیره فرمی که قبل از انجام یک ترجمه باز شده بود، آن ترجمه را نادیده می گذارد؛ در این صورت آن ترجمه به تنهایی باقی می ماند و برای بار دوم ترجمه خواهد شد. یک ترجمه با عنوانی که با آن ترجمه شده، در میان آیتم های زبان خودش که پیوستگی ندارند پیدا می شود؛ در جایی که چند مورد آن عنوان را دارند، بر اساس مجموعه آن. دقیقاً یک مطابقت پیوست داده می شود؛ هیچکدام یا چند مورد گزارش می شوند، همراه با شناسه هایی برای انتخاب."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_LABEL="اجرای آزمایشی"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_DESC="فقط در وقایع وظیفه گزارش دهید که چه چیزی پیوست خواهد شد. برای پیوست دادن خاموش کنید."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_ASSOCIATED="%1$s %2$d \"%3$s\" (%4$s): پیوست شد با %6$s، با عنوان \"%5$s\"."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DONE="%1$d ترجمه دوباره با منبع خود پیوست شدند، %2$d مورد باید دستی پیوست شوند."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DRY_RUN="[اجرای آزمایشی]"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NEXT="سپس \"هماهنگ کردن ترجمه های قبلی با منبع آنها\" را اجرا کنید، تا آیتم های منو و پیوندها دوباره به ترجمه های پیوست شده اشاره کنند."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NONE="%1$s %2$d \"%3$s\" (%4$s): هیچ آیتمی بدون پیوستگی با عنوان \"%5$s\" وجود ندارد؛ آن را به صورت دستی پیوست دهید."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_SEVERAL="%1$s %2$d \"%3$s\" (%4$s): چند آیتم بدون پیوستگی با عنوان \"%5$s\" (شناسه های %6$s) وجود دارند؛ مورد درست را به صورت دستی پیوست دهید."
