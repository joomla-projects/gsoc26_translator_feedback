PLG_TASK_TRANSLATIONSTRANSLATE="Tarefa — Traduções. Traduzir"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="Traduz os itens em espera na fila de traduções de acordo com um horário."
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="Traduzir itens em fila"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="Cria um rascunho de tradução para cada item que esteja à espera de um, pronto para um tradutor rever. Cada execução traduz itens até o seu lote ou o seu tempo se esgotar; a próxima execução continua. Um item demasiado longo para traduzir num único pedido é traduzido em partes ao longo de tantas execuções quantas forem necessárias, e as partes concluídas são mantidas entretanto. Um item que falhe três vezes é posto de parte e não é enviado novamente."
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="Tamanho do lote"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="O número máximo de itens traduzidos numa execução. Cada um corresponde a, pelo menos, um pedido ao fornecedor de tradução, e um item longo corresponde a vários, pelo que um lote grande torna a execução demorada."
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="Tempo por execução (segundos)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="Durante quanto tempo uma execução pode continuar a enviar pedidos; a execução pára antes de um pedido que provavelmente não terminaria a tempo, e a execução seguinte continua. 0 significa 25 segundos na web e 240 segundos na linha de comandos. Com o Web Cron a ser chamado todos os minutos, 110 é um bom valor quando o seu alojamento permite que um pedido web execute cerca de dois minutos. Mantenha o Tempo limite da tarefa nas opções de Tarefas agendadas bem acima disso, por exemplo 600."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="Outra execução de tradução ainda está ocupada, pelo que esta execução não fez nada; os itens em espera ficam para essa execução."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="Não há nada à espera de tradução."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="Foram traduzidas %d partes de itens demasiado longos para traduzir num único pedido; as próximas execuções continuam com o restante."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="Foram criados %1$d rascunhos de tradução; %2$d itens ainda em espera."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="%1$d itens não puderam ser traduzidos; %2$d deles falharam pela terceira vez e foram postos de parte. Último erro: %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="Repetir traduções falhadas"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="Dá às traduções que a tarefa de tradução pôs de parte após três tentativas falhadas um novo conjunto de tentativas. Execute-a assim que a causa das falhas for corrigida, como um modelo inválido ou um saldo de crédito vazio."
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d traduções falhadas estão novamente pendentes."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_TITLE="Alinhar traduções anteriores com a respetiva origem"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_DESC="Para um sítio que já tinha traduções antes de o Feedback do tradutor ser utilizado, feitas à mão ou com outra ferramenta. Uma tradução feita pelo Feedback do tradutor obtém o seu lugar no menu, uma página inicial para o seu idioma, hiperligações para as páginas do seu próprio idioma e módulos de menu quando é criada; isto faz o mesmo, uma vez, para as traduções que já existem. Uma tradução é qualquer item associado a um item no idioma de origem. Nada é traduzido novamente, exceto os nomes dos módulos de menu copiados. Execute-o uma vez, depois de uma cópia de segurança; executá-lo novamente altera apenas o que já não está alinhado."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_LABEL="Ordem de menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_DESC="Coloca os itens de menu traduzidos na ordem dos seus de origem entre os seus irmãos, ou ordenados pelo título traduzido quando o hospedeiro de origem assim o pedir. Apenas os itens sob a tradução do hospedeiro de origem são movidos; uma ordem feita manualmente num menu traduzido é perdida."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_LABEL="Páginas de entrada"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_DESC="Faz com que a tradução da página de entrada do idioma de origem se torne a página de entrada de cada idioma que não tenha nenhuma, para que o idioma apareça no seletor de idiomas."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_LABEL="Configurações dos itens de menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_DESC="Aponta os itens de menu que os itens de menu traduzidos indicam nas suas configurações — o alvo de um nome alternativo, um reencaminhamento de autenticação ou saída, categorias em destaque — para as suas traduções."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_LABEL="Hiperligações"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_DESC="Aponta os itens de menu traduzidos para a tradução do artigo, categoria ou etiqueta que abrem, e as hiperligações internas em textos traduzidos para as páginas do seu próprio idioma, onde estas existam. Com a opção Imagens traduzidas ativada, também as imagens em textos traduzidos para as suas traduções."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_LABEL="Módulos de menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_DESC="Dá a cada menu traduzido uma cópia de cada módulo de menu do seu menu de origem, nas traduções das páginas do módulo de origem. Um módulo de menu já criado para o menu traduzido, na mesma função e a começar no mesmo nível, é mantido e considerado como a cópia; recebe as páginas que lhe faltam."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_ORDER="Ordem de menu: %d menus traduzidos colocados na ordem dos seus de origem."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_HOMES="Páginas de entrada: %d idiomas obtiveram uma página de entrada."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_PARAMS="Configurações dos itens de menu: %d itens de menu traduzidos alterados."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_LINKS="Hiperligações: %d itens de menu e textos traduzidos alterados."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_MODULES="Módulos de menu: %d copiados."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_TITLE="Restaurar traduções perdidas"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DESC="Encontra as traduções feitas pelo Feedback do tradutor que já não estão associadas à sua origem, e associa-as novamente. O Joomla grava as associações de um item a partir da lista no seu formulário de edição, pelo que guardar um formulário aberto antes de uma tradução ter sido feita deixa essa tradução de fora; esta fica então isolada e seria traduzida uma segunda vez. Uma tradução é encontrada pelo nome com que foi traduzida, entre os itens do seu idioma que não têm associação; onde vários tenham esse nome, pela sua categoria. Exatamente uma correspondência é associada; nenhuma ou várias são comunicadas, com os ID a escolher."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_LABEL="Simulação"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_DESC="Apenas comunicar no historial de tarefas o que seria associado. Desligar para associar."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_ASSOCIATED="%1$s %2$d \"%3$s\" (%4$s): associado com %6$s, intitulado \"%5$s\"."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DONE="%1$d traduções associadas novamente com a sua origem, %2$d a associar manualmente."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DRY_RUN="[Simulação]"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NEXT="Executar a seguir \"Atualizar traduções anteriores de acordo com a sua origem\", para que os itens de menu e as hiperligações apontem para as traduções associadas novamente."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NONE="%1$s %2$d \"%3$s\" (%4$s): nenhum item sem associação se intitula \"%5$s\"; associe-o manualmente."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_SEVERAL="%1$s %2$d \"%3$s\" (%4$s): vários itens sem associação intitulam-se \"%5$s\" (ids %6$s); associe o correto manualmente."
