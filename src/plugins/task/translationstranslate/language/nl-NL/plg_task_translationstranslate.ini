PLG_TASK_TRANSLATIONSTRANSLATE="Taak - Vertalingen Vertalen"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="Vertaalt de items die in de wachtrij van Vertalingen staan volgens een schema."
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="Items in de Wachtrij Vertalen"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="Maakt een vertaalconcept aan voor elk item dat daarop wacht, klaar voor een vertaler om te herzien. Elke run vertaalt items totdat de batch of de tijd op is; de volgende run gaat verder. Een item dat te lang is om in één verzoek te vertalen, wordt in delen vertaald over zoveel runs als nodig is, en de voltooide delen worden ondertussen bewaard. Een item dat drie keer mislukt, wordt apart gezet en niet opnieuw verzonden."
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="Batchgrootte"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="Het maximum aantal items dat in één run vertaald wordt. Elk item is minstens één verzoek aan de vertaalprovider, en een lang item is er meerdere, dus een grote batch maakt een lange run."
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="Tijd per Keer (seconden)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="Hoe lang één keer uitvoeren verzoeken mag blijven versturen; de uitvoering stopt voordat een verzoek start dat waarschijnlijk niet op tijd klaar zou zijn, en de volgende keer gaat verder. 0 betekent 25 seconden via het web en 240 seconden vanaf de opdrachtregel. Bij Web Cron die elke minuut wordt aangeroepen, is 110 een goede waarde als uw hosting een webverzoek ongeveer twee minuten laat lopen. Houd de Taak Timeout in de opties van Geplande Taken ruim daarboven, bijvoorbeeld 600."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="Een andere vertaal-run is nog bezig, dus deze run heeft niets gedaan; de wachtende items worden aan die run overgelaten."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="Er staat niets te wachten op een vertaling."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="%d delen van items die te lang waren om in één verzoek te vertalen, zijn vertaald; de volgende runs gaan verder met de rest."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="%1$d vertaalconcepten aangemaakt; %2$d items staan nog in wachtrij."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="%1$d items konden niet vertaald worden; %2$d daarvan zijn voor de derde keer mislukt en apart gezet. Laatste fout: %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="Mislukte Vertalingen Opnieuw Proberen"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="Geeft de vertalingen die de vertaaltaak na drie mislukte pogingen apart heeft gezet een nieuwe reeks pogingen. Voer dit uit zodra de oorzaak van de mislukkingen is opgelost, zoals een ongeldig model of een leeg tegoed."
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d mislukte vertalingen staan opnieuw in wachtrij."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_TITLE="Breng eerdere vertalingen in lijn met hun bron"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_DESC="Voor een website die al vertalingen had voordat Vertalersfeedback werd gebruikt, handmatig gemaakt of met een ander hulpmiddel. Een vertaling die door Vertalersfeedback is gemaakt, krijgt zijn plaats in het menu, een startpagina voor zijn taal, links naar de pagina's van zijn eigen taal en menumodules wanneer deze wordt gemaakt; dit doet hetzelfde eenmalig voor de vertalingen die al aanwezig zijn. Een vertaling is elk item dat is gekoppeld aan een item in de brontaal. Er wordt niets opnieuw vertaald, behalve de titels van gekopieerde menumodules. Voer dit eenmalig uit, na een back-up; het opnieuw uitvoeren wijzigt alleen wat niet meer in lijn is."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_LABEL="Menuvolgorde"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_DESC="Zet vertaalde menu-items in de volgorde van hun bron tussen hun broers, of gesorteerd op vertaalde titel wanneer de hoofdcategorie van de bron dat vraagt. Alleen items onder de vertaling van de hoofdcategorie van hun bron worden verplaatst; een handmatig gemaakte volgorde in een vertaald menu gaat verloren."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_LABEL="Startpagina's"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_DESC="Maakt de vertaling van de startpagina van de brontaal de startpagina van elke taal die er geen heeft, zodat de taal in de taalselectie getoond wordt."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_LABEL="Menu-iteminstellingen"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_DESC="Wijst de menu-items die vertaalde menu-items in hun instellingen noemen - het doel van een alias, een inloggen- of uitloggenverwijzing, speciale categorieën - naar hun vertalingen."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_LABEL="Links"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_DESC="Richt vertaalde menu-items naar de vertaling van het artikel, de categorie of de tag die ze openen, en de interne links in vertaalde teksten naar de pagina's van hun eigen taal, waar die bestaan. Met de optie Vertaalde afbeeldingen ingeschakeld, ook de afbeeldingen in vertaalde teksten naar hun vertalingen."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_LABEL="Menumodules"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_DESC="Geeft elk vertaald menu een kopie van elke menumodule van zijn bronmenu, op de vertalingen van de pagina's van de bronmodule. Een menumodule die al gemaakt is voor het vertaalde menu, op dezelfde positie en vanaf hetzelfde niveau beginnend, wordt behouden en als de kopie genomen; deze krijgt de pagina's die hij mist."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_ORDER="Menuvolgorde: %d vertaalde menu's in de volgorde van hun bron gezet."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_HOMES="Startpagina's: %d talen kregen een startpagina."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_PARAMS="Menu-iteminstellingen: %d vertaalde menu-items gewijzigd."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_LINKS="Links: %d vertaalde menu-items en teksten gewijzigd."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_MODULES="Menumodules: %d gekopieerd."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_TITLE="Verloren Vertalingen Herstellen"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DESC="Vindt de vertalingen gemaakt door Vertalerfeedback die niet meer gekoppeld zijn aan hun bron, en koppelt ze opnieuw. Joomla schrijft de associaties van een item vanuit de lijst in het bewerkingsformulier, dus het opslaan van een formulier dat geopend was voordat een vertaling werd gemaakt, laat die vertaling buiten beschouwing; deze staat dan op zichzelf en zou een tweede keer vertaald worden. Een vertaling wordt gevonden aan de hand van de titel waarmee deze vertaald is, tussen de items van haar taal die geen koppeling hebben; waar meerdere die titel hebben, aan de hand van de categorie. Exact één overeenkomst wordt gekoppeld; geen of meerdere worden gerapporteerd, met de ids om uit te kiezen."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_LABEL="Proefdraai"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_DESC="Alleen in het taaklog rapporteren wat gekoppeld zou worden. Schakel uit om te koppelen."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_ASSOCIATED="%1$s %2$d \"%3$s\" (%4$s): gekoppeld aan %6$s, getiteld \"%5$s\"."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DONE="%1$d vertalingen opnieuw gekoppeld aan hun bron, %2$d handmatig te koppelen."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DRY_RUN="[Proefdraai]"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NEXT="Voer vervolgens \"Eerdere Vertalingen in Lijn Brengen met hun Bron\" uit, zodat menu-items en links naar de opnieuw gekoppelde vertalingen wijzen."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NONE="%1$s %2$d \"%3$s\" (%4$s): geen item zonder koppeling is getiteld \"%5$s\"; koppel het handmatig."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_SEVERAL="%1$s %2$d \"%3$s\" (%4$s): meerdere items zonder koppeling zijn getiteld \"%5$s\" (ids %6$s); koppel de juiste handmatig."
