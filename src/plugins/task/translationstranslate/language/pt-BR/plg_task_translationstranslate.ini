PLG_TASK_TRANSLATIONSTRANSLATE="Tarefa - Tradução de traduções"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="Traduz os itens aguardando na fila de Traduções em uma agenda."
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="Traduzir itens em fila"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="Cria um rascunho de tradução para cada item que está aguardando um, pronto para um tradutor revisar. Cada execução traduz itens até que seu lote ou seu tempo se esgote; a próxima execução continua. Um item longo demais para ser traduzido em uma única requisição é traduzido em partes ao longo de quantas execuções forem necessárias, e as partes concluídas são mantidas entre elas. Um item que falha três vezes é colocado de lado e não é enviado novamente."
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="Tamanho do lote"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="A maior quantidade de itens traduzidos em uma execução. Cada um é pelo menos uma requisição ao provedor de tradução, e um item longo é várias, então um lote grande torna a execução longa."
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="Tempo por Execução (segundos)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="Por quanto tempo uma execução pode continuar enviando requisições; a execução para antes de uma requisição que provavelmente não terminaria a tempo, e a próxima execução continua. 0 significa 25 segundos pela web e 240 segundos pela linha de comando. Com o Web Cron chamado a cada minuto, 110 é um bom valor quando sua hospedagem permite que uma requisição web seja executada por cerca de dois minutos. Mantenha o Tempo Limite da Tarefa nas opções de tarefas agendadas bem acima disso, por exemplo 600."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="Outra execução de tradução ainda está ocupada, então esta execução não fez nada; os itens em espera ficam para aquela execução."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="Nada está aguardando uma tradução."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="Traduzidas %d partes de itens longos demais para traduzir em uma única requisição; as próximas execuções continuam com o restante."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="Criados %1$d rascunhos de tradução; %2$d itens ainda aguardando."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="%1$d itens não puderam ser traduzidos; %2$d deles falharam pela terceira vez e foram colocados de lado. Último erro: %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="Tentar novamente traduções com falha"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="Dá às traduções que a tarefa de tradução colocou de lado após três tentativas sem sucesso um novo conjunto de tentativas. Execute-a assim que a causa das falhas for corrigida, como um modelo inválido ou um saldo de créditos vazio."
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d traduções com falha estão pendentes novamente."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_TITLE="Alinhar traduções anteriores com sua fonte"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_DESC="Para um site que já tinha traduções antes de o Feedback do tradutor ser usado, feitas manualmente ou com outra ferramenta. Uma tradução feita pelo Feedback do tradutor ganha seu lugar no menu, uma página inicial para seu idioma, ligações ('links') para as páginas de seu próprio idioma e módulos de menu quando é criada; isso faz o mesmo uma vez para as traduções que já existem. Uma tradução é qualquer item associado a um item no idioma de origem. Nada é traduzido novamente, exceto os títulos dos módulos de menu copiados. Execute uma vez, depois de um backup; executar novamente altera apenas o que não está mais alinhado."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_LABEL="Ordem do menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_DESC="Coloca os itens de menu traduzidos na ordem de sua fonte entre seus irmãos, ou ordenados pelo título traduzido onde o superior da fonte solicitar isso. Somente os itens sob a tradução do superior de sua fonte são movidos; uma ordem feita manualmente em um menu traduzido é perdida."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_LABEL="Páginas iniciais"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_DESC="Torna a tradução da página inicial do idioma de origem a página inicial de cada idioma que não tenha nenhuma, para que o idioma apareça no alternador de idiomas."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_LABEL="Configurações do item de menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_DESC="Aponta os itens de menu que nomeiam itens de menu traduzidos em suas configurações - o alvo de um pseudônimo ('alias'), um redirecionamento de acesso ou desconexão, categorias em destaque - para suas traduções."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_LABEL="Links"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_DESC="Direciona os itens de menu traduzidos para a tradução do artigo, categoria ou marcador ('tag') que eles abrem, e as ligações ('links') internas nos textos traduzidos para as páginas de seu próprio idioma, onde elas existirem. Com a opção Imagens Traduzidas ativada, também as imagens nos textos traduzidos para suas traduções."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_LABEL="Módulos de menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_DESC="Dá a cada menu traduzido uma cópia de cada módulo de menu de seu menu de origem, nas traduções das páginas do módulo de origem. Um módulo de menu já feito para o menu traduzido, na mesma posição e começando no mesmo nível, é mantido e considerado como a cópia; ele recebe as páginas que lhe faltam."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_ORDER="Ordem do menu: %d menus traduzidos colocados na ordem de sua fonte."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_HOMES="Páginas iniciais: %d idiomas receberam uma página inicial."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_PARAMS="Configurações do item de menu: %d itens de menu traduzidos alterados."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_LINKS="Links: %d itens de menu e textos traduzidos alterados."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_MODULES="Módulos de menu: %d copiados."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_TITLE="Restaurar traduções perdidas"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DESC="Encontra as traduções feitas pelo Feedback do Tradutor que não estão mais associadas à sua fonte, e as associa novamente. O Joomla grava as associações de um item a partir da lista em seu formulário de edição, então salvar um formulário aberto antes de uma tradução ter sido feita deixa essa tradução de fora; ela passa então a existir isoladamente e seria traduzida uma segunda vez. Uma tradução é encontrada pelo título com que foi traduzida, entre os itens de seu idioma que não têm associação; onde vários tiverem esse título, pela sua categoria. Exatamente uma correspondência é associada; nenhuma ou várias são informadas, com os IDs para escolher."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_LABEL="Execução de teste"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_DESC="Somente informar no log da tarefa o que seria associado. Desative para associar."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_ASSOCIATED="%1$s %2$d \"%3$s\" (%4$s): associado com %6$s, intitulado \"%5$s\"."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DONE="%1$d traduções associadas novamente com sua fonte, %2$d para associar manualmente."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DRY_RUN="[Execução de teste]"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NEXT="Execute em seguida \"Atualizar Traduções Anteriores de Acordo com a Fonte\", para que os itens de menu e ligações ('links') apontem para as traduções associadas novamente."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NONE="%1$s %2$d \"%3$s\" (%4$s): nenhum item sem associação tem o título \"%5$s\"; associe-o manualmente."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_SEVERAL="%1$s %2$d \"%3$s\" (%4$s): vários itens sem associação têm o título \"%5$s\" (IDs %6$s); associe o correto manualmente."
