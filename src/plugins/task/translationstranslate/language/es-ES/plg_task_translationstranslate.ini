PLG_TASK_TRANSLATIONSTRANSLATE="Tarea - Traducir traducciones"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="Traduce los elementos en espera en la cola de traducciones según una programación."
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="Traducir elementos en cola"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="Crea un borrador de traducción para cada elemento que esté esperando uno, listo para que un traductor lo revise. Cada ejecución traduce elementos hasta que se agote su lote o su tiempo; la siguiente ejecución continúa. Un elemento demasiado largo para traducirse en una sola solicitud se traduce en partes a lo largo de tantas ejecuciones como sean necesarias, y las partes ya hechas se conservan entre tanto. Un elemento que falla tres veces se aparta y no se vuelve a enviar."
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="Tamaño del lote"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="La mayor cantidad de elementos traducidos en una ejecución. Cada uno equivale a al menos una solicitud al proveedor de traducción, y un elemento largo son varias, por lo que un lote grande hace que la ejecución sea larga."
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="Tiempo por ejecución (segundos)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="Cuánto tiempo puede una ejecución seguir enviando solicitudes; la ejecución se detiene antes de una solicitud que probablemente no terminaría a tiempo, y la siguiente ejecución continúa. 0 significa 25 segundos a través de la web y 240 segundos desde la línea de comandos. Con Webcron llamado cada minuto, 110 es un buen valor cuando su alojamiento permite que una solicitud web se ejecute durante unos dos minutos. Mantenga el tiempo de espera de la tarea en las opciones de tareas programadas bastante por encima de ese valor, por ejemplo 600."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="Otra ejecución de traducción todavía está ocupada, así que esta ejecución no hizo nada; los elementos en espera se dejan a esa ejecución."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="No hay nada esperando una traducción."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="Se tradujeron %d partes de elementos demasiado largos para traducirse en una sola solicitud; las siguientes ejecuciones continúan con el resto."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="Se crearon %1$d borradores de traducción; %2$d elementos siguen esperando."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="No se pudieron traducir %1$d elementos; %2$d de ellos fallaron por tercera vez y han sido apartados. Último error: %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="Reintentar traducciones fallidas"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="Otorga un nuevo conjunto de intentos a las traducciones que la tarea de traducción apartó tras tres intentos fallidos. Ejecútela una vez se haya solucionado la causa de los fallos, como un modelo inválido o un saldo de crédito vacío."
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d traducciones fallidas están pendientes de nuevo."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_TITLE="Poner en línea las traducciones anteriores con su origen"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_DESC="Para un sitio web que ya tenía traducciones antes de usar Comentarios del traductor, hechas a mano o con otra herramienta. Una traducción hecha por Comentarios del traductor obtiene su lugar en el menú, una página de inicio para su idioma, enlaces a las páginas de su propio idioma y módulos de menú cuando se crea; esto hace lo mismo una vez para las traducciones que ya existen. Una traducción es cualquier elemento asociado a un elemento en el idioma de origen. No se vuelve a traducir nada, excepto los títulos de los módulos de menú copiados. Ejecútelo una vez, después de una copia de seguridad; volver a ejecutarlo solo cambia lo que ya no está en línea."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_LABEL="Orden del menú"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_DESC="Coloca los elementos de menú traducidos en el orden de su origen entre sus hermanos, u ordenados por el título traducido cuando el principal del origen así lo pida. Solo se mueven los elementos bajo la traducción del principal de su origen; se pierde un orden hecho a mano en un menú traducido."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_LABEL="Páginas de inicio"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_DESC="Hace que la traducción de la página de inicio del idioma de origen sea la página de inicio de cada idioma que no tenga ninguna, para que el idioma aparezca en el selector de idiomas."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_LABEL="Dato de los elementos de menú"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_DESC="Apunta los elementos de menú que los elementos de menú traducidos nombran en sus datos -un destino de un alias, una redirección de conexión o desconexión, categorías destacadas- hacia sus traducciones."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_LABEL="Enlaces"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_DESC="Apunta los elementos de menú traducidos a la traducción del artículo, categoría o etiqueta que abren, y los enlaces internos en los textos traducidos a las páginas de su propio idioma, donde estas existan. Con la opción Imágenes traducidas activada, también las imágenes en los textos traducidos a sus traducciones."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_LABEL="Módulos de menú"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_DESC="Da a cada menú traducido una copia de cada módulo de menú de su menú de origen, en las traducciones de las páginas del módulo de origen. Un módulo de menú ya creado para el menú traducido, en el mismo cargo y empezando en el mismo nivel de acceso, se conserva y se toma como la copia; se le añaden las páginas que le faltan."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_ORDER="Orden del menú: %d menús traducidos puestos en el orden de su origen."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_HOMES="Páginas de inicio: %d idiomas obtuvieron una página de inicio."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_PARAMS="Dato de los elementos de menú: %d elementos de menú traducidos cambiados."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_LINKS="Enlaces: %d elementos de menú traducidos y textos cambiados."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_MODULES="Módulos de menú: %d copiados."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_TITLE="Restaurar las traducciones perdidas"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DESC="Encuentra las traducciones realizadas mediante Comentarios del traductor que ya no están asociadas a su origen, y las vuelve a asociar. Joomla escribe las asociaciones de un elemento a partir de la lista en su formulario de edición, por lo que guardar un formulario abierto antes de que se hiciera una traducción deja esa traducción fuera; esta queda entonces por su cuenta y se traduciría por segunda vez. Una traducción se encuentra por el título con el que fue traducida, entre los elementos de su idioma que no tienen asociación; cuando varios tienen ese título, por su categoría. Exactamente una coincidencia se asocia; ninguna o varias se informan, con los ids entre los que elegir."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_LABEL="Ejecución de prueba"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_DESC="Solo informar en el registro de la tarea de lo que se asociaría. Desactivar para asociar."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_ASSOCIATED="%1$s %2$d \"%3$s\" (%4$s): asociado con %6$s, titulado \"%5$s\"."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DONE="%1$d traducciones asociadas de nuevo con su origen, %2$d por asociar a mano."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DRY_RUN="[Ejecución de prueba]"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NEXT="Ejecutar a continuación \"Poner las traducciones anteriores en línea con su origen\", para que los elementos de menú y los enlaces apunten a las traducciones asociadas de nuevo."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NONE="%1$s %2$d \"%3$s\" (%4$s): ningún elemento sin asociación se titula \"%5$s\"; asócielo a mano."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_SEVERAL="%1$s %2$d \"%3$s\" (%4$s): varios elementos sin asociación se titulan \"%5$s\" (ids %6$s); asocie el correcto a mano."
