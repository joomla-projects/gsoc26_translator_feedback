PLG_TASK_TRANSLATIONSTRANSLATE="Task - Translations Translate"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="Translates the items waiting in the Translations queue on a schedule."
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="Translate Queued Items"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="Creates a translation draft for each item waiting on one, ready for a translator to review. Each run translates items until its batch or its time is used up; the next run carries on. An item too long to translate in one request is translated in parts over as many runs as it takes, and the parts done are kept in between. An item that fails three times is set aside and not sent again."
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="Batch Size"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="The most items translated in one run. Each one is at least one request to the translation provider, and a long item is several, so a large batch makes a long run."
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="Time per Run (seconds)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="How long one run may keep sending requests; the run stops before a request that would probably not finish in time, and the next run carries on. 0 means 25 seconds over the web and 240 seconds from the command line. With Web Cron called every minute, 110 is a good value when your hosting lets a web request run about two minutes. Keep the Task Timeout in the Scheduled Tasks options well above it, for example 600."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="Another translate run is still busy, so this run did nothing; the waiting items are left to that run."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="Nothing is waiting on a translation."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="Translated %d parts of items too long to translate in one request; the next runs carry on with the rest."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="Created %1$d translation drafts; %2$d items still waiting."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="%1$d items could not be translated; %2$d of them failed for the third time and are set aside. Last error: %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="Retry Failed Translations"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="Gives the translations that the translate task set aside after three failed attempts a new set of attempts. Run it once the cause of the failures is fixed, such as an invalid model or an empty credit balance."
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d failed translations are pending again."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_TITLE="Bring Earlier Translations in Line with Their Source"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_DESC="For a site that already had translations before Translator Feedback was used, made by hand or with another tool. A translation made by Translator Feedback gets its place in the menu, a home page for its language, links to the pages of its own language and menu modules when it is made; this does the same once for the translations that are already there. A translation is any item associated with an item in the source language. Nothing is translated again, except the titles of copied menu modules. Run it once, after a backup; running it again changes only what is no longer in line."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_LABEL="Menu Order"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_DESC="Puts translated menu items in the order of their source among their siblings, or sorted by translated title where the source's parent asks for that. Only items under the translation of their source's parent are moved; an order made by hand in a translated menu is lost."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_LABEL="Home Pages"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_DESC="Makes the translation of the source language's home page the home page of each language that has none, so the language shows in the language switcher."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_LABEL="Menu Item Settings"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_DESC="Points the menu items that translated menu items name in their settings - an alias's target, a login or logout redirect, featured categories - at their translations."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_LABEL="Links"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_DESC="Points translated menu items at the translation of the article, category or tag they open, and the internal links in translated texts at the pages of their own language, where those exist."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_LABEL="Menu Modules"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_DESC="Gives each translated menu a copy of each menu module of its source menu, on the translations of the source module's pages. A menu module already made for the translated menu, at the same position and starting at the same level, is kept and taken as the copy; it gets the pages it is missing."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_ORDER="Menu order: %d translated menus put in the order of their source."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_HOMES="Home pages: %d languages got a home page."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_PARAMS="Menu item settings: %d translated menu items changed."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_LINKS="Links: %d translated menu items and texts changed."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_MODULES="Menu modules: %d copied."
