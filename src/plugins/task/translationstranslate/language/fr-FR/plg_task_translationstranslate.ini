PLG_TASK_TRANSLATIONSTRANSLATE="Tâche - Traduction des traductions"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="Traduit les éléments en attente dans la file des traductions selon une planification."
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="Traduire les éléments en file d'attente"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="Crée un brouillon de traduction pour chaque élément en attente, prêt à être relu par un traducteur. Chaque exécution traduit des éléments jusqu'à épuisement de son lot ou de son temps ; l'exécution suivante continue. Un élément trop long pour être traduit en une seule requête est traduit en plusieurs parties sur autant d'exécutions que nécessaire, et les parties déjà faites sont conservées entre-temps. Un élément qui échoue trois fois est mis de côté et n'est plus renvoyé."
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="Taille du lot"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="Le nombre maximal d'éléments traduits en une exécution. Chacun représente au moins une requête au fournisseur de traduction, et un élément long en représente plusieurs, donc un lot important rend l'exécution longue."
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="Temps par exécution (secondes)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="Durée pendant laquelle une exécution peut continuer à envoyer des requêtes ; l'exécution s'arrête avant une requête qui ne finirait probablement pas à temps, et l'exécution suivante prend le relais. 0 signifie 25 secondes sur le web et 240 secondes en ligne de commande. Avec le Web Cron appelé chaque minute, 110 est une bonne valeur quand votre hébergement permet à une requête web de s'exécuter environ deux minutes. Gardez le délai d'expiration de la tâche dans les paramètres des tâches planifiées bien au-dessus, par exemple 600."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="Une autre exécution de traduction est encore en cours, cette exécution n'a donc rien fait ; les éléments en attente sont laissés à cette exécution."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="Rien n'est en attente de traduction."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="%d parties d'éléments trop longs pour être traduits en une seule requête ont été traduites ; les exécutions suivantes continuent avec le reste."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="%1$d brouillons de traduction créés ; %2$d éléments encore en attente."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="%1$d éléments n'ont pas pu être traduits ; %2$d d'entre eux ont échoué une troisième fois et sont mis de côté. Dernière erreur : %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="Réessayer les traductions échouées"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="Donne aux traductions mises de côté par la tâche de traduction après trois tentatives échouées une nouvelle série de tentatives. À exécuter une fois la cause des échecs corrigée, comme un modèle invalide ou un solde de crédit épuisé."
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d traductions échouées sont de nouveau en attente."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_TITLE="Mettre les traductions antérieures en accord avec leur source"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_DESC="Pour un site qui avait déjà des traductions avant l'utilisation du retour de traducteur, faites à la main ou avec un autre outil. Une traduction faite par le retour de traducteur obtient sa place dans le menu, une page d'accueil pour sa langue, des liens vers les pages de sa propre langue et des modules de menu lorsqu'elle est créée ; ceci fait de même une fois pour les traductions déjà présentes. Une traduction est tout article associé à un article dans la langue source. Rien n'est retraduit, à l'exception des titres des modules de menu copiés. Exécutez-la une fois, après une sauvegarde ; l'exécuter à nouveau ne change que ce qui n'est plus en accord."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_LABEL="Ordre des menus"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_DESC="Place les liens de menu traduits dans l'ordre de leur source parmi leurs éléments de même niveau, ou triés par titre traduit lorsque le parent de la source le demande. Seuls les liens situés sous la traduction du parent de leur source sont déplacés ; un ordre établi manuellement dans un menu traduit est perdu."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_LABEL="Pages d'accueil"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_DESC="Fait de la traduction de la page d'accueil de la langue source la page d'accueil de chaque langue qui n'en a pas, afin que la langue apparaisse dans le changement de langue."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_LABEL="Paramètres des liens de menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_DESC="Fait pointer les liens de menu qui désignent des liens de menu traduits dans leurs paramètres - la cible d'un alias, une redirection de connexion ou de déconnexion, des catégories épinglées - vers leurs traductions."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_LABEL="Liens"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_DESC="Pointe les liens de menu traduits vers la traduction de l'article, de la catégorie ou du tag qu'ils ouvrent, et les liens internes dans les textes traduits vers les pages de leur propre langue, lorsqu'elles existent. Avec le paramètre Images traduites activé, également les images dans les textes traduits vers leurs traductions."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_LABEL="Modules de menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_DESC="Donne à chaque menu traduit une copie de chaque module de menu de son menu source, sur les traductions des pages du module source. Un module de menu déjà créé pour le menu traduit, à la même position et commençant au même niveau, est conservé et considéré comme la copie ; il reçoit les pages qui lui manquent."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_ORDER="Ordre des menus : %d menus traduits placés dans l'ordre de leur source."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_HOMES="Pages d'accueil : %d langues ont obtenu une page d'accueil."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_PARAMS="Paramètres des liens de menu : %d liens de menu traduits modifiés."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_LINKS="Liens : %d liens de menu traduits et textes modifiés."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_MODULES="Modules de menu : %d copiés."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_TITLE="Restaurer les traductions perdues"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DESC="Trouve les traductions effectuées par Retour du traducteur qui ne sont plus associées à leur source, et les associe à nouveau. Joomla! écrit les associations d'un article à partir de la liste présente dans son formulaire d'édition ; ainsi, enregistrer un formulaire ouvert avant qu'une traduction ne soit faite laisse cette traduction de côté ; elle se retrouve alors isolée et serait traduite une seconde fois. Une traduction est retrouvée grâce au titre avec lequel elle a été traduite, parmi les articles de sa langue qui n'ont aucune association ; lorsque plusieurs ont ce titre, par sa catégorie. Exactement une correspondance est associée ; aucune ou plusieurs sont signalées, avec les identifiants parmi lesquels choisir."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_LABEL="Essai à blanc"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_DESC="Rapporter uniquement dans le journal de la tâche ce qui serait associé. Désactiver pour associer."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_ASSOCIATED="%1$s %2$d \"%3$s\" (%4$s) : associé avec %6$s, intitulé \"%5$s\"."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DONE="%1$d traductions associées à nouveau avec leur source, %2$d à associer manuellement."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DRY_RUN="[Essai à blanc]"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NEXT="Exécuter ensuite \"Mettre les traductions antérieures en conformité avec leur source\", afin que les liens de menu et les liens pointent vers les traductions associées à nouveau."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NONE="%1$s %2$d \"%3$s\" (%4$s) : aucun article sans association n'est intitulé \"%5$s\" ; associer-le manuellement."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_SEVERAL="%1$s %2$d \"%3$s\" (%4$s) : plusieurs articles sans association sont intitulés \"%5$s\" (identifiants %6$s) ; associer le bon manuellement."
