PLG_TASK_TRANSLATIONSTRANSLATE="Attività - Traduzioni - Traduci"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="Traduce gli elementi in attesa nella coda Traduzioni secondo una pianificazione"
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="Traduci elementi in coda"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="Crea una bozza di traduzione per ogni elemento in attesa, pronta per la revisione di un traduttore. Ogni esecuzione traduce elementi finché il suo lotto o il suo tempo non è esaurito; l'esecuzione successiva prosegue. Un elemento troppo lungo da tradurre in un'unica richiesta viene tradotto in parti nel corso di tante esecuzioni quante ne servono, e le parti completate vengono mantenute nel frattempo. Un elemento che fallisce tre volte viene accantonato e non più rinviato"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="Dimensione del lotto"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="Il numero massimo di elementi tradotti in un'esecuzione. Ciascuno corrisponde ad almeno una richiesta al fornitore di traduzione, e un elemento lungo ne richiede diverse, quindi un lotto ampio rende l'esecuzione lunga"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="Tempo per esecuzione (secondi)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="Per quanto tempo un'esecuzione può continuare a inviare richieste; l'esecuzione si interrompe prima di una richiesta che probabilmente non terminerebbe in tempo, e l'esecuzione successiva prosegue. 0 significa 25 secondi via web e 240 secondi da riga di comando. Con Web Cron richiamato ogni minuto, 110 è un buon valore quando il tuo hosting consente a una richiesta web di durare circa due minuti. Mantieni il timeout attività nelle opzioni delle attività pianificate ben al di sopra, ad esempio 600"
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="Un'altra esecuzione di traduzione è ancora in corso, quindi questa esecuzione non ha fatto nulla; gli elementi in attesa sono lasciati a quell'esecuzione"
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="Nulla è in attesa di traduzione"
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="Tradotte %d parti di elementi troppo lunghi da tradurre in un'unica richiesta; le esecuzioni successive proseguono con il resto"
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="Create %1$d bozze di traduzione; %2$d elementi ancora in attesa"
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="%1$d elementi non è stato possibile tradurre; %2$d di essi sono falliti per la terza volta e sono stati accantonati. Ultimo errore: %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="Riprova traduzioni fallite"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="Riassegna un nuovo set di tentativi alle traduzioni che l'attività di traduzione ha accantonato dopo tre tentativi falliti. Eseguila una volta risolta la causa dei fallimenti, come un modello non valido o un saldo di credito esaurito"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d traduzioni fallite sono di nuovo in attesa"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_TITLE="Allinea le traduzioni precedenti alla loro origine"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_DESC="Per un sito che aveva già traduzioni prima che venisse usato il Feedback del traduttore, fatte a mano o con un altro strumento. Una traduzione creata dal Feedback del traduttore ottiene il suo posto nel menu, una home page per la sua lingua, link alle pagine della propria lingua e ai moduli di menu quando viene creata; questo fa lo stesso, una volta sola, per le traduzioni già presenti. Una traduzione è qualsiasi elemento associato a un elemento nella lingua di origine. Nulla viene tradotto di nuovo, eccetto i titoli dei moduli di menu copiati. Eseguila una volta, dopo un backup; eseguirla di nuovo cambia solo ciò che non è più allineato."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_LABEL="Ordinamento Menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_ORDER_DESC="Mette le voci di menu tradotte nell'ordine della loro origine tra le voci allo stesso livello, oppure ordinate per titolo tradotto dove il principale dell'origine lo richiede. Vengono spostate solo le voci sotto la traduzione del principale della loro origine; un ordinamento fatto a mano in un menu tradotto viene perso."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_LABEL="Homepage"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_HOMES_DESC="Rende la traduzione della homepage della lingua di origine la homepage di ogni lingua che non ne ha una, in modo che la lingua compaia nel selettore della lingua."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_LABEL="Impostazioni Voce di Menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_PARAMS_DESC="Punta le voci di menu che le voci di menu tradotte indicano nelle loro impostazioni - l'obiettivo di un alias, un reindirizzamento di accesso o uscita, categorie in evidenza - alle loro traduzioni."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_LABEL="Link"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LINKS_DESC="Punta le voci di menu tradotte alla traduzione dell'articolo, categoria o tag che aprono, e i link interni nei testi tradotti alle pagine della propria lingua, dove esistono. Con l'opzione Immagini Tradotte attiva, anche le immagini nei testi tradotti alle loro traduzioni."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_LABEL="Moduli Menu"
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_MODULES_DESC="Dà a ogni menu tradotto una copia di ogni modulo menu del suo menu di origine, sulle traduzioni delle pagine del modulo di origine. Un modulo menu già creato per il menu tradotto, nella stessa posizione e a partire dallo stesso livello, viene mantenuto e preso come copia; riceve le pagine che gli mancano."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_ORDER="Ordinamento menu: %d menu tradotti messi nell'ordine della loro origine."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_HOMES="Homepage: %d lingue hanno ricevuto una homepage."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_PARAMS="Impostazioni voce di menu: %d voci di menu tradotte modificate."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_LINKS="Link: %d voci di menu tradotte e testi modificati."
PLG_TASK_TRANSLATIONSTRANSLATE_ALIGN_LOG_MODULES="Moduli menu: %d copiati."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_TITLE="Ripristina Traduzioni Perse"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DESC="Trova le traduzioni fatte da Translator Feedback che non sono più associate alla loro origine, e le associa di nuovo. Joomla scrive le associazioni di un elemento dalla lista nel suo form di modifica, quindi salvare un form aperto prima che venisse fatta una traduzione esclude quella traduzione; questa rimane quindi isolata e verrebbe tradotta una seconda volta. Una traduzione viene trovata dal titolo con cui è stata tradotta, tra gli elementi della sua lingua che non hanno associazione; dove più elementi hanno quel titolo, dalla sua categoria. Esattamente una corrispondenza viene associata; nessuna o più vengono segnalate, con gli id tra cui scegliere."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_LABEL="Prova a Vuoto"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_DRY_RUN_DESC="Segnala solo nel log dell'attività cosa verrebbe associato. Disattiva per associare."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_ASSOCIATED="%1$s %2$d \"%3$s\" (%4$s): associato con %6$s, intitolato \"%5$s\"."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DONE="%1$d traduzioni associate di nuovo alla loro origine, %2$d da associare manualmente."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_DRY_RUN="[Prova a vuoto]"
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NEXT="Esegui poi \"Allinea Traduzioni Precedenti alla Loro Origine\", così le voci di menu e i link puntano alle traduzioni associate di nuovo."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_NONE="%1$s %2$d \"%3$s\" (%4$s): nessun elemento senza associazione è intitolato \"%5$s\"; associalo manualmente."
PLG_TASK_TRANSLATIONSTRANSLATE_REASSOCIATE_LOG_SEVERAL="%1$s %2$d \"%3$s\" (%4$s): più elementi senza associazione sono intitolati \"%5$s\" (id %6$s); associa quello giusto manualmente."
