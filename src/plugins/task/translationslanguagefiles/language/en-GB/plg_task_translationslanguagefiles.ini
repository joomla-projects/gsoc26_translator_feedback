PLG_TASK_TRANSLATIONSLANGUAGEFILES="Task - Translations Language Files"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_XML_DESCRIPTION="Translates the language files of Translator Feedback into the site's content languages with the site's translation rules, and delivers them as one download laid out like the package, as an installable package per language, or installed on the site directly."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_TITLE="Translate Translator Feedback's Language Files"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_DESC="Translates the en-GB language files of the Translator Feedback component and plugins into the content languages, with the published translation rules of each language. Each run sends requests until its time is used up; the next run carries on. A string is translated again only when its English text changes."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_STATUS_LABEL="Progress"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_STATUS_LANGUAGE="Language"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_STATUS_TRANSLATED="Translated"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_STATUS_FAILED="Set Aside"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_DOWNLOAD="Download All for the Repository"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_LANGUAGES_LABEL="Languages"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_LANGUAGES_DESC="The content languages to translate into. Leave empty for every published content language except English (en-GB)."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_REQUEST_SIZE_LABEL="Strings per Request"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_REQUEST_SIZE_DESC="The most distinct texts sent to the provider in one request. A text that occurs in several language files is sent once. A request that fails is retried at half this size."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_TIME_BUDGET_LABEL="Time per Run (seconds)"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_TIME_BUDGET_DESC="How long one run may keep sending requests; the run stops before a request that would probably not finish in time, and the next run carries on. 0 means 25 seconds over the web and 240 seconds from the command line."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_LOG_NO_COMPONENT="The Translations component is not installed or not enabled, so there are no rules and no translation provider to translate with."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_LOG_NO_FILES="No en-GB language files of the Translator Feedback package were found on this site."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_LOG_NO_LANGUAGES="There is no published content language to translate into."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_LOG_BUSY="Another run of this task is still busy, so this run did nothing."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_LOG_NONE="Nothing left to translate. Download the files from the task's form."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_LOG_TRANSLATED="Translated %1$d language strings; %2$d still pending. Download the files from the task's form."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_LOG_FAILED="%1$d language strings could not be translated; %2$d of them failed for the third time and are set aside. Last error: %3$s"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_RESETFAILED_TITLE="Retry Failed Language File Strings"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_RESETFAILED_DESC="Gives the language file strings that were set aside after three failed attempts a new set of attempts."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_RESETFAILED_LOG="%d failed language strings will be translated again."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_FORGET_TITLE="Forget Translated Language Files"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_FORGET_DESC="Deletes the stored translations of the language files, so the next run translates them again from scratch, for instance after the rules have improved. This cannot be undone."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_FORGET_LANGUAGES_LABEL="Languages"
PLG_TASK_TRANSLATIONSLANGUAGEFILES_FORGET_LANGUAGES_DESC="The languages whose translations are forgotten. Leave empty for all of them."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_FORGET_LOG="Forgot %1$d translated language strings (%2$s)."
PLG_TASK_TRANSLATIONSLANGUAGEFILES_DELIVER_INTRO="The translations are stored, so the files can be fetched again at any time: one download for the repository, an installable package per language, or that package installed on this site straight away. A newer package of a language replaces the older one."
